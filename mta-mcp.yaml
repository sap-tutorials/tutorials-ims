_schema-version: 3.3.0
# MTA descriptor for the MCP-auth microservice (tutorials-mcp).
# Deployed SEPARATELY from the main tutorials-ims MTA (.deploy/mta.yaml).
# This file lives at repo root → path: gen/srv-mcp (root-relative, no ../).
# before-all runs from ROOT (no cd ..) — mbt uses the descriptor's directory as cwd.
ID: tutorials-mcp
version: 1.0.0

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm install
        - bash -c "node scripts/bundle-shared.cjs && npx cds build --production"
        # @tutorials/core and @tutorials/mcp are workspace packages resolved via
        # esbuild bundles in gen/srv-mcp/srv/lib/_shared/. Remove them from the
        # gen/srv-mcp/package.json before mbt packages the module, otherwise
        # `npm install` inside gen/srv-mcp creates dangling symlinks to
        # gen/srv-mcp/packages/{core,mcp} which mbt cannot archive.
        - bash -c "node -e \"const p=require('./gen/srv-mcp/package.json'); delete p.dependencies['@tutorials/core']; delete p.dependencies['@tutorials/mcp']; require('fs').writeFileSync('./gen/srv-mcp/package.json', JSON.stringify(p,null,2)+'\n');\""

modules:
  - name: tutorials-srv-mcp
    type: nodejs
    path: gen/srv-mcp
    parameters:
      memory: 1024M
      disk-quota: 1024M
      buildpack: nodejs_buildpack
      instances: 1
    properties:
      NODE_ENV: production
      EXPOSE_CAP_UI: false
    provides:
      - name: srv-mcp-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: tutorials-hana
      - name: tutorials-credstore
      - name: tutorials-xsuaa-mcp
      # #1105 C1 — Step F resolution: outbound CC token for the write-forward
      # path comes from the BTP Destination Service (destination name:
      # tutorials-main-srv-api, Authentication: OAuth2ClientCredentials).
      # Binding this service does NOT affect inbound JWT validation; CAP's
      # auth strategy remains tutorials-xsuaa-mcp. The Cloud SDK resolves the
      # named destination at runtime to produce the CC token for main-srv.
      - name: tutorials-destination

resources:
  - name: tutorials-xsuaa-mcp
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      service-name: tutorials-xsuaa-mcp
      config-path: xs-security-mcp.json

  # tutorials-hana is deployed and owned by the main tutorials-ims MTA.
  # This MTA adopts it as an existing service to bind srv-mcp to the same HANA container.
  - name: tutorials-hana
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: tutorials-hana

  # tutorials-credstore is deployed and owned by the main tutorials-ims MTA.
  # Shared binding so srv-mcp can resolve BTP Credential Store secrets.
  - name: tutorials-credstore
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: tutorials-credstore

  # tutorials-destination is deployed and owned by the main tutorials-ims MTA.
  # Shared binding so the Cloud SDK can resolve the tutorials-main-srv-api
  # destination at runtime (OAuth2ClientCredentials → CC token for main-srv).
  - name: tutorials-destination
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: tutorials-destination
