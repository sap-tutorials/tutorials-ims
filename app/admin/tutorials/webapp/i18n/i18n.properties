# i18n strings for the admin Tutorials Fiori Elements app
# Created for the rebuild-tutorial-button feature (spec: 2026-06-24-admin-tutorial-rebuild-button-design.md)

# Rebuild action button (admin-ui rebuild-button feature)
RebuildTutorialButton=Rebuild this tutorial
RebuildTutorialDialogTitle=Rebuild tutorial
RebuildTutorialDialogMessage=Rebuild tutorial "{0}"? This dispatches a workflow that re-validates and republishes the tutorial (about 2 minutes). Dispatch only queues the rebuild — if validation fails, the tutorial is quarantined and NOT published. Check the "Active Quarantine" section afterwards for the real outcome.
RebuildTutorialToastSuccess=Rebuild dispatched for "{0}" — this only means the workflow was queued, not that publishing succeeded. In ~2 minutes, reload this page: a healthy rebuild shows no "Active Quarantine" rows; a failed one lists the quarantine reason there.
RebuildTutorialToastError=Could not dispatch rebuild:
