#XTIT: Application title (admin tile, browser tab)
appTitle=Personal Access Tokens

#YDES: Application description
appDescription=Mint and manage personal access tokens for MCP headless access.

# --- Mint (#1132) ---
#XBUT: List Report toolbar button
mint.action=Mint Token
#XTIT: Mint dialog title
mint.dialogTitle=Mint Personal Access Token
#XFLD: Name field label
mint.fieldName=Name
#XFLD: Name field placeholder
mint.fieldNamePlaceholder=e.g. claude-desktop
#XFLD: Scopes field label
mint.fieldScopes=Scopes
#XFLD: Scopes field placeholder
mint.fieldScopesPlaceholder=Select one or more scopes
#XFLD: TTL field label
mint.fieldTtl=Validity
#XFLD: TTL unit suffix
mint.fieldTtlUnit=days
#XBUT: Confirm mint
mint.buttonMint=Mint
#XBUT: Cancel
mint.buttonCancel=Cancel
#YMSG: Validation — name required
mint.errorNameRequired=Please enter a name for this token.
#YMSG: Validation — at least one scope required
mint.errorScopesRequired=Please select at least one scope.
#YMSG: Generic mint failure ({0} = server detail)
mint.errorGeneric=Could not mint token: {0}

# --- Minted token one-time display (#1132) ---
#XTIT: Minted-token dialog title
minted.dialogTitle=Token Minted
#YMSG: One-time warning strip
minted.warning=Copy this token now. For security it is shown only once and cannot be retrieved again.
#XFLD: Token field label
minted.fieldToken=Token
#XBUT: Copy to clipboard
minted.buttonCopy=Copy
#XBUT: Close
minted.buttonClose=Done
#YMSG: Hint about the stored prefix
minted.prefixHint=Only the token prefix is stored for identification. The full value is never persisted.
#YMSG: Copy success toast
minted.copied=Token copied to clipboard.
#YMSG: Copy fallback (clipboard unavailable)
minted.copyFailed=Copy is unavailable in this browser. Select the token text and copy it manually.
