aiGradingSection=AI Grading (free-text + code-check)
validateAnswerEnabled=Free-text answer grading
validateAnswerEnabledHelp=When on, [VALIDATE_N] free-text questions are graded by the LLM. When off, the inline widget shows "Answer checking is temporarily unavailable" and the /api/validate-answer endpoint returns 503. Default off — flipping this on starts consuming AI Core tokens per submission.
codeCheckEnabled=AI code-check
codeCheckEnabledHelp=When on, [CODECHECK_N] blocks call the LLM grader and the checkCode tool is wired into the chat. When off, the /api/codecheck endpoint returns 503. Default off — flipping this on starts consuming AI Core tokens per submission.

branchingSection=Tutorial Branching Pilot (issue #172)
branchingEnabled=Enable adaptive branching
branchingEnabledHelp=When on, learners get profile-aware mission alt-groups, the getBranchRecommendation Joule tool is registered, and the "Branching is currently disabled" info strip in /me/ Learning Preferences disappears. When off (default), preferences are still collected but ignored by the engine. See docs/authors/pilot-runbook.md for the Phase 3 rollout procedure. Rollback by flipping this back off — no redeploy required.

communityPeersSection=Community Peers (issue #1126)
communityPeersEnabled=Enable community peers
communityPeersEnabledHelp=When on, the findCommunityPeers Joule tool is registered and "what to learn next" answers surface sibling tutorials from the same Louvain community, headed by the LLM-generated cluster label. When off (default), the tool is not registered. Depends on the nightly community-detection (03:57 UTC) and labeling (04:12 UTC) jobs having populated cluster data — flipping this on before clusters exist yields empty peer sets, not an error. Rollback by flipping this back off — no redeploy required.
communityLabelBudget=Daily label LLM budget
communityLabelBudgetHelp=Caps how many communities the nightly labeling job (04:12 UTC) will LLM-name per day. A fresh install ramps its backlog over several nights at this rate. Only communities whose full member set changed are re-labeled; stable clusters cost zero calls. Default 50.

puzzleHintSection=Crossword Puzzle Hints
puzzleHintEnabled=Enable puzzle hint tool
puzzleHintEnabledHelp=When on, the puzzleHint Joule tool is registered on crossword puzzle pages so Joule can coach on cryptic clues — clue text, enumeration, wordplay type, and the solver's own correct crossing letters — without ever seeing or revealing the answer. When off (default), the tool is not registered and Joule falls back to general cryptic-technique coaching. Rollback by flipping this back off — no redeploy required.

kgToolsSection=Knowledge Graph Tools
kgPathBetweenEnabled=Learning-path tool (findLearningPath)
kgPathBetweenEnabledHelp=When on, the findLearningPath Joule tool is registered so learners can ask for an ordered tutorial sequence toward a goal ("show me a path to HANA Cloud deployment", "what should I learn next?"). When off (default), the tool is not registered and Joule will say it can't compute a path between tutorials. Backed by the KG_QUERY 3-arm SPARQL (prereq / co-completed / shared-concept). Rollback by flipping this back off — no redeploy required.
kgSearchExpansionEnabled=Search expansion tool (expandSearchConcepts)
kgSearchExpansionEnabledHelp=When on (default), the expandSearchConcepts Joule tool broadens topic searches by walking one hop along concept edges before keyword search. Cheap: 1 embed + 1 cosine scan + 1-hop walk. Toggle off only if telemetry shows problems.
searchKgRerankEnabled=KG-boosted search ranking
searchKgRerankEnabledHelp=When on (default), server-side search results are re-ranked by concept overlap (fuzzy + KG score) and searchTutorials hits gain a rationale. Also gates the community search weight below — that weight has no effect while this is off. Same cheap cost profile as search expansion.
communityRankWeight=Community search weight
communityRankWeightHelp=Additive rank boost (0–5) for tutorials sharing a Louvain community with the query's top concept-overlap hits (#1171). 0 (default) = OFF, byte-identical to plain KG ranking. Only takes effect when KG-boosted search ranking above is on. WARNING: broad queries whose anchors land in a large community cluster can see heavy reordering — review test/harness/community-rank-churn-report.md before raising. 1.0–1.5 is a defensible starting range. Supersedes the KG_COMMUNITY_WEIGHT env var (used only as a fallback when this is unset). No redeploy needed.
kgRelatedContentEnabled=Related-content tool (findRelatedContent)
kgRelatedContentEnabledHelp=When on (default), the findRelatedContent Joule tool surfaces external content (blogs, videos, docs) linked to the concepts of the current topic. Reuses the same cached embed+cosine as search expansion, then fans out over the external-content link tables. Toggle off if telemetry shows problems.

