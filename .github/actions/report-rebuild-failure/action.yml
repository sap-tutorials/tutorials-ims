name: Report rebuild failure (email via GitHub issue)
description: >-
  On a failed content rebuild, open (or comment on) a deduplicated GitHub issue
  assigned to the on-call owner so GitHub emails them natively — no SMTP/Slack
  secret required (#1373). On success, close the open failure issue for the same
  channel, which resets the consecutive-failure streak. Because each consecutive
  failure adds one comment to the same open issue, the comment count IS the
  consecutive-failure count; crossing `consecutive-threshold` escalates.

inputs:
  outcome:
    description: '"failure" to file/append, "success" to resolve (close) the open issue.'
    required: true
  channel:
    description: 'Rebuild channel/env used to dedup issues (e.g. "qa", "prod", "dev").'
    required: true
  repo:
    description: >-
      Repository to file/find/close the issue in (owner/name). Defaults to the
      repo running the workflow. Set to a source `-Contribution` repo to file a
      per-tutorial author issue there (requires the token to have issues:write
      on that repo — the tutorials GitHub App with Issues:RW, not the default
      job GITHUB_TOKEN, which is scoped to the running repo only).
    required: false
    default: ${{ github.repository }}
  slug:
    description: >-
      Optional tutorial slug. When set, the issue is per-tutorial (its own
      dedup marker + title) rather than the channel-level aggregate. Used for
      author content errors (missing/misnamed source file) so each tutorial
      gets its own issue in its source repo, assigned to / @-mentioning the
      author. Empty (default) keeps the channel-aggregate behavior (#1373).
    required: false
    default: ''
  run-url:
    description: 'Link to the failing (or succeeding) Actions run.'
    required: true
  trigger:
    description: 'github.event_name of the run (repository_dispatch, workflow_dispatch, ...).'
    required: false
    default: ''
  details:
    description: 'Extra one-line failure context (failure signature, mode, etc.).'
    required: false
    default: ''
  assignees:
    description: 'Comma-separated GitHub logins to assign (they receive the email).'
    required: false
    default: 'jung-thomas'
  label:
    description: 'Label used to find/dedup the failure issue.'
    required: false
    default: 'rebuild-failure'
  consecutive-threshold:
    description: 'Escalate (add rebuild-failure-escalated label + @mention) once the open issue reaches this many consecutive failures.'
    required: false
    default: '3'
  github-token:
    description: 'Token with issues:write on this repo. Defaults to the job GITHUB_TOKEN.'
    required: true

runs:
  using: composite
  steps:
    - name: Report / resolve rebuild failure issue
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ inputs.repo }}
        OUTCOME: ${{ inputs.outcome }}
        CHANNEL: ${{ inputs.channel }}
        SLUG: ${{ inputs.slug }}
        RUN_URL: ${{ inputs.run-url }}
        TRIGGER: ${{ inputs.trigger }}
        DETAILS: ${{ inputs.details }}
        ASSIGNEES: ${{ inputs.assignees }}
        LABEL: ${{ inputs.label }}
        THRESHOLD: ${{ inputs.consecutive-threshold }}
      run: |
        set -uo pipefail

        # Stable dedup marker so we find the same issue across runs without
        # depending on the exact title text. Channel-level by default; when a
        # SLUG is given it becomes per-tutorial (a slug-scoped marker + title)
        # so each author content error gets its own deduplicated issue in its
        # source repo instead of collapsing onto the channel aggregate.
        if [ -n "$SLUG" ]; then
          MARKER="<!-- rebuild-failure-marker channel=${CHANNEL} slug=${SLUG} -->"
          ISSUE_TITLE="🚨 tutorial source error: ${SLUG} (${CHANNEL})"
        else
          MARKER="<!-- rebuild-failure-marker channel=${CHANNEL} -->"
          ISSUE_TITLE="🚨 ${CHANNEL} content rebuild failing"
        fi
        ESCALATED_LABEL="rebuild-failure-escalated"

        # Locate an existing OPEN failure issue for this channel (and slug, when
        # set). Search by the dedup label, then match the hidden marker in the
        # body so per-channel / per-tutorial issues never collide.
        find_open_issue() {
          gh issue list --repo "$REPO" --state open --label "$LABEL" \
            --json number,body --limit 50 \
            --jq "[.[] | select(.body | contains(\"$MARKER\"))][0].number // empty" \
            2>/dev/null || true
        }

        ISSUE_NUM="$(find_open_issue)"

        if [ "$OUTCOME" = "success" ]; then
          # Success path — resolve any open failure issue for this channel and
          # reset the streak. No-op (exit 0) when there is nothing open.
          if [ -z "$ISSUE_NUM" ]; then
            echo "No open ${CHANNEL} rebuild-failure issue to resolve."
            exit 0
          fi
          gh issue comment "$ISSUE_NUM" --repo "$REPO" \
            --body "✅ Recovered — a subsequent **${CHANNEL}** content rebuild succeeded. Auto-closing; the consecutive-failure streak is reset. Run: ${RUN_URL}" \
            || echo "::warning::Could not comment recovery on #${ISSUE_NUM}"
          gh issue close "$ISSUE_NUM" --repo "$REPO" --reason completed \
            || echo "::warning::Could not auto-close #${ISSUE_NUM}"
          echo "Resolved #${ISSUE_NUM} (${CHANNEL} rebuild recovered)."
          exit 0
        fi

        # ---- failure path ----------------------------------------------------

        # Ensure the dedup label exists (idempotent; ignore "already exists").
        gh label create "$LABEL" --repo "$REPO" --color "B60205" \
          --description "Content-rebuild workflow failed (#1373 auto-filed)" 2>/dev/null || true

        ASSIGNEE_FLAGS=()
        IFS=',' read -ra _A <<< "$ASSIGNEES"
        for a in "${_A[@]}"; do
          a="$(echo "$a" | tr -d '[:space:]')"
          [ -n "$a" ] && ASSIGNEE_FLAGS+=(--assignee "$a")
        done

        DETAIL_LINE=""
        [ -n "$DETAILS" ] && DETAIL_LINE="- **Detail:** ${DETAILS}"

        if [ -z "$ISSUE_NUM" ]; then
          # First failure of a new streak — create the issue, then assign in a
          # SEPARATE step. Assignment is what triggers GitHub's native email,
          # but a per-tutorial author is often a fork contributor who is NOT
          # assignable on the source repo — passing them to `gh issue create`
          # would fail the WHOLE create (no issue at all). So we create first
          # (never blocked by a bad assignee) and best-effort assign after; the
          # @-mention in the body emails the author regardless of assignability.
          # Body is built with a single printf (no heredoc — an unindented
          # heredoc breaks the YAML block scalar; and per-line $(printf) would
          # have its trailing newlines stripped by command substitution,
          # collapsing the layout).
          DETAIL_BLOCK=""
          [ -n "$DETAIL_LINE" ] && DETAIL_BLOCK="${DETAIL_LINE}"$'\n'

          # @-mention every assignee in the body so the author is emailed even
          # when they can't be assigned (fork contributors on a source repo).
          MENTION_LINE=""
          for a in "${_A[@]}"; do
            a="$(echo "$a" | tr -d '[:space:]')"
            [ -n "$a" ] && MENTION_LINE="${MENTION_LINE} @${a}"
          done

          if [ -n "$SLUG" ]; then
            # Per-tutorial author content error (missing/misnamed source file).
            MENTION_BLOCK=""
            [ -n "$MENTION_LINE" ] && MENTION_BLOCK="- **Author:**${MENTION_LINE}"$'\n'
            BODY="$(printf '%s\n\n**Automated alert (#1373).** A **%s**-channel content rebuild could not fetch the source markdown for tutorial `%s`.\n\n- **Tutorial slug:** %s\n- **Channel:** %s\n- **Trigger:** %s\n- **Run:** %s\n%s%s\n**Most likely cause:** the primary tutorial markdown is missing or misnamed. It MUST be at `tutorials/%s/%s.md` (folder name and file name both equal the slug). If the file is named something else (e.g. `architecture.md`), rename it to `%s.md`.\n\nThe rebuild **skipped this tutorial and continued** — the rest of the channel published normally. Fix the source file and re-trigger the QA rebuild for this slug; a successful rebuild auto-closes this issue.\n' \
              "$MARKER" "$CHANNEL" "$SLUG" "$SLUG" "$CHANNEL" "$TRIGGER" "$RUN_URL" "$DETAIL_BLOCK" "$MENTION_BLOCK" "$SLUG" "$SLUG" "$SLUG")"
          else
            BODY="$(printf '%s\n\n**Automated alert (#1373).** A **%s** content rebuild failed.\n\n- **Channel:** %s\n- **Trigger:** %s\n- **First failing run:** %s\n%s\nThis issue is deduplicated per channel: each additional consecutive failure adds a comment below (so the comment count is the consecutive-failure count). A subsequent successful rebuild auto-closes this issue and resets the streak.\n\nConsecutive failures: **1**\n' \
              "$MARKER" "$CHANNEL" "$CHANNEL" "$TRIGGER" "$RUN_URL" "$DETAIL_BLOCK")"
          fi

          NEW_URL="$(gh issue create --repo "$REPO" \
            --title "$ISSUE_TITLE" \
            --label "$LABEL" \
            --body "$BODY")" \
            && echo "Filed new issue: ${NEW_URL}" \
            || { echo "::warning::Failed to create issue in ${REPO} (title: ${ISSUE_TITLE})"; exit 0; }

          # Best-effort assign — tolerate an unassignable (fork-contributor)
          # author; the @-mention already emailed them. Never fail the step.
          if [ "${#ASSIGNEE_FLAGS[@]}" -gt 0 ]; then
            gh issue edit "$NEW_URL" --repo "$REPO" "${ASSIGNEE_FLAGS[@]}" >/dev/null 2>&1 \
              || echo "::notice::Could not assign ${ASSIGNEES} on ${NEW_URL} (likely not a collaborator on ${REPO}); @-mention still notifies them."
          fi
          exit 0
        fi

        # Repeat failure — append a comment and recompute the streak. The streak
        # count = number of failure comments + the original body's count of 1.
        FAIL_COMMENTS="$(gh issue view "$ISSUE_NUM" --repo "$REPO" --json comments \
          --jq '[.comments[] | select(.body | contains("Consecutive failure #"))] | length' 2>/dev/null || echo 0)"
        COUNT=$(( FAIL_COMMENTS + 2 ))   # +1 original body, +1 this new comment

        FAIL_BODY="❌ Consecutive failure #${COUNT} (**${CHANNEL}**, trigger \`${TRIGGER}\`). Run: ${RUN_URL}"
        [ -n "$DETAILS" ] && FAIL_BODY="${FAIL_BODY}"$'\n'"${DETAIL_LINE}"
        gh issue comment "$ISSUE_NUM" --repo "$REPO" --body "$FAIL_BODY" \
          || echo "::warning::Could not comment failure on #${ISSUE_NUM}"

        # Re-assert assignees in case the issue was un-assigned since creation.
        [ "${#ASSIGNEE_FLAGS[@]}" -gt 0 ] && gh issue edit "$ISSUE_NUM" --repo "$REPO" "${ASSIGNEE_FLAGS[@]}" >/dev/null 2>&1 || true

        if [ "$COUNT" -ge "$THRESHOLD" ]; then
          gh label create "$ESCALATED_LABEL" --repo "$REPO" --color "5319E7" \
            --description "N+ consecutive rebuild failures (#1373)" 2>/dev/null || true
          gh issue edit "$ISSUE_NUM" --repo "$REPO" --add-label "$ESCALATED_LABEL" >/dev/null 2>&1 || true
          MENTIONS=""
          for a in "${_A[@]}"; do
            a="$(echo "$a" | tr -d '[:space:]')"
            [ -n "$a" ] && MENTIONS="${MENTIONS} @${a}"
          done
          gh issue comment "$ISSUE_NUM" --repo "$REPO" \
            --body "⚠️ **${COUNT} consecutive ${CHANNEL} rebuild failures** (threshold ${THRESHOLD}).${MENTIONS} This is the exact silent-failure signature from #1373 — please investigate the run above." \
            || echo "::warning::Could not post escalation on #${ISSUE_NUM}"
        fi

        echo "Appended failure #${COUNT} to #${ISSUE_NUM} (${CHANNEL})."
