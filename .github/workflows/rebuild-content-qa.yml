name: Rebuild Content (QA)

on:
  repository_dispatch:
    types: [tutorial-qa-updated]
  workflow_dispatch:
    inputs:
      slug:
        description: Refresh a single tutorial slug only (leave blank for full QA rebuild)
        required: false
        type: string
      ai-author-build-cap:
        description: 'Hard cap on AI-quiz LLM calls per build (overrides default 200). Use 10000 for first-time bulk seed.'
        required: false
        default: '200'
        type: string

env:
  NODE_VERSION: '22'
  CHANNEL: qa

jobs:
  rebuild-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Hugo
        run: curl -fsSL https://github.com/gohugoio/hugo/releases/download/v0.147.7/hugo_extended_0.147.7_linux-amd64.tar.gz | tar -xz -C /tmp hugo

      - name: Install dependencies
        run: npm ci

      - name: Restore QA tutorial cache
        uses: actions/cache@v4
        with:
          path: .tutorial-cache-qa
          key: tutorial-cache-qa-${{ hashFiles('.github/workflows/rebuild-content-qa.yml') }}-${{ github.run_id }}
          restore-keys: |
            tutorial-cache-qa-${{ hashFiles('.github/workflows/rebuild-content-qa.yml') }}-
            tutorial-cache-qa-

      # GitHub App token (preferred). Activates when repo variable
      # USE_GITHUB_APP=true and the TUTORIALS_APP_* secrets are populated.
      # While the variable is unset/false this step is skipped and the fetch
      # falls back to the classic PAT below.
      - name: Generate GitHub App token
        id: app-token
        if: ${{ vars.USE_GITHUB_APP == 'true' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.TUTORIALS_APP_ID }}
          private-key: ${{ secrets.TUTORIALS_APP_PRIVATE_KEY }}
          owner: sap-tutorials

      # [#208/#312] Construct VCAP_SERVICES for the AI-quiz fetch path. The
      # @sap-ai-sdk/orchestration SDK reads aicore credentials from
      # VCAP_SERVICES.aicore[0].credentials when no cds bind is in effect.
      # See docs/developers/operations/ai-author-ci-setup.md.
      # Always-on as of #312 (soak window 2026-06-13..2026-06-27 completed
      # clean). Kill-switch: set AI_AUTHOR_AICORE_SERVICE_KEY secret to empty.
      - name: Set up VCAP_SERVICES for AI authoring
        env:
          AICORE_CREDENTIALS_JSON: ${{ secrets.AI_AUTHOR_AICORE_SERVICE_KEY }}
        run: |
          if [ -z "${AICORE_CREDENTIALS_JSON}" ]; then
            echo "::error::AI_AUTHOR_AICORE_SERVICE_KEY secret is unset or empty. AI-quiz authoring is always-on post-#312 — see docs/developers/operations/ai-author-ci-setup.md."
            exit 1
          fi
          echo "${AICORE_CREDENTIALS_JSON}" | jq empty || { echo "::error::AI_AUTHOR_AICORE_SERVICE_KEY is not valid JSON"; exit 1; }
          VCAP=$(jq -nc --argjson creds "${AICORE_CREDENTIALS_JSON}" '{aicore: [{label: "aicore", name: "tutorials-aicore", instance_name: "tutorials-aicore", credentials: $creds, plan: "extended"}]}')
          echo "::add-mask::${VCAP}"
          echo "VCAP_SERVICES=${VCAP}" >> "$GITHUB_ENV"

      - name: Fetch QA tutorials (-Contribution repos)
        run: npm run fetch-tutorials:qa
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.TUTORIAL_FETCH_TOKEN || secrets.TUTORIALS_GITHUB_TOKEN }}
          # Required by scripts/parsers/cap.ts during fetch-tutorials Phase 4
          # (mission/group catalog fetch from the deployed srv). Without it,
          # the build defaults to http://localhost:4004 and fails with
          # "TypeError: fetch failed" since no local CAP runs in CI.
          # The QA channel uses the same /build/catalog endpoint as prod
          # (catalog content is the same; QA channel only differs in tutorial
          # source repos via ONLY_CONTRIBUTION_REPOS=true).
          CAP_BASE_URL: ${{ secrets.CAP_SRV_URL_DEV }}
          TUTORIAL_SLUG: ${{ github.event.client_payload.slug || inputs.slug }}
          # [#208/#275/#312] AI-quiz authoring on the QA channel. Always-on
          # post-#312 (2026-06-27). The QA channel is gated by Tutorial.Author
          # XSUAA scope so AI questions land somewhere safe to preview before
          # they reach the public site. Cost is bounded by author opt-in
          # (presence of [AUTOAUTHOR_*] directives) plus AI_AUTHOR_BUILD_CAP.
          AI_AUTHOR_BUILD_CAP: ${{ inputs.ai-author-build-cap }}
          CHAT_DEPLOYMENT_ID: ${{ secrets.CHAT_DEPLOYMENT_ID }}

      # Author-side smell detector. See rebuild-content.yml for rationale.
      # Runs against the QA cache (-Contribution repos) where author-side
      # smells originate before they're merged to the public sources.
      - name: Lint tutorial markdown (QA channel)
        env:
          TUTORIAL_AUTHOR_TOKEN: ${{ secrets.TUTORIAL_AUTHOR_TOKEN }}
          ANALYTICS_BASE_URL: ${{ vars.ANALYTICS_BASE_URL_QA || 'https://tutorial-system-dev-tutorials-srv-qa.cfapps.eu10-005.hana.ondemand.com/author' }}
        # XSUAA client-credentials tokens expire ~12h. v1 path is
        # workflow_dispatch only; cron-triggered runs may find the token
        # expired, in which case the staleness rule silently skips.
        run: npm run lint:tutorial-markdown -- --channel qa
        continue-on-error: true

      - name: Upload tutorial-markdown lint report (QA)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tutorial-markdown-lint-qa-${{ github.run_number }}
          path: .tutorial-cache-qa/lint-report.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Build QA Hugo site
        # Hugo was downloaded to /tmp/hugo (line 44). The build:qa npm script
        # invokes 'hugo' (bare binary name) — works locally where hugo is
        # system-installed, but in CI the binary lives at /tmp/hugo and isn't
        # on PATH. Prepend /tmp so npm finds it. Cheaper than installing to
        # /usr/local/bin which needs sudo. Issue: this run failed at #27883670683.
        run: PATH="/tmp:$PATH" npm run build:qa

      - name: Publish QA content to HANA
        run: npx tsx scripts/publish-content.ts --channel qa --initiator "ci/${{ github.run_id }}"
        env:
          CAP_QA_BASE_URL: ${{ secrets.CAP_SRV_URL_QA }}
          CONTENT_API_KEY_QA: ${{ secrets.CONTENT_API_KEY_QA }}

      - name: Summary
        run: |
          echo "### QA Content Rebuild Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Channel:** qa" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Trigger:** ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          SLUG="${{ github.event.client_payload.slug || inputs.slug }}"
          if [ -n "$SLUG" ]; then
            echo "- **Slug filter:** $SLUG (single-tutorial refresh)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "- **Source repo:** ${{ github.event.client_payload.repository }}" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- **AI authoring:** enabled (cap=${{ inputs.ai-author-build-cap }})" >> "$GITHUB_STEP_SUMMARY"
