name: Rebuild Content (QA)

on:
  repository_dispatch:
    types: [tutorial-qa-updated]
  workflow_dispatch:
    inputs:
      slug:
        description: Refresh a single tutorial slug only (leave blank for full QA rebuild)
        required: false
        type: string
      ai-author-build-cap:
        description: 'Hard cap on AI-quiz LLM calls per build (overrides default 200). Use 10000 for first-time bulk seed.'
        required: false
        default: '200'
        type: string
      content-cache:
        description: 'Workstream C (slug-targeted-delta-rebuild): on a slug-targeted QA run, reuse the generated-content cache to skip regenerating unchanged tutorials. Fail-open; ON by default. Pass -f content-cache=false to force a full regen for this run.'
        required: false
        type: boolean
        default: true
      force-publish:
        description: 'Seed/repair Option B ContentCurrent (QA): publish ALL slugs (dual-write everything), bypassing the changed-slug diff. Use for a one-time ContentCurrent re-seed after the delta flags were toggled. Default false. Mirrors rebuild-content.yml force-publish.'
        required: false
        type: boolean
        default: false

env:
  NODE_VERSION: '22'
  CHANNEL: qa

# Serialize QA rebuilds. The single srv-side `content-publish` JobLock
# (srv/lib/content-publish-session.js, 30-min TTL) admits ONE publish session
# at a time; two QA rebuilds racing it means the loser gets a hard
# 409 "Another publish in progress" and the run fails. This is the #1454
# mirror of the #1384 fix already on rebuild-content.yml — QA runs through a
# SEPARATE workflow (`tutorial-qa-updated`), so it never inherited that block,
# and bursts of QA dispatches (e.g. two merges to a -Contribution repo minutes
# apart) collided on the lock. QA is a single channel, so the group is static.
# cancel-in-progress:false because a rebuild that has already acquired the lock
# and is mid-publish must finish — cancelling it would strand the lock until its
# 30-min TTL and orphan the PUBLISHING manifest row.
concurrency:
  group: rebuild-content-qa
  cancel-in-progress: false

jobs:
  rebuild-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      # #1373 — the failure/recovery notifier opens, comments on, and closes a
      # deduplicated GitHub issue; assignment triggers GitHub's native email.
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Hugo
        run: curl -fsSL https://github.com/gohugoio/hugo/releases/download/v0.147.7/hugo_extended_0.147.7_linux-amd64.tar.gz | tar -xz -C /tmp hugo

      - name: Install dependencies
        run: |
          npm ci
          # [#1629] hugo-apps deps are NOT installed by the root `npm ci`
          # (global npmrc has ignore-scripts=true; hugo-apps is not a root
          # workspace). The "Build hugo-apps islands" step below needs them, so
          # install explicitly — mirrors rebuild-content.yml. QA always builds
          # the full site (no slug-targeted skip), so this is unconditional.
          npm --prefix hugo-apps install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Restore QA tutorial cache
        uses: actions/cache@v4
        with:
          path: .tutorial-cache-qa
          key: tutorial-cache-qa-${{ hashFiles('.github/workflows/rebuild-content-qa.yml') }}-${{ github.run_id }}
          restore-keys: |
            tutorial-cache-qa-${{ hashFiles('.github/workflows/rebuild-content-qa.yml') }}-
            tutorial-cache-qa-

      # Workstream C: content-cache fast-path flags for the QA channel. Mirrors
      # the "Determine effective rebuild mode" step of rebuild-content.yml, but
      # QA has no explicit mode — slug-targeted is inferred from a non-empty
      # effective slug (repository_dispatch client_payload.slug OR the workflow_
      # dispatch slug input). Computed HERE (not from inputs.* at the consuming
      # step) so repository_dispatch runs — the real author hotfix trigger — also
      # get the fast path.
      - name: Determine content-cache mode
        id: cc
        env:
          INPUT_CONTENT_CACHE: ${{ inputs.content-cache }}
          EFFECTIVE_SLUG: ${{ github.event.client_payload.slug || inputs.slug }}
        run: |
          CC_ENABLED=true
          if [ "$INPUT_CONTENT_CACHE" = "false" ]; then CC_ENABLED=false; fi
          echo "content_cache_enabled=$CC_ENABLED" >> "$GITHUB_OUTPUT"

          # slug-targeted iff a non-empty slug was supplied; else full QA rebuild.
          FAST_PATH=false
          if [ -n "$EFFECTIVE_SLUG" ] && [ "$CC_ENABLED" = "true" ]; then FAST_PATH=true; fi
          echo "fast_path=$FAST_PATH" >> "$GITHUB_OUTPUT"

      # Workstream C: RESTORE the previously-generated QA content tree so a
      # slug-targeted QA run can reuse unchanged tutorials. SLUG-TARGETED ONLY —
      # a full QA rebuild starts from an empty tree so deleted-upstream tutorials
      # don't linger as orphan pages (the prune reconciles only .tutorial-cache-qa,
      # not hugo/content-qa/tutorials). Full still primes via the SAVE step below.
      - name: Restore generated-content cache (QA)
        if: ${{ steps.cc.outputs.fast_path == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            hugo/content-qa/tutorials
            hugo/data-qa/image_dimensions.json
            .content-cache
          key: content-tree-qa-v1-${{ hashFiles('scripts/parsers/**', 'scripts/fetch-tutorials.ts', 'scripts/lib/content-cache.ts', 'scripts/lib/expand-ai-authored.ts') }}-${{ github.run_id }}
          restore-keys: |
            content-tree-qa-v1-${{ hashFiles('scripts/parsers/**', 'scripts/fetch-tutorials.ts', 'scripts/lib/content-cache.ts', 'scripts/lib/expand-ai-authored.ts') }}-

      # GitHub App token (preferred). Activates when repo variable
      # USE_GITHUB_APP=true and the TUTORIALS_APP_* secrets are populated.
      # While the variable is unset/false this step is skipped and the fetch
      # falls back to the classic PAT below.
      - name: Generate GitHub App token
        id: app-token
        if: ${{ vars.USE_GITHUB_APP == 'true' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.TUTORIALS_APP_ID }}
          private-key: ${{ secrets.TUTORIALS_APP_PRIVATE_KEY }}
          owner: sap-tutorials

      # [#208/#312] Construct VCAP_SERVICES for the AI-quiz fetch path. The
      # @sap-ai-sdk/orchestration SDK reads aicore credentials from
      # VCAP_SERVICES.aicore[0].credentials when no cds bind is in effect.
      # See docs/developers/operations/ai-author-ci-setup.md.
      # Always-on as of #312 (soak window 2026-06-13..2026-06-27 completed
      # clean). Kill-switch: set AI_AUTHOR_AICORE_SERVICE_KEY secret to empty.
      - name: Set up VCAP_SERVICES for AI authoring
        env:
          AICORE_CREDENTIALS_JSON: ${{ secrets.AI_AUTHOR_AICORE_SERVICE_KEY }}
        run: |
          if [ -z "${AICORE_CREDENTIALS_JSON}" ]; then
            echo "::error::AI_AUTHOR_AICORE_SERVICE_KEY secret is unset or empty. AI-quiz authoring is always-on post-#312 — see docs/developers/operations/ai-author-ci-setup.md."
            exit 1
          fi
          echo "${AICORE_CREDENTIALS_JSON}" | jq empty || { echo "::error::AI_AUTHOR_AICORE_SERVICE_KEY is not valid JSON"; exit 1; }
          VCAP=$(jq -nc --argjson creds "${AICORE_CREDENTIALS_JSON}" '{aicore: [{label: "aicore", name: "tutorials-aicore", instance_name: "tutorials-aicore", credentials: $creds, plan: "extended"}]}')
          echo "::add-mask::${VCAP}"
          echo "VCAP_SERVICES=${VCAP}" >> "$GITHUB_ENV"

      - name: Fetch QA tutorials (-Contribution repos)
        run: npm run fetch-tutorials:qa
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.TUTORIAL_FETCH_TOKEN || secrets.TUTORIALS_GITHUB_TOKEN }}
          # Required by scripts/parsers/cap.ts during fetch-tutorials Phase 4
          # (mission/group catalog fetch from the deployed srv). Without it,
          # the build defaults to http://localhost:4004 and fails with
          # "TypeError: fetch failed" since no local CAP runs in CI.
          # The QA channel uses the same /build/catalog endpoint as prod
          # (catalog content is the same; QA channel only differs in tutorial
          # source repos via ONLY_CONTRIBUTION_REPOS=true).
          CAP_BASE_URL: ${{ secrets.CAP_SRV_URL_DEV }}
          TUTORIAL_SLUG: ${{ github.event.client_payload.slug || inputs.slug }}
          # [#208/#275/#312] AI-quiz authoring on the QA channel. Always-on
          # post-#312 (2026-06-27). The QA channel is gated by Tutorial.Author
          # XSUAA scope so AI questions land somewhere safe to preview before
          # they reach the public site. Cost is bounded by author opt-in
          # (presence of [AUTOAUTHOR_*] directives) plus AI_AUTHOR_BUILD_CAP.
          AI_AUTHOR_BUILD_CAP: ${{ inputs.ai-author-build-cap }}
          CHAT_DEPLOYMENT_ID: ${{ secrets.CHAT_DEPLOYMENT_ID }}
          # Workstream C: enable the generated-content fast path on QA. When
          # 'true': slug-targeted → reuse cached non-target content (feed-
          # fingerprint gated inside decideFastPath) + write sidecar; full → PRIME
          # only (decideFastPath refuses reuse off slug-targeted; sidecar still
          # written so the SAVE step warms it).
          CONTENT_CACHE_FAST_PATH: ${{ steps.cc.outputs.content_cache_enabled }}

      # Workstream C: SAVE the generated QA content tree + sidecar so the next
      # slug-targeted QA hotfix can restore and reuse it. Runs on full (PRIME a
      # clean tree) AND slug-targeted (persist the tree with the target's new
      # bytes). Split from restore so full saves without restoring.
      - name: Save generated-content cache (QA)
        if: ${{ steps.cc.outputs.content_cache_enabled == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            hugo/content-qa/tutorials
            hugo/data-qa/image_dimensions.json
            .content-cache
          key: content-tree-qa-v1-${{ hashFiles('scripts/parsers/**', 'scripts/fetch-tutorials.ts', 'scripts/lib/content-cache.ts', 'scripts/lib/expand-ai-authored.ts') }}-${{ github.run_id }}

      # Author-side smell detector. See rebuild-content.yml for rationale.
      # Runs against the QA cache (-Contribution repos) where author-side
      # smells originate before they're merged to the public sources.
      - name: Lint tutorial markdown (QA channel)
        env:
          TUTORIAL_AUTHOR_TOKEN: ${{ secrets.TUTORIAL_AUTHOR_TOKEN }}
          ANALYTICS_BASE_URL: ${{ vars.ANALYTICS_BASE_URL_QA || 'https://tutorial-system-dev-tutorials-srv-qa.cfapps.eu10-005.hana.ondemand.com/author' }}
        # XSUAA client-credentials tokens expire ~12h. v1 path is
        # workflow_dispatch only; cron-triggered runs may find the token
        # expired, in which case the staleness rule silently skips.
        run: npm run lint:tutorial-markdown -- --channel qa
        continue-on-error: true

      - name: Upload tutorial-markdown lint report (QA)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tutorial-markdown-lint-qa-${{ github.run_number }}
          path: .tutorial-cache-qa/lint-report.json
          retention-days: 30
          if-no-files-found: ignore

      # [#797] Hugo safeHTML XSS-guard. Sweeps hugo/layouts/**/*.{html,xml,xsl}
      # for unmarked `| safeHTML` / `| safeHTMLAttr` / `printf "<...%s"` usages
      # and fails CI if any occurrence lacks a `<!-- security-reviewed: <reason> -->`
      # marker within 3 lines above (guard: scripts/check-hugo-safe-html.cjs).
      # Layouts are shared between prod and QA channels, so the guard needs
      # to fire on the QA build path too.
      - name: Check Hugo security annotations
        run: npm run check:security-annotations

      # [#1629] Build the Vite islands + fingerprint manifest BEFORE the QA Hugo
      # build, mirroring the prod rebuild-content.yml (which runs these two steps
      # ahead of its Hugo build). Without them, hugo/data/island_manifest.json is
      # never generated, so island-src.html falls back to the unhashed
      # "/js/<name>.js" path. Vite emits only content-hashed files for the
      # fingerprinted islands (validation, navigator, ...), so those unhashed URLs
      # 404 on the approuter and the island never mounts — for `validation` that
      # means tutorial questions never render and the Done button stays disabled.
      # build:qa then copies the manifest into hugo/data-qa/ (dataDir override) so
      # QA bakes the same hashed paths as prod.
      - name: Build hugo-apps islands
        run: npm --prefix hugo-apps run build
      - name: Build island fingerprint manifest
        run: npm run build:island-manifest

      - name: Build QA Hugo site
        # Hugo was downloaded to /tmp/hugo (line 44). The build:qa npm script
        # invokes 'hugo' (bare binary name) — works locally where hugo is
        # system-installed, but in CI the binary lives at /tmp/hugo and isn't
        # on PATH. Prepend /tmp so npm finds it. Cheaper than installing to
        # /usr/local/bin which needs sudo. Issue: this run failed at #27883670683.
        run: PATH="/tmp:$PATH" npm run build:qa

      # [#1657] Restore CDS syntax highlighting on the QA publish path (parity
      # with rebuild-content.yml). build:qa renders to hugo/public-qa (the
      # publishDir override in hugo.qa.toml, which publish-content.ts --channel qa
      # also reads), so point the Shiki pass there via --dir. Without it, QA
      # author-preview serves the Chroma-SQL fallback with red-braced CDS blocks.
      - name: Highlight CDS code blocks (Shiki)
        run: npm run build:highlight -- --dir hugo/public-qa

      - name: Publish QA content to HANA
        run: npx tsx scripts/publish-content.ts --channel qa ${{ inputs.force-publish && '--force' || '' }} --initiator "ci/${{ github.run_id }}"
        env:
          CAP_QA_BASE_URL: ${{ secrets.CAP_SRV_URL_QA }}
          CONTENT_API_KEY_QA: ${{ secrets.CONTENT_API_KEY_QA }}
          # Scope the publish to the changed slug on a commit-triggered (or single-slug
          # workflow_dispatch) rebuild — publish-content.ts reads PUBLISH_SLUG as the
          # --slug fallback. Empty on a full rebuild → whole-catalog delta. Mirrors
          # rebuild-content.yml. Without force-publish, this makes the commit O(changed)
          # (sub-second) instead of a ~35s full-catalog write. force-publish=true ignores
          # the slug and re-seeds the whole catalog (--force).
          PUBLISH_SLUG: ${{ (! inputs.force-publish) && (github.event.client_payload.slug || inputs.slug) || '' }}

      # #1373 — synthetic watchdog. The publish step reporting success is not
      # proof rows landed: the render-concepts 404 that hid for days (#1372)
      # aborted the session AFTER a green-looking earlier phase. Probe
      # GET /content/hashes on srv-qa and fail if the active version serves no
      # slugs — turning the silent publish-succeeded-but-empty class into a red
      # run that the failure notifier below emails on.
      - name: Verify QA publish landed rows
        uses: ./.github/actions/verify-publish-landed
        with:
          base-url: ${{ secrets.CAP_SRV_URL_QA }}
          bearer: ${{ secrets.CONTENT_API_KEY_QA }}
          channel: qa
          min-slugs: '1'

      - name: Summary
        run: |
          echo "### QA Content Rebuild Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Channel:** qa" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Trigger:** ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          SLUG="${{ github.event.client_payload.slug || inputs.slug }}"
          if [ -n "$SLUG" ]; then
            echo "- **Slug filter:** $SLUG (single-tutorial refresh)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "- **Source repo:** ${{ github.event.client_payload.repository }}" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- **AI authoring:** enabled (cap=${{ inputs.ai-author-build-cap }})" >> "$GITHUB_STEP_SUMMARY"

      # Observability (#observability): report CI failures (build gate,
      # verify-qa-build, publish 503) to the QA srv's PipelineLog so they surface
      # in the admin dashboard instead of only as a red CI run. Best-effort.
      # NOTE (#1373): PipelineLog alone is an unwatched surface — the
      # "Notify on rebuild failure" step below is the real alert (auto-filed,
      # assignee-emailed GitHub issue). This PipelineLog write is kept as a
      # secondary in-admin breadcrumb.
      - name: Report failure to PipelineLog (QA)
        if: ${{ failure() }}
        continue-on-error: true
        env:
          CAP_QA_BASE_URL: ${{ secrets.CAP_SRV_URL_QA }}
          CONTENT_API_KEY_QA: ${{ secrets.CONTENT_API_KEY_QA }}
        run: |
          if [ -z "$CAP_QA_BASE_URL" ] || [ -z "$CONTENT_API_KEY_QA" ]; then
            echo "::warning::Cannot report QA failure to PipelineLog (missing CAP_QA_BASE_URL or CONTENT_API_KEY_QA)"
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -m 30 -o /dev/null -w "PipelineLog(QA) report HTTP %{http_code}\n" \
            -X POST "$CAP_QA_BASE_URL/content/pipeline-log" \
            -H "Authorization: Bearer $CONTENT_API_KEY_QA" \
            -H "Content-Type: application/json" \
            --data "$(jq -nc \
              --arg trigger "${{ github.event_name }}" \
              --arg run "$RUN_URL" \
              '{pipelineType:"HUGO_BUILD", initiator:("ci/rebuild-content-qa@"+$trigger), summary:"QA content rebuild failed", errorDetails:("CI run failed before/at QA content publish. Logs: "+$run), metadata:{channel:"qa", trigger:$trigger, runUrl:$run}}')" \
            || echo "::warning::QA PipelineLog failure-report POST did not complete"

      # #1373 — the real alert. On failure, open (or append to) a deduplicated
      # GitHub issue assigned to the on-call owner; GitHub emails the assignee
      # natively (no SMTP/Slack secret). Consecutive dispatch-triggered failures
      # — the exact signature that hid the QA breakage for days — accumulate as
      # comments on the same issue and escalate past the threshold.
      - name: Notify on QA rebuild failure
        if: ${{ failure() }}
        uses: ./.github/actions/report-rebuild-failure
        with:
          outcome: failure
          channel: qa
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          trigger: ${{ github.event_name }}
          details: 'QA full rebuild (merge-to-main / dispatch) failed at or before publish.'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # #1373 — on success, close any open QA rebuild-failure issue and reset the
      # consecutive-failure streak. Skipped for slug-only workflow_dispatch runs
      # is unnecessary here: QA has no slug-skip branches, every run reaches this.
      - name: Resolve QA rebuild-failure issue on success
        if: ${{ success() }}
        continue-on-error: true
        uses: ./.github/actions/report-rebuild-failure
        with:
          outcome: success
          channel: qa
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          trigger: ${{ github.event_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
