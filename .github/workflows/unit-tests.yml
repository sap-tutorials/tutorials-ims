name: unit tests

on:
  pull_request:
  push:
    branches: [main, DEV]

# PR-time gate — `deploy.yml` runs unit tests only after a successful deploy,
# which is too late for merge protection. This workflow re-runs the same
# `npm test` suite on every PR and every push to `main`, so a red commit
# never lands unnoticed. Closes the PR-gate half of #961.
#
# The vitest `unit` project uses in-memory SQLite and does not need a HANA
# binding or CF login. `npm run setup` installs the nested `hugo-apps`,
# `app/explore`, and `app/channel-atlas` workspaces and rebuilds
# `better-sqlite3` — all are required by the unit suite and are otherwise
# silently skipped by the org-wide `npm config ignore-scripts=true` policy.

jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Hugo
        # test/unit/hugo-homepage-partials.test.ts spawns the real Hugo binary
        # to build a fixture browse.json. Without Hugo on PATH the spawnSync
        # returns `status: null` and the test fails with "Hugo build failed
        # (exit null)". Matches the version used by rebuild-content.yml.
        run: |
          curl -fsSL https://github.com/gohugoio/hugo/releases/download/v0.147.7/hugo_extended_0.147.7_linux-amd64.tar.gz \
            | tar -xz -C /tmp hugo
          sudo mv /tmp/hugo /usr/local/bin/hugo
          hugo version
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Setup nested workspaces (hugo-apps, app/explore, app/channel-atlas) + rebuild native bindings
        run: npm run setup
      - name: Run unit tests
        run: npm test
      - name: Static build guards (postbuild:apps)
        # Runs the same static guard suite deploy.yml runs (build collisions,
        # icon/UI5 imports, srv-qa parity, slug-lookup canonicalization, CSRF,
        # GraphQL breaking-changes, …). These previously ran ONLY in deploy.yml,
        # so guard violations introduced by a PR (whose gate was npm test only)
        # merged undetected and first surfaced at the next workflow_dispatch
        # deploy — which is how 41 unmarked slug lookups accumulated before a
        # deploy caught them all at once. Running them here fails such a PR
        # before merge. (postbuild:apps ends with check:graphql-breaking, so it
        # subsumes the standalone GraphQL step that used to live here.)
        run: npm run postbuild:apps
