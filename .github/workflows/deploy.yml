name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - qa
          - prod

env:
  NODE_VERSION: '20'
  MBT_VERSION: '1.2.31'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "target=dev" >> "$GITHUB_OUTPUT"
          else
            echo "target=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install MTA Build Tool
        run: npm install -g mbt@${{ env.MBT_VERSION }}

      - name: Build MTA archive
        run: mbt build -e deploy/${{ steps.env.outputs.target }}.mtaext
        env:
          GITHUB_TOKEN: ${{ secrets.TUTORIALS_GITHUB_TOKEN }}

      - name: Upload MTAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: mtar-${{ steps.env.outputs.target }}-${{ github.run_number }}
          path: mta_archives/*.mtar
          retention-days: 30

      - name: Set CF space
        id: cf
        run: |
          case "${{ steps.env.outputs.target }}" in
            dev)  echo "space=${{ secrets.CF_SPACE_DEV }}" >> "$GITHUB_OUTPUT" ;;
            qa)   echo "space=${{ secrets.CF_SPACE_QA }}" >> "$GITHUB_OUTPUT" ;;
            prod) echo "space=${{ secrets.CF_SPACE_PROD }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Install CF CLI
        run: |
          curl -L "https://packages.cloudfoundry.org/stable?release=linux64-binary&version=v8&source=github" | tar xz
          sudo mv cf8 /usr/local/bin/cf

      - name: Install CF MTA plugin
        run: cf install-plugin multiapps -f

      - name: CF Login
        run: |
          cf login \
            -a "${{ secrets.CF_API_ENDPOINT }}" \
            -u "${{ secrets.CF_USERNAME }}" \
            -p "${{ secrets.CF_PASSWORD }}" \
            -o "${{ secrets.CF_ORG }}" \
            -s "${{ steps.cf.outputs.space }}"

      - name: Deploy MTA
        run: cf deploy mta_archives/tutorials-poc_1.0.0.mtar -e deploy/${{ steps.env.outputs.target }}.mtaext -f

      - name: Configure environment variables
        run: |
          APP_NAME="tutorials-${{ steps.env.outputs.target }}-approuter"

          cf set-env "$APP_NAME" REBUILD_API_KEY "${{ secrets.REBUILD_API_KEY }}"

          case "${{ steps.env.outputs.target }}" in
            dev)  cf set-env "$APP_NAME" APPROUTER_URL "${{ secrets.APPROUTER_URL_DEV }}" ;;
            qa)   cf set-env "$APP_NAME" APPROUTER_URL "${{ secrets.APPROUTER_URL_QA }}" ;;
            prod) cf set-env "$APP_NAME" APPROUTER_URL "${{ secrets.APPROUTER_URL_PROD }}" ;;
          esac

          cf restart "$APP_NAME"

      - name: Summary
        run: |
          echo "### Build & Deploy Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Environment:** ${{ steps.env.outputs.target }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Space:** ${{ steps.cf.outputs.space }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Trigger:** ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **REBUILD_API_KEY:** injected from secrets" >> "$GITHUB_STEP_SUMMARY"
