name: Content drift check

# Daily verification that Hugo's freshly-built content hashes match what
# HANA actually serves. Catches the "tutorial X looks stale on prod"
# bug class — drift can be introduced by a partial publish that died
# halfway through, a manual HANA patch, or a `--force` from a stale
# local cache. None of those produce errors at the time; the only
# detection until now was an author noticing days/weeks later.
#
# scripts/publish-content.ts already supports `--verify-only`: it
# fetches /content/hashes from the live srv, compares to local
# SHA-256s, and exits 2 on mismatch (1 on connectivity error). This
# workflow runs that mode against each environment on a daily schedule.
#
# IMPORTANT: this does NOT publish — it only verifies. To repair, run
# `npm run publish-content -- --heal` against the affected env.

on:
  schedule:
    # 04:13 UTC daily. Off the :00/:30 marks so we don't coalesce with
    # every other CI job in the world that picks "4am UTC sharp".
    - cron: '13 4 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to verify'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - qa
          - prod
          - all

env:
  NODE_VERSION: '22'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # On a manual dispatch with a specific env, the matrix collapses
      # to that one. On schedule we only verify dev — QA is excluded
      # because the QA srv (by design) doesn't expose `/build/catalog`
      # (fetch-tutorials would fail) and requires `Tutorial.Author`
      # auth on `/content/hashes` (verify-only would 401). Adding QA
      # to the daily schedule would need a redesign of the verify path
      # for the QA channel; until then, manual dispatch only.
      # Whether we include prod here is a judgement call — verify-only
      # is read-only on the server so it's safe; but a 5-minute window
      # of API load three times a day matters, so we keep prod off
      # the schedule by default and only run it via dispatch.
      matrix:
        environment: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.environment != 'all') && format('["{0}"]', inputs.environment) || (github.event_name == 'workflow_dispatch' && inputs.environment == 'all') && '["dev", "qa", "prod"]' || '["dev"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Hugo
        run: curl -fsSL https://github.com/gohugoio/hugo/releases/download/v0.147.7/hugo_extended_0.147.7_linux-amd64.tar.gz | tar -xz -C /tmp hugo

      - name: Resolve env-specific URLs + secrets
        id: env
        # Fails fast with a pointer to the missing repo secret rather than
        # letting an empty `srv_url` bleed into `CAP_BASE_URL=""` and
        # produce a confusing `ECONNREFUSED 127.0.0.1:4004` from inside
        # `scripts/fetch-tutorials.ts` (which falls back to localhost when
        # the env var is empty). Run 27397407654 spent 17 minutes on a
        # missing secret because the actual error pointed at the wrong
        # layer.
        #
        # IMPORTANT — secret masking. The `${{ secrets.X }}` interpolation
        # is mask-exempted when written directly to `$GITHUB_OUTPUT` from
        # the YAML, but masking DOES intercept `echo "$shell_var"`. So the
        # guard checks emptiness via shell, then writes the output via the
        # YAML interpolator. Routing the URL through a shell var and
        # echoing it landed `srv_url=***` (literal) in the output and
        # broke run 27416206424 with `Failed to parse URL from
        # ***/build/catalog`.
        run: |
          case "${{ matrix.environment }}" in
            dev)
              guard='${{ secrets.CAP_SRV_URL_DEV }}'
              secret_name="CAP_SRV_URL_DEV"
              ;;
            qa)
              guard='${{ secrets.CAP_SRV_URL_QA }}'
              secret_name="CAP_SRV_URL_QA"
              ;;
            prod)
              guard='${{ secrets.CAP_SRV_URL_PROD }}'
              secret_name="CAP_SRV_URL_PROD"
              ;;
          esac
          if [ -z "$guard" ]; then
            echo "::error title=Missing repo secret::$secret_name is empty or unset on the sap-tutorials/tutorials-ims repo. Set it to the CAP srv base URL (the tutorials-srv app, not the approuter) e.g. https://tutorial-system-dev-tutorials-srv.cfapps.eu10-005.hana.ondemand.com — verify with 'gh secret list --repo sap-tutorials/tutorials-ims'."
            exit 1
          fi
          case "${{ matrix.environment }}" in
            dev)
              echo "srv_url=${{ secrets.CAP_SRV_URL_DEV }}" >> "$GITHUB_OUTPUT"
              echo "api_key_secret=CONTENT_API_KEY"        >> "$GITHUB_OUTPUT"
              echo "channel=prod"                          >> "$GITHUB_OUTPUT"
              ;;
            qa)
              echo "srv_url=${{ secrets.CAP_SRV_URL_QA }}" >> "$GITHUB_OUTPUT"
              echo "api_key_secret=CONTENT_API_KEY_QA"     >> "$GITHUB_OUTPUT"
              echo "channel=qa"                            >> "$GITHUB_OUTPUT"
              ;;
            prod)
              echo "srv_url=${{ secrets.CAP_SRV_URL_PROD }}" >> "$GITHUB_OUTPUT"
              echo "api_key_secret=CONTENT_API_KEY"          >> "$GITHUB_OUTPUT"
              echo "channel=prod"                            >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix hugo-apps install

      - name: Generate GitHub App token
        id: app-token
        if: ${{ vars.USE_GITHUB_APP == 'true' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.TUTORIALS_APP_ID }}
          private-key: ${{ secrets.TUTORIALS_APP_PRIVATE_KEY }}
          owner: sap-tutorials

      # Re-fetch tutorials so verify operates on what fetch-tutorials
      # would publish today, not on a cached snapshot from days ago.
      # Drift is an outcome of source vs server, not local cache vs
      # server, so the source-of-truth must be re-derived.
      - name: Fetch tutorials
        run: |
          if [ "${{ steps.env.outputs.channel }}" = "qa" ]; then
            npm run fetch-tutorials:qa
          else
            npm run fetch-tutorials
          fi
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.TUTORIALS_GITHUB_TOKEN }}
          CAP_BASE_URL: ${{ steps.env.outputs.srv_url }}

      - name: Build Vue apps
        run: npm --prefix hugo-apps run build

      - name: Copy Joule vendor bundles
        run: npm run copy-joule-vendor

      - name: Build Hugo site
        run: |
          if [ "${{ steps.env.outputs.channel }}" = "qa" ]; then
            /tmp/hugo --source hugo --config ../hugo.qa.toml --minify
            echo "hugo_dir=hugo/public-qa" >> "$GITHUB_OUTPUT"
          else
            /tmp/hugo --source hugo --minify
          fi
        id: build

      # IMPORTANT: this step is REQUIRED for the verify to produce sensible
      # results. `scripts/highlight-cds.ts` is part of `npm run build:all`
      # (the real publish path), and it post-processes CDS code blocks in
      # the Hugo output with Shiki-rendered HTML. Without it, the local
      # bytes use Chroma (Hugo's default) while the server bytes were
      # published with Shiki — every tutorial with a CDS block shows up as
      # "drift" even when content is identical. Caught 2026-06-24 run
      # 28077660798: 1367 slugs reported as stale, ALL were false-positives
      # from this missing step + the recommendations-rail churn handled in
      # publish-content.ts's verify path.
      - name: Apply CDS syntax highlighting (Shiki)
        run: npm run build:highlight

      # publish-content.ts uses --hugo-dir to find the built HTML +
      # compute SHA-256s. For QA the dir is hugo/public-qa; for the
      # default channel it's hugo/public. Default in the script is
      # already hugo/public, so we only override for QA.
      - name: Verify content hashes against ${{ matrix.environment }}
        id: verify
        run: |
          set +e
          HUGO_DIR="hugo/public"
          if [ "${{ steps.env.outputs.channel }}" = "qa" ]; then
            HUGO_DIR="hugo/public-qa"
          fi
          npx tsx scripts/publish-content.ts \
            --hugo-dir "$HUGO_DIR" \
            --base-url "${{ steps.env.outputs.srv_url }}" \
            --verify-only \
            --verbose 2>&1 | tee verify.log
          EXIT=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$EXIT" >> "$GITHUB_OUTPUT"
          # Three meaningful exit codes from publish-content.ts:
          #   0 = match
          #   1 = connectivity / unexpected failure
          #   2 = drift detected (slug list in stderr)
          # We let the workflow fail in both 1 and 2 cases — both
          # mean someone needs to look — but distinguish them in
          # the run summary below.
        env:
          # verify-only does NOT need the API key (server endpoint is
          # public-read), but the script still expects the env var to
          # be set so it can short-circuit politely. Pass an empty
          # string rather than leaving it unset.
          CONTENT_API_KEY: ''

      - name: Upload verify log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-drift-${{ matrix.environment }}-${{ github.run_number }}
          path: verify.log
          retention-days: 14
          if-no-files-found: warn

      # Single report-and-fail step. Writes the SAME human-readable
      # report to stdout (so it appears in the auto-expanded "failed
      # step" log, email digests, and PR-check excerpts) and to the
      # run summary tab. Earlier split — "Summarize" → step summary,
      # "Fail the run" → bare `exit "$EXIT"` — produced a hostile
      # failure log that read like a CI syntax error
      # ("Run EXIT=\"2\"\n  EXIT=\"2\"\n  if [ ... ]\n  Error: ... exit 2"),
      # forcing the reader to click into the run summary to find out
      # what was actually wrong. Combined here so the actionable
      # message is the FIRST thing anyone sees.
      - name: Report outcome
        if: always()
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          SRV_URL: ${{ steps.env.outputs.srv_url }}
          EXIT: ${{ steps.verify.outputs.exit_code }}
          # Title used for the GitHub annotation (visible at the top of
          # the run page) AND the heading in the run summary. Crafted
          # so the GitHub email subject line is self-explanatory.
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -u

          # Build the report into a temp file once, then tee it to
          # both stdout and the step summary. Using a heredoc keeps
          # the formatting honest and avoids accidental shell
          # expansion of the slug list.
          REPORT=$(mktemp)

          case "$EXIT" in
            0)
              {
                echo "### ✅ Content match — $ENVIRONMENT"
                echo ""
                echo "Every Hugo-built slug hashes identically to what the srv serves."
              } > "$REPORT"
              ;;
            2)
              # Count drifted slugs from the verify.log line
              # 'Verify FAILED: N slugs differ:' so the title carries
              # the magnitude without a click.
              DRIFT_COUNT=$(grep -oE 'Verify FAILED: [0-9]+ slugs? differ' verify.log | grep -oE '[0-9]+' | head -1)
              DRIFT_COUNT=${DRIFT_COUNT:-?}
              {
                echo "### ⚠️ Content drift on $ENVIRONMENT — $DRIFT_COUNT slug(s) stale on the server"
                echo ""
                echo "The HTML stored in HANA for the slugs below no longer matches what \`hugo --minify\`"
                echo "produces from current \`main\` + current upstream tutorial sources. **This is expected**"
                echo "when the upstream content-update triggers (\`repository_dispatch\` from the"
                echo "\`*-Contribution\` repos) are not yet wired — every parser/layout/source change"
                echo "since the last manual rebuild will show as drift here until the next publish."
                echo ""
                echo "**To repair (one-shot, full republish):**"
                echo ""
                echo "    gh workflow run rebuild-content.yml -f environment=$ENVIRONMENT"
                echo ""
                echo "**Or locally, healing only the drifted slugs:**"
                echo ""
                echo "    CAP_BASE_URL=\"$SRV_URL\" \\"
                echo "      CONTENT_API_KEY=\"\$CONTENT_API_KEY\" \\"
                echo "      npm run publish-content -- --heal"
                echo ""
                echo "Drifted slugs (first 50; full list in the \`verify.log\` artifact on this run):"
                echo ""
                echo '```'
                grep '^  - ' verify.log || echo "(no slug list captured — see verify.log artifact)"
                echo '```'
                echo ""
                echo "Artifact: \`content-drift-$ENVIRONMENT-${{ github.run_number }}\` on https://github.com/$REPO/actions/runs/$RUN_ID"
              } > "$REPORT"
              ;;
            *)
              {
                echo "### ❌ Drift check tooling failed on $ENVIRONMENT (exit $EXIT)"
                echo ""
                echo "This is **not** a content-drift signal — \`publish-content.ts --verify-only\` could"
                echo "not complete its compare. Common causes: srv unreachable, missing repo secret,"
                echo "fetch-tutorials hit GitHub rate limits, Hugo build error."
                echo ""
                echo "Tail of \`verify.log\`:"
                echo ""
                echo '```'
                tail -n 30 verify.log
                echo '```'
                echo ""
                echo "Full log: \`content-drift-$ENVIRONMENT-${{ github.run_number }}\` artifact on this run."
              } > "$REPORT"
              ;;
          esac

          # Print to the visible step log AND to the summary tab.
          cat "$REPORT"
          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"

          # Emit a single annotation with a specific title so the run
          # page header and the email subject line carry the magnitude
          # of the problem, not a generic "exit 2".
          if [ "$EXIT" = "2" ]; then
            DRIFT_COUNT=$(grep -oE 'Verify FAILED: [0-9]+ slugs? differ' verify.log | grep -oE '[0-9]+' | head -1)
            DRIFT_COUNT=${DRIFT_COUNT:-?}
            echo "::error title=Content drift on $ENVIRONMENT::${DRIFT_COUNT} slug(s) stale on the server. Repair with: gh workflow run rebuild-content.yml -f environment=$ENVIRONMENT"
            exit 2
          elif [ "$EXIT" != "0" ]; then
            echo "::error title=Drift check tooling failed on $ENVIRONMENT::publish-content.ts --verify-only exited $EXIT (not a drift signal — see verify.log artifact)"
            exit "$EXIT"
          fi
