name: Rebuild Content

on:
  repository_dispatch:
    types: [tutorial-updated]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - qa
          - prod
      slug:
        description: Refresh a single tutorial slug only (leave blank for full rebuild)
        required: false
        type: string
      slugs:
        description: 'Refresh multiple slugs (comma-separated, e.g. "foo,bar,baz"). Unioned with `slug` if both set; full rebuild if both blank. Spec: #433.'
        required: false
        type: string
      trigger-source:
        description: 'Where the rebuild was triggered from (admin-write | manual | scheduled)'
        required: false
        default: 'manual'
        type: string
      ai-author-build-cap:
        description: 'Hard cap on AI-quiz LLM calls per build (overrides default 200). Use 10000 for first-time bulk seed.'
        required: false
        default: '200'
        type: string
      force-cap-refetch:
        description: 'Bypass the .tutorial-cache/ CAP catalog snapshot (24h TTL) and re-fetch /build/catalog fresh. Set true after fixing data the catalog reads from (publish flag, slugs, etc.) so the rebuild reflects the change in the same run instead of waiting for the cache to expire.'
        required: false
        default: false
        type: boolean
      publish-concurrency:
        description: 'Number of /content/publish/append batches in flight at once. Default raised 4 → 6 in issue #434 PR 2 (final stage) after 9 stable runs at 4/25. Restores the original pre-#422 throughput now that bulk SQL (#423) makes it safe. Lower below 6 if srv hits HeadersTimeoutError again.'
        required: false
        default: '6'
        type: string
      publish-batch-size:
        description: 'Slugs per /content/publish/append batch. Default raised 25 → 50 in issue #434 PR 2 (final stage). Multiplied by publish-concurrency gives total in-flight slugs (current default 6x50 = 300). The whole catalog has ~1400 slugs so smaller batches just take longer linearly, not exponentially. Lower if srv hits HeadersTimeoutError.'
        required: false
        default: '50'
        type: string
      mode:
        description: |
          Rebuild scope (pick the SMALLEST that fits the change to keep wall-clock down).

          - 'catalog-only' — admin Mission/Group/CompletionPath/FeaturedTask edits. Skips
            fetch + Vue + AI quiz + display + admin SPAs + approuter push. Hugo + publish
            only. Auto-selected by admin writes via _classify-rebuild-mode.js.

          - 'slug-targeted' — one or a few tutorials changed (parser fix, content typo,
            single-author edit). Uses `slug` / `slugs` inputs to narrow the fetch step.
            Same skip list as catalog-only PLUS still refetches the listed slug(s).
            Auto-selected by admin Tutorial/Step writes.

          - 'full' — full catalog rebuild (e.g. dependency bump, Vue island change, AppRouter
            asset change, scheduled nightly). Runs everything. 7-13 min wall clock.

          UX: leaving this at the default 'full' AND setting `slug` / `slugs` will auto-infer
          'slug-targeted' (the implicit user intent — see the 'Determine effective rebuild
          mode' step). Issue: #609.
        required: false
        default: full
        type: choice
        options:
          - full
          - catalog-only
          - slug-targeted
      purge-orphans:
        description: 'After publish, soft-delete tutorials no longer present in any upstream repo. CI-only, 50-slug safety cap (override via PURGE_CAP_ABS env).'
        required: false
        type: boolean
        default: false

env:
  NODE_VERSION: '22'

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Hugo
        run: curl -fsSL https://github.com/gohugoio/hugo/releases/download/v0.147.7/hugo_extended_0.147.7_linux-amd64.tar.gz | tar -xz -C /tmp hugo

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "target=dev" >> "$GITHUB_OUTPUT"
          else
            echo "target=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          fi

      # #609: auto-infer the rebuild scope so manual hotfix dispatches don't
      # silently fall through to `mode=full` and run for 10 minutes when the
      # user only set the `slug` input. The admin-write path (srv/lib/
      # rebuild-trigger.js + _classify-rebuild-mode.js) already classifies
      # mode per entity, so we ONLY auto-infer on workflow_dispatch — never
      # second-guess the admin classifier.
      #
      # Rules:
      #   - workflow_dispatch + inputs.mode=full + (slug or slugs set)
      #       → slug-targeted (the implicit user intent)
      #   - everything else → pass inputs.mode through untouched
      #
      # The resolved value is echoed to STEP_SUMMARY so users see why the
      # workflow ran the steps it did.
      - name: Determine effective rebuild mode
        id: mode
        env:
          # Pin all dispatch-controlled inputs into env vars first so the
          # shell logic doesn't need to template-interpolate into bash
          # conditionals (which is brittle when inputs are missing).
          INPUT_MODE: ${{ inputs.mode || 'full' }}
          INPUT_SLUG: ${{ inputs.slug }}
          INPUT_SLUGS: ${{ inputs.slugs }}
          INPUT_PURGE_ORPHANS: ${{ inputs.purge-orphans }}
          EVENT: ${{ github.event_name }}
        run: |
          EFFECTIVE="$INPUT_MODE"
          REASON="explicit (inputs.mode=$INPUT_MODE)"

          if [ "$EVENT" = "workflow_dispatch" ] \
             && [ "$INPUT_MODE" = "full" ] \
             && { [ -n "$INPUT_SLUG" ] || [ -n "$INPUT_SLUGS" ]; }; then
            EFFECTIVE='slug-targeted'
            REASON='auto-inferred (slug/slugs set, mode left at default)'
          fi

          # Issue #orphan-purge — reject purge-orphans=true with anything
          # other than effective_mode=full. slug-targeted/catalog-only
          # deliberately don't fetch the whole catalog, so 1392+ slugs
          # would falsely appear as orphans. Fail loud (operator clearly
          # intended the purge).
          if [ "${INPUT_PURGE_ORPHANS:-false}" = "true" ] && [ "$EFFECTIVE" != "full" ]; then
            echo "::error title=purge-orphans requires mode=full::Got effective_mode=$EFFECTIVE. Re-run with -f mode=full -f purge-orphans=true."
            exit 1
          fi

          echo "effective_mode=$EFFECTIVE" >> "$GITHUB_OUTPUT"
          echo "effective_reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "::notice title=Rebuild mode::$EFFECTIVE ($REASON)"

      - name: Set approuter URL
        id: url
        run: |
          case "${{ steps.env.outputs.target }}" in
            dev)  echo "approuter_url=${{ secrets.APPROUTER_URL_DEV }}" >> "$GITHUB_OUTPUT" ;;
            qa)   echo "approuter_url=${{ secrets.APPROUTER_URL_QA }}" >> "$GITHUB_OUTPUT" ;;
            prod) echo "approuter_url=${{ secrets.APPROUTER_URL_PROD }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Set CAP srv URL
        id: srv
        run: |
          case "${{ steps.env.outputs.target }}" in
            dev)  echo "srv_url=${{ secrets.CAP_SRV_URL_DEV }}" >> "$GITHUB_OUTPUT" ;;
            qa)   echo "srv_url=${{ secrets.CAP_SRV_URL_QA }}" >> "$GITHUB_OUTPUT" ;;
            prod) echo "srv_url=${{ secrets.CAP_SRV_URL_PROD }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix hugo-apps install

      - name: Restore tutorial cache
        uses: actions/cache@v4
        with:
          path: .tutorial-cache
          key: tutorial-cache-${{ hashFiles('.github/workflows/rebuild-content.yml') }}-${{ github.run_id }}
          restore-keys: |
            tutorial-cache-${{ hashFiles('.github/workflows/rebuild-content.yml') }}-
            tutorial-cache-

      # GitHub App token (preferred). Activates when repo variable
      # USE_GITHUB_APP=true and the TUTORIALS_APP_* secrets are populated.
      # See docs/developers/operations/github-app-setup.md. While the variable is unset/false the step
      # is skipped and the fetch falls back to the classic PAT below.
      - name: Generate GitHub App token
        id: app-token
        if: ${{ vars.USE_GITHUB_APP == 'true' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.TUTORIALS_APP_ID }}
          private-key: ${{ secrets.TUTORIALS_APP_PRIVATE_KEY }}
          owner: sap-tutorials

      # [#208/#312] Construct VCAP_SERVICES for the AI-quiz fetch path. The
      # @sap-ai-sdk/orchestration SDK reads aicore credentials from
      # VCAP_SERVICES.aicore[0].credentials when no cds bind is in effect.
      # The secret holds ONLY the inner `credentials` JSON (rotated via
      # `cf delete-service-key tutorials-aicore <key> &&
      #  cf create-service-key tutorials-aicore <key>`).
      # Skipped for catalog-only rebuilds (fetch-tutorials.ts doesn't run).
      # If a model regression sneaks in, set the AI_AUTHOR_AICORE_SERVICE_KEY
      # secret to empty — the SDK then fails fast on first LLM call.
      - name: Set up VCAP_SERVICES for AI authoring
        if: ${{ steps.mode.outputs.effective_mode != 'catalog-only' }}
        env:
          AICORE_CREDENTIALS_JSON: ${{ secrets.AI_AUTHOR_AICORE_SERVICE_KEY }}
        run: |
          if [ -z "${AICORE_CREDENTIALS_JSON}" ]; then
            echo "::error::AI_AUTHOR_AICORE_SERVICE_KEY secret is unset or empty. AI-quiz authoring is always-on post-#312 — see docs/developers/operations/ai-author-ci-setup.md."
            exit 1
          fi
          # Wrap the credentials JSON in the outer aicore[] structure the SDK expects.
          # Use jq so a malformed credentials value fails loudly here, not 5 min into
          # fetch-tutorials.ts when an LLM call attempts.
          echo "${AICORE_CREDENTIALS_JSON}" | jq empty || { echo "::error::AI_AUTHOR_AICORE_SERVICE_KEY is not valid JSON"; exit 1; }
          VCAP=$(jq -nc --argjson creds "${AICORE_CREDENTIALS_JSON}" '{aicore: [{label: "aicore", name: "tutorials-aicore", instance_name: "tutorials-aicore", credentials: $creds, plan: "extended"}]}')
          # Mask the constructed VCAP so it doesn't leak in subsequent logs.
          echo "::add-mask::${VCAP}"
          echo "VCAP_SERVICES=${VCAP}" >> "$GITHUB_ENV"

      - name: Fetch tutorials
        if: ${{ steps.mode.outputs.effective_mode != 'catalog-only' }}
        # [#357 followup] When force-cap-refetch is true, pass --force-cap so
        # fetch-tutorials.ts ignores the .tutorial-cache/ CAP catalog snapshot
        # (24h TTL) and pulls fresh from /build/catalog. Use after fixing data
        # the catalog reads from (publish flag, slug format, etc.) so the
        # rebuild reflects the change in the same run.
        run: npm run fetch-tutorials -- ${{ inputs.force-cap-refetch == true && '--force-cap' || '' }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.TUTORIALS_GITHUB_TOKEN }}
          CAP_BASE_URL: ${{ steps.srv.outputs.srv_url }}
          CONTENT_API_KEY: ${{ secrets.CONTENT_API_KEY }}
          TUTORIAL_SLUG: ${{ inputs.slug }}
          TUTORIAL_SLUGS: ${{ inputs.slugs }}
          # [#208/#275/#312] AI-quiz authoring. Always-on post-#312
          # (2026-06-27 — soak window completed clean). fetch-tutorials.ts
          # wakes the AI generator on tutorials carrying [AUTOAUTHOR_*]
          # directives in their rules.vr. VCAP_SERVICES (set by the prior
          # step) carries the aicore binding the orchestration SDK needs.
          # Cost is bounded by (a) author opt-in for the directive and
          # (b) AI_AUTHOR_BUILD_CAP per-build worst-case ceiling.
          # Kill-switch: set AI_AUTHOR_AICORE_SERVICE_KEY secret to empty
          # — the SDK fails fast on first call, falling back to skipping
          # AI expansion. The summary step still emits the [ai-author]
          # telemetry line so the CI invariant regex keeps matching.
          AI_AUTHOR_BUILD_CAP: ${{ inputs.ai-author-build-cap }}
          CHAT_DEPLOYMENT_ID: ${{ secrets.CHAT_DEPLOYMENT_ID }}

      # [#601] Generate per-advocate profile-page markdown into
      # hugo/content/developer-advocates/ from /api/advocates. Runs on ALL
      # modes (including catalog-only) so admin Advocates/AdvocateTopics/
      # AdvocateLinks saves regenerate the per-advocate pages within the
      # same rebuild cycle. fetch-advocates.ts is idempotent and bounded
      # by the advocate count (catalog scale, not tutorial scale).
      - name: Fetch advocates
        run: npm run fetch-advocates
        env:
          CAP_BASE_URL: ${{ steps.srv.outputs.srv_url }}

      # [Phase 3-A] Fetch published-concept payload from CAP and write
      # one hugo/content/concepts/<slug>.md per published concept. Runs on
      # `full` and `catalog-only`; skipped on `slug-targeted` (a single-tutorial
      # rebuild does not need concept landing-page regeneration). The Hugo
      # build picks up the new .md files in the subsequent build step.
      # All other Phase 3-A wiring (classifier, kg.after hook, Hugo layout,
      # publish-content concept support, AppRouter route, CAP serve handler)
      # shipped in #685 — only this workflow invocation was missing.
      - name: Fetch published concepts
        if: ${{ steps.mode.outputs.effective_mode != 'slug-targeted' }}
        run: npm run fetch-concepts
        env:
          CAP_BASE_URL: ${{ steps.srv.outputs.srv_url }}

      # [#759] Homepage data feeds — homepage-shelves (60 link cards),
      # verb-definitions (6 verb tile back-faces), shelf-definitions
      # (4 shelf-header explainers). All three are read by Hugo at build
      # time via site.Data.* and rendered into the homepage / verb sub-page
      # templates (hugo/layouts/partials/homepage/verb-spine.html,
      # directory-footer.html, verb/list.html).
      #
      # MUST run on `full` AND `catalog-only` — homepage content is what
      # both surfaces are FOR. The verb-spine template's fallback at
      # verb-spine.html:14-22 only carries label/icon/href, NOT tagline or
      # whyItMatters, so omitting these fetchers produces a visibly-broken
      # homepage with empty flip-card back faces (caught after a clean
      # post-merge rebuild on 2026-06-30 wiped the homepage's explainer
      # content even though the DB was intact). The fix is to mirror
      # `npm run build:all`'s fetcher chain (package.json line 65) which
      # always runs all three before Hugo. Slug-targeted skips them
      # because a single-tutorial rebuild doesn't touch the homepage.
      - name: Fetch homepage shelves
        if: ${{ steps.mode.outputs.effective_mode != 'slug-targeted' }}
        run: npm run fetch-homepage-shelves
        env:
          CAP_BASE_URL: ${{ steps.srv.outputs.srv_url }}

      - name: Fetch verb definitions
        if: ${{ steps.mode.outputs.effective_mode != 'slug-targeted' }}
        run: npm run fetch-verb-definitions
        env:
          CAP_BASE_URL: ${{ steps.srv.outputs.srv_url }}

      - name: Fetch shelf definitions
        if: ${{ steps.mode.outputs.effective_mode != 'slug-targeted' }}
        run: npm run fetch-shelf-definitions
        env:
          CAP_BASE_URL: ${{ steps.srv.outputs.srv_url }}

      # Author-side smell detector. Runs against raw tutorial markdown in
      # .tutorial-cache/ and warns on patterns that produce malformed DOM
      # downstream (see scripts/lint-tutorial-markdown.ts). Non-blocking by
      # default — uploads a JSON report so we can track trends and chase
      # author-side fixes without breaking the rebuild.
      - name: Lint tutorial markdown
        if: ${{ steps.mode.outputs.effective_mode != 'catalog-only' }}
        env:
          TUTORIAL_AUTHOR_TOKEN: ${{ secrets.TUTORIAL_AUTHOR_TOKEN }}
          ANALYTICS_BASE_URL: ${{ vars.ANALYTICS_BASE_URL || 'https://tutorial-system-dev-tutorials-srv.cfapps.eu10-005.hana.ondemand.com/author' }}
        # XSUAA client-credentials tokens expire ~12h. v1 path is
        # workflow_dispatch only; cron-triggered runs may find the token
        # expired, in which case the staleness rule silently skips. This is
        # acceptable because the rule emits non-blocking notices.
        run: npm run lint:tutorial-markdown
        continue-on-error: true

      - name: Upload tutorial-markdown lint report
        if: ${{ always() && steps.mode.outputs.effective_mode != 'catalog-only' }}
        uses: actions/upload-artifact@v4
        with:
          name: tutorial-markdown-lint-${{ steps.env.outputs.target }}-${{ github.run_number }}
          path: .tutorial-cache/lint-report.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Validate tutorials
        if: ${{ steps.mode.outputs.effective_mode != 'catalog-only' }}
        run: npm run validate-tutorials

      - name: Build Vue apps
        if: ${{ steps.mode.outputs.effective_mode != 'slug-targeted' }}
        run: npm --prefix hugo-apps run build

      - name: Copy Joule vendor bundles
        if: ${{ steps.mode.outputs.effective_mode != 'slug-targeted' }}
        run: npm run copy-joule-vendor

      - name: Build Hugo site
        run: /tmp/hugo --source hugo --minify

      - name: Publish tutorial content to HANA
        id: publish
        # Concurrency / batch-size are tunable via workflow_dispatch inputs
        # (default raised 2/25 → 4/25 in issue #434 PR 1; staged toward
        # the original pre-#422 6/50 in PR 2 once 4/25 has 2-3 stable runs).
        # repository_dispatch events fall through to the same default via
        # the empty-string fallback expression below.
        #
        # Historical: 6/50 was the original default until PR #422 (2026-06-18)
        # dropped it to 2/25 while diagnosing publish timeouts that turned
        # out to be the N+1 SQL pattern fixed in #423. Bulk MERGE in #423
        # means HANA-side throughput is no longer the bottleneck; the srv
        # event loop is, but at 4/25 (100 in-flight slugs) it still has
        # plenty of headroom on the 1G/1-instance dev app.
        # See #420 for the planned worker_threads fix that would unlock 6/50+.
        run: |
          npx tsx scripts/publish-content.ts \
            --hugo-dir hugo/public \
            --base-url "${{ steps.srv.outputs.srv_url }}" \
            --trigger "ci/${{ github.event_name }}@${{ github.sha }}" \
            --hugo-version "0.147.7" \
            --initiator "ci/${{ github.run_id }}" \
            --concurrency "${{ inputs.publish-concurrency || '4' }}" \
            --batch-size "${{ inputs.publish-batch-size || '25' }}" \
            --verbose
        env:
          CONTENT_API_KEY: ${{ secrets.CONTENT_API_KEY }}

      - name: Purge orphan tutorials
        id: purge
        if: |
          inputs.purge-orphans == true &&
          steps.mode.outputs.effective_mode == 'full' &&
          steps.publish.outcome == 'success'
        env:
          CAP_BASE_URL:    ${{ steps.srv.outputs.srv_url }}
          CONTENT_API_KEY: ${{ secrets.CONTENT_API_KEY }}
          PURGE_CAP_ABS:   '50'
          INITIATOR:       "ci/${{ github.run_id }}"
        run: npx tsx scripts/publish-content.ts --purge-orphans

      - name: Build display app
        if: ${{ steps.mode.outputs.effective_mode != 'slug-targeted' }}
        run: npm run build:display

      - name: Build admin SPAs
        if: ${{ steps.mode.outputs.effective_mode != 'slug-targeted' }}
        # Issue #350: the rebuild-content tarball must include admin-shell,
        # analytics-explorer, and scanner. The approuter's /admin/rebuild
        # handler atomically swaps STATIC_DIR with the tarball contents, so
        # any directory NOT in the tarball gets wiped from the deployed pod.
        # Without this step, every successful workflow run breaks
        # /admin-ui/, /scanner-ui/, and /analytics-ui/ until the next mta
        # deploy. The recipe mirrors .deploy/mta.yaml:115-123.
        run: |
          npm --prefix app/admin-shell install
          npm --prefix app/admin-shell run build
          npm --prefix app/analytics-explorer install
          npm --prefix app/analytics-explorer run build

      - name: Assemble static content
        if: ${{ steps.mode.outputs.effective_mode != 'slug-targeted' }}
        run: |
          mkdir -p approuter/static
          cp -r hugo/public/* approuter/static/
          rm -rf approuter/static/tutorials
          cp -r app/display-app/dist approuter/static/display-app
          mkdir -p approuter/static/admin-ui
          cp -r app/admin-shell/dist/. approuter/static/admin-ui/
          mkdir -p approuter/static/analytics-ui
          cp -r app/analytics-explorer/dist/. approuter/static/analytics-ui/
          cp -r app/scanner/webapp approuter/static/scanner-ui

      - name: Create content tarball
        if: ${{ steps.mode.outputs.effective_mode != 'slug-targeted' }}
        run: tar czf content.tar.gz -C approuter/static .

      - name: Upload content artifact
        if: ${{ steps.mode.outputs.effective_mode != 'slug-targeted' }}
        uses: actions/upload-artifact@v4
        with:
          name: content-${{ steps.env.outputs.target }}-${{ github.run_number }}
          path: content.tar.gz
          retention-days: 7

      - name: Push content to AppRouter
        if: ${{ steps.mode.outputs.effective_mode != 'slug-targeted' }}
        run: |
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.REBUILD_API_KEY }}" \
            -H "Content-Type: application/gzip" \
            --data-binary @content.tar.gz \
            "${{ steps.url.outputs.approuter_url }}/admin/rebuild")

          echo "HTTP Status: $HTTP_STATUS"
          cat response.json

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Content rebuild failed with HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Summary
        run: |
          echo "### Content Rebuild Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Environment:** ${{ steps.env.outputs.target }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Trigger:** ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Effective mode:** \`${{ steps.mode.outputs.effective_mode }}\` — ${{ steps.mode.outputs.effective_reason }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ inputs.slug }}" ] || [ -n "${{ inputs.slugs }}" ]; then
            FILTER="${{ inputs.slug }}"
            if [ -n "${{ inputs.slugs }}" ]; then
              if [ -n "$FILTER" ]; then FILTER="$FILTER,${{ inputs.slugs }}"
              else FILTER="${{ inputs.slugs }}"
              fi
            fi
            echo "- **Slug filter:** $FILTER (partial refresh)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "- **Source repo:** ${{ github.event.client_payload.repository }}" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.mode.outputs.effective_mode }}" != "catalog-only" ]; then
            echo "- **AI authoring:** enabled (cap=${{ inputs.ai-author-build-cap }})" >> "$GITHUB_STEP_SUMMARY"
          fi
