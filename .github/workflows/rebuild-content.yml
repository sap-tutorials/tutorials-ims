name: Rebuild Content

on:
  repository_dispatch:
    types: [tutorial-updated]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - qa
          - prod
      slug:
        description: Refresh a single tutorial slug only (leave blank for full rebuild)
        required: false
        type: string
      slugs:
        description: 'Refresh multiple slugs (comma-separated, e.g. "foo,bar,baz"). Unioned with `slug` if both set; full rebuild if both blank. Spec: #433.'
        required: false
        type: string
      trigger-source:
        description: 'Where the rebuild was triggered from (admin-write | manual | scheduled)'
        required: false
        default: 'manual'
        type: string
      ai-author-build-cap:
        description: 'Hard cap on AI-quiz LLM calls per build (overrides default 200). Use 10000 for first-time bulk seed.'
        required: false
        default: '200'
        type: string
      force-cap-refetch:
        description: 'Bypass the .tutorial-cache/ CAP catalog snapshot (24h TTL) and re-fetch /build/catalog fresh. Set true after fixing data the catalog reads from (publish flag, slugs, etc.) so the rebuild reflects the change in the same run instead of waiting for the cache to expire.'
        required: false
        default: false
        type: boolean
      force-publish:
        description: 'Skip the /content/hashes delta-detection round-trip and upload every slug as if changed. Default behavior (--force off) only invokes linkTutorialAuthorship / TutorialMeta upsert for slugs whose Hugo HTML hash differs from the prior manifest. Set true to force every slug through the publish path — necessary after merging any change to publish-time per-slug logic (resolver phases, FK updates, side-effect bootstraps in srv/lib/content-publish-session.js). Adds ~10-20s to wall-clock (full payload upload vs delta).'
        required: false
        default: false
        type: boolean
      publish-concurrency:
        description: 'Number of /content/publish/append batches in flight at once. Default raised 4 → 6 in issue #434 PR 2 (final stage) after 9 stable runs at 4/25. Restores the original pre-#422 throughput now that bulk SQL (#423) makes it safe. Lower below 6 if srv hits HeadersTimeoutError again.'
        required: false
        default: '6'
        type: string
      publish-batch-size:
        description: 'Slugs per /content/publish/append batch. Default raised 25 → 50 in issue #434 PR 2 (final stage). Multiplied by publish-concurrency gives total in-flight slugs (current default 6x50 = 300). The whole catalog has ~1400 slugs so smaller batches just take longer linearly, not exponentially. Lower if srv hits HeadersTimeoutError.'
        required: false
        default: '50'
        type: string
      mode:
        description: |
          Rebuild scope (pick the SMALLEST that fits the change to keep wall-clock down).

          - 'catalog-only' — admin Mission/Group/CompletionPath/FeaturedTask edits. Skips
            fetch + Vue + AI quiz + display + admin SPAs + approuter push. Hugo + publish
            only. Auto-selected by admin writes via _classify-rebuild-mode.js.

          - 'slug-targeted' — one or a few tutorials changed (parser fix, content typo,
            single-author edit). Uses `slug` / `slugs` inputs to narrow the fetch step.
            Same skip list as catalog-only PLUS still refetches the listed slug(s).
            Auto-selected by admin Tutorial/Step writes.

          - 'full' — full catalog rebuild (e.g. dependency bump, Vue island change, AppRouter
            asset change, scheduled nightly). Runs everything. 7-13 min wall clock.

          UX: leaving this at the default 'full' AND setting `slug` / `slugs` will auto-infer
          'slug-targeted' (the implicit user intent — see the 'Determine effective rebuild
          mode' step). Issue: #609.
        required: false
        default: full
        type: choice
        options:
          - full
          - catalog-only
          - slug-targeted
      purge-orphans:
        description: 'After publish, soft-delete tutorials no longer present in any upstream repo. CI-only, 50-slug safety cap (override via PURGE_CAP_ABS env).'
        required: false
        type: boolean
        default: false
      content-cache:
        description: 'EXPERIMENTAL (Workstream C / slug-targeted-delta-rebuild): on a slug-targeted run, reuse the generated-content cache to skip regenerating unchanged tutorials (the bulk of the Fetch step). Fail-open; default OFF. Enable to A/B the fast path on DEV before flipping it on by default.'
        required: false
        type: boolean
        default: false

env:
  NODE_VERSION: '22'

# Serialize rebuilds per target env. The single srv-side `content-publish`
# JobLock (srv/lib/content-publish-session.js) admits ONE publish session at a
# time; two rebuilds racing it means the loser gets a hard 409 "Another publish
# in progress" and the run fails (#1384 — bursts of `tutorial-updated`
# dispatches to prod collided this way). Keying the group on the resolved
# target env (same expression as the job-level `if` and the "Determine
# environment" step) lets prod/qa/dev rebuilds run in parallel with EACH OTHER
# but queues same-env runs. cancel-in-progress:false because a rebuild that has
# already acquired the lock and is mid-publish must finish — cancelling it would
# strand the lock until its 30-min TTL and orphan the PUBLISHING manifest row.
concurrency:
  group: >-
    rebuild-content-${{
      github.event_name == 'workflow_dispatch'
        && (inputs.environment || 'dev')
        || (github.event.client_payload.environment || 'prod')
    }}
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      # #1373 — the failure/recovery notifier opens, comments on, and closes a
      # deduplicated GitHub issue; assignment triggers GitHub's native email.
      issues: write
    # DEV rebuilds are ENABLED: once the DEV approuter Credential Store is seeded
    # with REBUILD_API_KEY / CONTENT_API_KEY, `gh workflow run rebuild-content.yml
    # -f environment=dev` publishes DEV content server-side — no local key paste,
    # matching the PROD/QA path. The previous job-level `if:` gate that
    # force-SKIPPED every dev-targeted run has been removed.
    #
    # PREREQUISITE (one-time, MUST be done before this is relied on): seed the DEV
    # approuter Credential Store with CONTENT_API_KEY + REBUILD_API_KEY (values
    # matching the GH `CONTENT_API_KEY` / `REBUILD_API_KEY` secrets) via
    # /admin-ui/#secrets on the DEV approuter. Without it, a dev run 401s at the
    # HANA content-publish step (and the PipelineLog failure reporter) and goes red.
    #
    # repository_dispatch behaviour is unchanged: the "Determine environment" step
    # below still defaults an absent/unknown env to prod.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Hugo
        run: curl -fsSL https://github.com/gohugoio/hugo/releases/download/v0.147.7/hugo_extended_0.147.7_linux-amd64.tar.gz | tar -xz -C /tmp hugo

      - name: Determine environment
        id: env
        # repository_dispatch (source-repo push → tutorial-updated) carries the
        # intended target in client_payload.environment. Validate against the
        # allowlist and default to 'prod' when absent or unrecognized — DEV
        # rebuilds are disabled (missing DEV approuter keys → 401), so an
        # env-less legacy dispatch routes to prod, the only env with scheduled/
        # dispatch rebuild configured. workflow_dispatch uses the typed choice
        # input directly. (#1154 env-routing; dev-disable fallback flip.)
        #
        # Trust model (deliberate — no additional approval gate): the source
        # template fires only `on: push: branches: [main]`, so a dispatch
        # reflects content ALREADY PR-reviewed + merged on the source repo —
        # branch protection there IS the gateway. The target env is repo-
        # CONFIGURED (source repo's REBUILD_ENVIRONMENT var, default prod),
        # not chosen per-push, and firing the dispatch requires a token with
        # Contents:write on tutorials-ims (the App / PAT — trusted operators).
        # A GitHub security review flagged payload-driven prod routing as a
        # trust-boundary expansion; accepted per maintainer decision (#1154)
        # since merge-to-main is the intended and sufficient publish gate.
        env:
          PAYLOAD_ENV: ${{ github.event.client_payload.environment }}
          EVENT: ${{ github.event_name }}
          INPUT_ENV: ${{ inputs.environment }}
        run: |
          if [ "$EVENT" = "repository_dispatch" ]; then
            case "$PAYLOAD_ENV" in
              dev|qa|prod) TARGET="$PAYLOAD_ENV" ;;
              *)           TARGET="prod" ;;
            esac
          else
            TARGET="$INPUT_ENV"
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          # Only the allowlisted TARGET is emitted to the workflow-command line.
          # PAYLOAD_ENV is untrusted (attacker-controlled dispatch payload) and
          # is NOT echoed into ::notice:: — newline/control sequences in it could
          # otherwise inject workflow commands.
          echo "::notice title=Target environment::$TARGET (event=$EVENT)"

      # #609: auto-infer the rebuild scope so manual hotfix dispatches don't
      # silently fall through to `mode=full` and run for 10 minutes when the
      # user only set the `slug` input. The admin-write path (srv/lib/
      # rebuild-trigger.js + _classify-rebuild-mode.js) already classifies
      # mode per entity, so we ONLY auto-infer on workflow_dispatch — never
      # second-guess the admin classifier.
      #
      # Rules:
      #   - workflow_dispatch + inputs.mode=full + (slug or slugs set)
      #       → slug-targeted (the implicit user intent)
      #   - everything else → pass inputs.mode through untouched
      #
      # The resolved value is echoed to STEP_SUMMARY so users see why the
      # workflow ran the steps it did.
      - name: Determine effective rebuild mode
        id: mode
        env:
          # Pin all dispatch-controlled inputs into env vars first so the
          # shell logic doesn't need to template-interpolate into bash
          # conditionals (which is brittle when inputs are missing).
          INPUT_MODE: ${{ inputs.mode || 'full' }}
          INPUT_SLUG: ${{ inputs.slug }}
          INPUT_SLUGS: ${{ inputs.slugs }}
          INPUT_PURGE_ORPHANS: ${{ inputs.purge-orphans }}
          EVENT: ${{ github.event_name }}
          # repository_dispatch (source-repo push) may carry the single changed
          # tutorial slug (#1154 follow-up). Untrusted payload — validated below
          # against a strict slug charset before use.
          PAYLOAD_SLUG: ${{ github.event.client_payload.slug }}
        run: |
          EFFECTIVE="$INPUT_MODE"
          REASON="explicit (inputs.mode=$INPUT_MODE)"

          if [ "$EVENT" = "workflow_dispatch" ] \
             && [ "$INPUT_MODE" = "full" ] \
             && { [ -n "$INPUT_SLUG" ] || [ -n "$INPUT_SLUGS" ]; }; then
            EFFECTIVE='slug-targeted'
            REASON='auto-inferred (slug/slugs set, mode left at default)'
          fi

          # repository_dispatch with a single valid slug → slug-targeted (fast
          # ~2min) instead of the default full (~10min). The slug is attacker-
          # influenced (dispatch payload), so accept ONLY a strict lowercase
          # slug charset [a-z0-9-] matched across the WHOLE value (POSIX case,
          # not line-anchored grep which a newline could bypass), and reject any
          # value containing a newline outright so it can never corrupt the
          # GITHUB_OUTPUT key=value format. Anything else (empty, multi-slug,
          # junk, embedded newline) falls through to full — safe default.
          if [ "$EVENT" = "repository_dispatch" ]; then
            case "$PAYLOAD_SLUG" in
              *[!a-z0-9-]* | -* | '' ) : ;;                     # invalid → no-op, stays full
              *) EFFECTIVE='slug-targeted'
                 REASON="auto-inferred (repository_dispatch slug=$PAYLOAD_SLUG)"
                 echo "dispatch_slug=$PAYLOAD_SLUG" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

          # Issue #orphan-purge — reject purge-orphans=true with anything
          # other than effective_mode=full. slug-targeted/catalog-only
          # deliberately don't fetch the whole catalog, so 1392+ slugs
          # would falsely appear as orphans. Fail loud (operator clearly
          # intended the purge).
          if [ "${INPUT_PURGE_ORPHANS:-false}" = "true" ] && [ "$EFFECTIVE" != "full" ]; then
            echo "::error title=purge-orphans requires mode=full::Got effective_mode=$EFFECTIVE. Re-run with -f mode=full -f purge-orphans=true."
            exit 1
          fi

          echo "effective_mode=$EFFECTIVE" >> "$GITHUB_OUTPUT"
          echo "effective_reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "::notice title=Rebuild mode::$EFFECTIVE ($REASON)"

      - name: Set approuter URL
        id: url
        run: |
          case "${{ steps.env.outputs.target }}" in
            dev)  echo "approuter_url=${{ secrets.APPROUTER_URL_DEV }}" >> "$GITHUB_OUTPUT" ;;
            qa)   echo "approuter_url=${{ secrets.APPROUTER_URL_QA }}" >> "$GITHUB_OUTPUT" ;;
            prod) echo "approuter_url=${{ secrets.APPROUTER_URL_PROD }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Set CAP srv URL
        id: srv
        run: |
          case "${{ steps.env.outputs.target }}" in
            dev)  echo "srv_url=${{ secrets.CAP_SRV_URL_DEV }}" >> "$GITHUB_OUTPUT" ;;
            qa)   echo "srv_url=${{ secrets.CAP_SRV_URL_QA }}" >> "$GITHUB_OUTPUT" ;;
            prod) echo "srv_url=${{ secrets.CAP_SRV_URL_PROD }}" >> "$GITHUB_OUTPUT" ;;
          esac

      # Cache the *materialized* node_modules (root + hugo-apps), not just the
      # npm download cache. `setup-node` `cache: npm` already warms ~/.npm, but
      # `npm ci` still spends ~48s extracting/linking 1680 packages + running
      # native builds (better-sqlite3) into node_modules on every run. An
      # exact-key cache (keyed on both lockfiles + OS + Node major) lets us skip
      # the install entirely when the lockfiles are unchanged.
      #
      # EXACT match only — NO restore-keys. A node_modules restored for a
      # different lockfile would be silently wrong because we skip `npm ci`
      # (which would otherwise reconcile). On any lockfile change the cache
      # misses, the install below runs clean, and the new tree is re-cached.
      # Safe to skip install on hit: neither package.json has install/prepare/
      # postinstall lifecycle scripts, so nothing outside node_modules is
      # produced at install time.
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            hugo-apps/node_modules
          key: node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json', 'hugo-apps/package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # --prefer-offline uses the warm setup-node npm cache; --no-audit/
          # --no-fund trim network + noise. (#1278)
          npm ci --prefer-offline --no-audit --no-fund
          # hugo-apps deps are needed by the island Vite build, which now runs in
          # EVERY content-producing mode (including slug-targeted) so island-src.html
          # can bake hashed /js paths instead of bare /js/<name>.js that 404 on the
          # approuter. (Was slug-skipped pre-2026-08 / #1278; that caused the
          # step-6 validation-island outage on trial-get-productive-with-joule-work.)
          npm --prefix hugo-apps install

      - name: Restore tutorial cache
        uses: actions/cache@v4
        with:
          path: .tutorial-cache
          key: tutorial-cache-${{ hashFiles('.github/workflows/rebuild-content.yml') }}-${{ github.run_id }}
          restore-keys: |
            tutorial-cache-${{ hashFiles('.github/workflows/rebuild-content.yml') }}-
            tutorial-cache-

      # GitHub App token (preferred). Activates when repo variable
      # USE_GITHUB_APP=true and the TUTORIALS_APP_* secrets are populated.
      # See docs/developers/operations/github-app-setup.md. While the variable is unset/false the step
      # is skipped and the fetch falls back to the classic PAT below.
      - name: Generate GitHub App token
        id: app-token
        if: ${{ vars.USE_GITHUB_APP == 'true' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.TUTORIALS_APP_ID }}
          private-key: ${{ secrets.TUTORIALS_APP_PRIVATE_KEY }}
          owner: sap-tutorials

      # [#208/#312] Construct VCAP_SERVICES for the AI-quiz fetch path. The
      # @sap-ai-sdk/orchestration SDK reads aicore credentials from
      # VCAP_SERVICES.aicore[0].credentials when no cds bind is in effect.
      # The secret holds ONLY the inner `credentials` JSON (rotated via
      # `cf delete-service-key tutorials-aicore <key> &&
      #  cf create-service-key tutorials-aicore <key>`).
      # Skipped for catalog-only rebuilds (fetch-tutorials.ts doesn't run).
      # If a model regression sneaks in, set the AI_AUTHOR_AICORE_SERVICE_KEY
      # secret to empty — the SDK then fails fast on first LLM call.
      - name: Set up VCAP_SERVICES for AI authoring
        if: ${{ steps.mode.outputs.effective_mode != 'catalog-only' }}
        env:
          AICORE_CREDENTIALS_JSON: ${{ secrets.AI_AUTHOR_AICORE_SERVICE_KEY }}
        run: |
          if [ -z "${AICORE_CREDENTIALS_JSON}" ]; then
            echo "::error::AI_AUTHOR_AICORE_SERVICE_KEY secret is unset or empty. AI-quiz authoring is always-on post-#312 — see docs/developers/operations/ai-author-ci-setup.md."
            exit 1
          fi
          # Wrap the credentials JSON in the outer aicore[] structure the SDK expects.
          # Use jq so a malformed credentials value fails loudly here, not 5 min into
          # fetch-tutorials.ts when an LLM call attempts.
          echo "${AICORE_CREDENTIALS_JSON}" | jq empty || { echo "::error::AI_AUTHOR_AICORE_SERVICE_KEY is not valid JSON"; exit 1; }
          VCAP=$(jq -nc --argjson creds "${AICORE_CREDENTIALS_JSON}" '{aicore: [{label: "aicore", name: "tutorials-aicore", instance_name: "tutorials-aicore", credentials: $creds, plan: "extended"}]}')
          # Mask the constructed VCAP so it doesn't leak in subsequent logs.
          echo "::add-mask::${VCAP}"
          echo "VCAP_SERVICES=${VCAP}" >> "$GITHUB_ENV"

      # EXPERIMENTAL (Workstream C): restore the previously-generated content
      # tree so a slug-targeted run can reuse it and skip regenerating unchanged
      # tutorials. Keyed on the parser/generator SOURCE hash — a parser change
      # misses the key, nothing is restored, and fetch-tutorials full-regenerates
      # (the per-slug existsSync guard falls through). The run_id suffix + prefix
      # restore-keys let each run save its updated tree/sidecar while restoring
      # the most recent matching one (same pattern as the tutorial cache). The
      # runtime feed-fingerprint gate (in fetch-tutorials) covers catalog/tag
      # changes. Only runs when the flag is on; fail-open otherwise.
      - name: Restore generated-content cache
        if: ${{ inputs.content-cache == true && steps.mode.outputs.effective_mode != 'catalog-only' }}
        uses: actions/cache@v4
        with:
          path: |
            hugo/content/tutorials
            hugo/data/image_dimensions.json
            .content-cache
          key: content-tree-v1-${{ hashFiles('scripts/parsers/**', 'scripts/fetch-tutorials.ts', 'scripts/lib/content-cache.ts', 'scripts/lib/expand-ai-authored.ts') }}-${{ github.run_id }}
          restore-keys: |
            content-tree-v1-${{ hashFiles('scripts/parsers/**', 'scripts/fetch-tutorials.ts', 'scripts/lib/content-cache.ts', 'scripts/lib/expand-ai-authored.ts') }}-

      - name: Fetch tutorials
        if: ${{ steps.mode.outputs.effective_mode != 'catalog-only' }}
        # [#357 followup] When force-cap-refetch is true, pass --force-cap so
        # fetch-tutorials.ts ignores the .tutorial-cache/ CAP catalog snapshot
        # (24h TTL) and pulls fresh from /build/catalog. Use after fixing data
        # the catalog reads from (publish flag, slug format, etc.) so the
        # rebuild reflects the change in the same run.
        run: npm run fetch-tutorials -- ${{ inputs.force-cap-refetch == true && '--force-cap' || '' }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.TUTORIALS_GITHUB_TOKEN }}
          CAP_BASE_URL: ${{ steps.srv.outputs.srv_url }}
          CONTENT_API_KEY: ${{ secrets.CONTENT_API_KEY }}
          TUTORIAL_SLUG: ${{ inputs.slug || steps.mode.outputs.dispatch_slug }}
          TUTORIAL_SLUGS: ${{ inputs.slugs }}
          # [#208/#275/#312] AI-quiz authoring. Always-on post-#312
          # (2026-06-27 — soak window completed clean). fetch-tutorials.ts
          # wakes the AI generator on tutorials carrying [AUTOAUTHOR_*]
          # directives in their rules.vr. VCAP_SERVICES (set by the prior
          # step) carries the aicore binding the orchestration SDK needs.
          # Cost is bounded by (a) author opt-in for the directive and
          # (b) AI_AUTHOR_BUILD_CAP per-build worst-case ceiling.
          # Kill-switch: set AI_AUTHOR_AICORE_SERVICE_KEY secret to empty
          # — the SDK fails fast on first call, falling back to skipping
          # AI expansion. The summary step still emits the [ai-author]
          # telemetry line so the CI invariant regex keeps matching.
          AI_AUTHOR_BUILD_CAP: ${{ inputs.ai-author-build-cap }}
          CHAT_DEPLOYMENT_ID: ${{ secrets.CHAT_DEPLOYMENT_ID }}
          # EXPERIMENTAL (Workstream C): enable the generated-content fast path.
          # fetch-tutorials reuses cached non-target content when this is 'true'
          # AND the run is slug-targeted AND the feed fingerprint matches.
          CONTENT_CACHE_FAST_PATH: ${{ inputs.content-cache == true }}

      # [#601] Generate per-advocate profile-page markdown into
      # hugo/content/developer-advocates/ from /api/advocates. Runs on ALL
      # modes (including catalog-only) so admin Advocates/AdvocateTopics/
      # AdvocateLinks saves regenerate the per-advocate pages within the
      # same rebuild cycle. fetch-advocates.ts is idempotent and bounded
      # by the advocate count (catalog scale, not tutorial scale).
      - name: Fetch advocates
        run: npm run fetch-advocates
        env:
          CAP_BASE_URL: ${{ steps.srv.outputs.srv_url }}

      # [#759] Homepage data feeds — homepage-shelves (60 link cards),
      # verb-definitions (6 verb tile back-faces), shelf-definitions
      # (4 shelf-header explainers). All three are read by Hugo at build
      # time via site.Data.* and rendered into the homepage / verb sub-page
      # templates (hugo/layouts/partials/homepage/verb-spine.html,
      # directory-footer.html, verb/list.html).
      #
      # MUST run in EVERY content-producing mode (full, catalog-only AND
      # slug-targeted). The "Build Hugo site" step below rebuilds the WHOLE
      # site unconditionally, and since #1659 Phase 2 flipped the verb hub
      # pages (/build/, /learn/, …) and the homepage into the published HANA
      # `page-*` store, the "Publish tutorial content to HANA" step now
      # republishes those page BLOBs on every run. The three data files are
      # gitignored, so skipping these fetchers leaves site.Data.* empty →
      # verb/list.html bakes hero-only pages (zero shelves) → publish
      # overwrites the good page-* BLOBs in HANA with empty ones.
      #
      # This previously skipped slug-targeted ("a single-tutorial rebuild
      # doesn't touch the homepage") — an assumption that was TRUE only while
      # the verb/homepage pages were served as approuter static (never
      # published). It became false at #1659 Phase 2 and wiped the live verb/
      # shelf pages on the next `tutorial-updated` dispatch (2026-08-24). The
      # same failure class hit `full`/`catalog-only` on 2026-06-30 (empty
      # flip-card back faces even though the DB was intact); the fetchers
      # mirror `npm run build:all`'s chain (package.json) and must run before
      # Hugo in all modes. The check-verb-shelves guard below is the
      # fail-closed net that stops an empty bake from ever publishing again.
      - name: Fetch homepage shelves
        run: npm run fetch-homepage-shelves
        env:
          CAP_BASE_URL: ${{ steps.srv.outputs.srv_url }}

      - name: Fetch verb definitions
        run: npm run fetch-verb-definitions
        env:
          CAP_BASE_URL: ${{ steps.srv.outputs.srv_url }}

      - name: Fetch shelf definitions
        run: npm run fetch-shelf-definitions
        env:
          CAP_BASE_URL: ${{ steps.srv.outputs.srv_url }}

      # Fail-closed guard (scripts/check-verb-shelves.cjs): fails the run if
      # any homepage verb baked with ZERO active shelf rows, or ALL verbs
      # baked with empty tagline+whyItMatters (the empty-feed signature). This
      # workflow drives /tmp/hugo directly rather than `npm run build:hugo`
      # (where this guard is chained), so it must be an explicit step here —
      # exactly like the security-annotations / island-fingerprint retrofits.
      # Positioned AFTER the feed fetchers and BEFORE the Hugo build + publish
      # so an empty bake can never reach HANA (the 2026-08-24 verb/shelf-page
      # wipe root cause). Runs in all modes.
      - name: Guard - verb pages have shelf content
        run: npm run check-verb-shelves

      # Author-side smell detector. Runs against raw tutorial markdown in
      # .tutorial-cache/ and warns on patterns that produce malformed DOM
      # downstream (see scripts/lint-tutorial-markdown.ts). Non-blocking by
      # default — uploads a JSON report so we can track trends and chase
      # author-side fixes without breaking the rebuild.
      - name: Lint tutorial markdown
        if: ${{ steps.mode.outputs.effective_mode != 'catalog-only' }}
        env:
          TUTORIAL_AUTHOR_TOKEN: ${{ secrets.TUTORIAL_AUTHOR_TOKEN }}
          ANALYTICS_BASE_URL: ${{ vars.ANALYTICS_BASE_URL || 'https://tutorial-system-dev-tutorials-srv.cfapps.eu10-005.hana.ondemand.com/author' }}
        # XSUAA client-credentials tokens expire ~12h. v1 path is
        # workflow_dispatch only; cron-triggered runs may find the token
        # expired, in which case the staleness rule silently skips. This is
        # acceptable because the rule emits non-blocking notices.
        run: npm run lint:tutorial-markdown
        continue-on-error: true

      - name: Upload tutorial-markdown lint report
        if: ${{ always() && steps.mode.outputs.effective_mode != 'catalog-only' }}
        uses: actions/upload-artifact@v4
        with:
          name: tutorial-markdown-lint-${{ steps.env.outputs.target }}-${{ github.run_number }}
          path: .tutorial-cache/lint-report.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Validate tutorials
        if: ${{ steps.mode.outputs.effective_mode != 'catalog-only' }}
        run: npm run validate-tutorials

      # [#1659 Phase C.3] Seed the island name→hash manifest from the DEPLOYED
      # approuter instead of rebuilding the Vite bundles locally. Island JS hashes
      # are NOT deterministic (they depend on the resolved dep tree/toolchain), so
      # a content rebuild that rebuilt them would bake hashes the deployed droplet
      # does not serve. Now that the /admin/rebuild static push is retired (C.4),
      # rebuilds no longer ship JS at all — they render pages against the hashes
      # the approuter ALREADY serves at /_island-manifest.json and publish
      # HANA-only. This replaces the old "Build Vue apps" + "Build island manifest"
      # pair. Fail-closed: if the deployed manifest can't be fetched / is empty /
      # invalid, the rebuild ABORTS rather than bake bare unhashed island paths
      # that 404 on the hashed-only droplet. Runs in ALL modes.
      - name: Seed island manifest from deployed
        env:
          APPROUTER_URL: ${{ steps.url.outputs.approuter_url }}
          ISLAND_MANIFEST_CHANNEL: ${{ steps.env.outputs.target == 'qa' && 'qa' || 'prod' }}
        run: npx tsx scripts/seed-island-manifest-from-deployed.ts

      # [#797] Hugo safeHTML XSS-guard. Sweeps hugo/layouts/**/*.{html,xml,xsl}
      # for unmarked `| safeHTML` / `| safeHTMLAttr` / `printf "<...%s"` usages
      # and fails CI if any occurrence lacks a `<!-- security-reviewed: <reason> -->`
      # marker within 3 lines above (guard: scripts/check-hugo-safe-html.cjs).
      # Runs in all modes (the Hugo build always runs). This workflow invokes
      # /tmp/hugo directly rather than `npm run build:all`, so the explicit
      # step is the only place the guard fires in rebuild-content.
      - name: Check Hugo security annotations
        run: npm run check:security-annotations

      # Preserve /browse/ across catalog-only rebuilds (root-caused 2026-08-07).
      # catalog-only skips the "Fetch tutorials" step, so scripts/fetch-tutorials.ts
      # never runs writeBrowseData() → hugo/data/browse.json is absent → the Hugo
      # build below renders an EMPTY browse/index.html, which the tarball then
      # ships and the approuter's /admin/rebuild atomically swaps over the good,
      # populated browse page (the incident this fixes). browse cards CANNOT be
      # rebuilt here (buildAllCards needs per-tutorial fields only the skipped
      # GitHub fetch provides), so instead re-hydrate browse.json from the page
      # the approuter is CURRENTLY serving. Fails the run (non-zero) rather than
      # ship an empty /browse/ if the deployed page can't be read or is empty.
      # Not needed in `full` (regenerates browse.json) or `slug-targeted` (no
      # tarball push) — so this runs ONLY for catalog-only.
      - name: Preserve browse.json for catalog-only rebuild
        if: ${{ steps.mode.outputs.effective_mode == 'catalog-only' }}
        env:
          APPROUTER_URL: ${{ steps.url.outputs.approuter_url }}
          BROWSE_CHANNEL: ${{ steps.env.outputs.target == 'qa' && 'qa' || 'prod' }}
        run: npx tsx scripts/seed-browse-from-deployed.ts

      # Preserve /authors/{login}/ across catalog-only rebuilds (same wipe class
      # as /browse/ above). catalog-only skips "Fetch tutorials", so
      # fetch-tutorials.ts never emits the per-login author stubs, author_index.json,
      # or the served /author_index.json copy → the Hugo build below would render
      # NO author pages, and the tarball push would atomically clobber the good
      # /authors/* a prior full rebuild shipped. Author pages CANNOT be rebuilt
      # here (buildAuthorIndex needs per-tutorial author attribution only the
      # skipped GitHub fetch provides), so re-hydrate the index from the copy the
      # approuter is CURRENTLY serving at /author_index.json and regenerate the
      # stubs + data + served copy. Fails the run (non-zero) rather than ship a
      # wiped /authors/* if the deployed index can't be read or is empty. Not
      # needed in `full` (regenerates them) or `slug-targeted` (no tarball push).
      - name: Preserve author pages for catalog-only rebuild
        if: ${{ steps.mode.outputs.effective_mode == 'catalog-only' }}
        env:
          APPROUTER_URL: ${{ steps.url.outputs.approuter_url }}
          AUTHOR_CHANNEL: ${{ steps.env.outputs.target == 'qa' && 'qa' || 'prod' }}
        run: npx tsx scripts/seed-authors-from-deployed.ts

      - name: Build Hugo site
        run: /tmp/hugo --source hugo --minify

      # [#1657] Restore CDS syntax highlighting to the runtime-push path. Hugo's
      # render-codeblock.html maps ```cds → the Chroma SQL lexer as a PLACEHOLDER
      # (Chroma has no CDS lexer) and tags the wrapper `data-lang=cds`; the SQL
      # lexer flags CDS braces as illegal, emitting red `<span class=err>{`.
      # scripts/highlight-cds.ts (Shiki + the community cds.tmLanguage.json
      # grammar) then REPLACES those blocks with correct CDS highlighting. This
      # workflow invokes /tmp/hugo directly (NOT `npm run build:all`, which chains
      # build:highlight), so — like the island-manifest/vendor/explore/joule
      # retrofits above — nothing else runs it. Without this step every rebuild
      # publishes the Chroma-SQL fallback (red braces) straight to HANA, which is
      # exactly the regression #1657 reports. Dropped from this path pre-#591 (see
      # content-drift-check.yml). Runs in ALL modes so slug-targeted single-slug
      # publishes are corrected too; the script no-ops on pages without CDS blocks
      # and fails the run if the marker is present but no block matched.
      - name: Highlight CDS code blocks (Shiki)
        run: npm run build:highlight

      # [#1604/#1628] Belt-and-suspenders island-fingerprint guard for the
      # runtime-push path. #1628 added "Build island manifest" above so
      # island-src.html emits hashed /js/<name>-<hash>.js. This fails the run if
      # the rendered homepage STILL carries only bare island paths (e.g. a future
      # reorder/rename silently drops the manifest step again) — BEFORE the
      # tarball is assembled and pushed to /admin/rebuild, where it would
      # atomically clobber the good approuter static with 404-ing bare refs (the
      # PROD outage of 2026-08-10/11). Mirrors deploy-mta.cjs Step 2.5, which
      # guards the DEPLOY path only. Deterministic (checks hugo/public, not the
      # multi-instance live approuter). Runs in all modes including slug-targeted
      # (Task 2 / #1628 ensures the island manifest is built in slug-targeted so
      # hashed refs are baked). Gates on the Vite manifest, so it
      # never false-fails when island bundles were not built.
      - name: Guard - homepage islands fingerprinted
        # Now that the island manifest is built in slug-targeted too, this guard is
        # meaningful in every mode: fail loud if index.html bakes only bare island
        # paths while a Vite manifest exists.
        run: node scripts/check-hugo-island-fingerprint.cjs --hugo-dir hugo/public

      # [#1659 Phase C.3] Approuter-asset guard — now runs in ALL modes. Since the
      # /admin/rebuild static push is retired (C.4), NO rebuild ships CSS or island
      # JS: every mode renders HTML against the assets the deployed approuter
      # ALREADY serves and publishes HANA-only. Hugo content-hash-fingerprints its
      # CSS (head.html / baseof.html: `| fingerprint` → sap-fundamental.<hash>.css,
      # joule.<hash>.css, …) and island-src.html emits hashed island
      # /js/<name>-<hash>.js from the seeded manifest. If any referenced hash isn't
      # served by the target approuter (a CSS-template change #1605 not yet
      # deployed, or a stale seeded island manifest), the page would 404 its
      # stylesheet/island silently (publish + verify-rows still pass; only visible
      # in a browser). This guard probes the approuter for every referenced /css AND
      # hashed island asset and FAILS BEFORE the HANA publish, so the DB is never
      # poisoned with HTML the approuter can't dress. The referenced hrefs are
      # identical across tutorial pages (shared head/baseof partials), so one page
      # covers the CSS failure class; PUBLISH_SLUG scopes it to the changed tutorial
      # (empty → scans all rendered pages). A bare /js/<name>.js fallback is never
      # probed. Static assets are public, so no REBUILD_API_KEY is needed; a
      # fully-gated/unreachable channel (no 200s at all) is treated as inconclusive
      # and does not block.
      - name: Guard - approuter serves referenced CSS + islands
        env:
          APPROUTER_URL: ${{ steps.url.outputs.approuter_url }}
          # Pass the (possibly dispatch-influenced) slug via env, NOT the command
          # line — mirrors the publish step, so the value is never re-parsed by
          # the shell. The guard reads PUBLISH_SLUG as its slug fallback.
          PUBLISH_SLUG: ${{ inputs.slug || steps.mode.outputs.dispatch_slug }}
        run: |
          node scripts/check-approuter-assets.cjs \
            --approuter-url "$APPROUTER_URL" \
            --hugo-dir hugo/public \
            --check-islands

      - name: Publish tutorial content to HANA
        id: publish
        # Concurrency / batch-size are tunable via workflow_dispatch inputs
        # (default raised 2/25 → 4/25 in issue #434 PR 1; staged toward
        # the original pre-#422 6/50 in PR 2 once 4/25 has 2-3 stable runs).
        # repository_dispatch events fall through to the same default via
        # the empty-string fallback expression below.
        #
        # Historical: 6/50 was the original default until PR #422 (2026-06-18)
        # dropped it to 2/25 while diagnosing publish timeouts that turned
        # out to be the N+1 SQL pattern fixed in #423. Bulk MERGE in #423
        # means HANA-side throughput is no longer the bottleneck; the srv
        # event loop is, but at 4/25 (100 in-flight slugs) it still has
        # plenty of headroom on the 1G/1-instance dev app.
        # See #420 for the planned worker_threads fix that would unlock 6/50+.
        run: |
          npx tsx scripts/publish-content.ts \
            --hugo-dir hugo/public \
            --base-url "${{ steps.srv.outputs.srv_url }}" \
            --trigger "ci/${{ github.event_name }}@${{ github.sha }}" \
            --hugo-version "0.147.7" \
            --initiator "ci/${{ github.run_id }}" \
            --concurrency "${{ inputs.publish-concurrency || '4' }}" \
            --batch-size "${{ inputs.publish-batch-size || '25' }}" \
            ${{ inputs.force-publish == true && '--force' || '' }} \
            --verbose
        env:
          CONTENT_API_KEY: ${{ secrets.CONTENT_API_KEY }}
          # #1278 — single-tutorial fast path. In slug-targeted mode, scope the
          # publish to just the changed slug (publish-content.ts reads
          # PUBLISH_SLUG as the --slug fallback) so it hashes+publishes 1 file
          # instead of the whole catalog. Passed via env (not the command line)
          # so the slug value never lands in the shell string. Empty in every
          # other mode → whole-catalog delta, unchanged. TUTORIAL_SLUG is the
          # already-resolved slug (inputs.slug || dispatch_slug).
          PUBLISH_SLUG: ${{ steps.mode.outputs.effective_mode == 'slug-targeted' && (inputs.slug || steps.mode.outputs.dispatch_slug) || '' }}

      # #1373 — synthetic watchdog. A green publish step is not proof rows
      # landed (the #1372 render-concepts 404 aborted AFTER an earlier
      # green-looking phase). Probe GET /content/hashes on the target srv and
      # fail if the active version serves no slugs, turning the silent
      # publish-succeeded-but-empty class into a red run the notifier emails on.
      # /content/hashes is public-read on prod srv; srv-qa gates it behind
      # CONTENT_API_KEY_QA, so pass the QA key only for a qa-target dispatch.
      - name: Verify publish landed rows
        if: ${{ steps.publish.outcome == 'success' }}
        uses: ./.github/actions/verify-publish-landed
        with:
          base-url: ${{ steps.srv.outputs.srv_url }}
          bearer: ${{ steps.env.outputs.target == 'qa' && secrets.CONTENT_API_KEY_QA || '' }}
          channel: ${{ steps.env.outputs.target }}
          min-slugs: '1'

      - name: Purge orphan tutorials
        id: purge
        if: |
          inputs.purge-orphans == true &&
          steps.mode.outputs.effective_mode == 'full' &&
          steps.publish.outcome == 'success'
        env:
          CAP_BASE_URL:    ${{ steps.srv.outputs.srv_url }}
          CONTENT_API_KEY: ${{ secrets.CONTENT_API_KEY }}
          PURGE_CAP_ABS:   '50'
          INITIATOR:       "ci/${{ github.run_id }}"
        run: npx tsx scripts/publish-content.ts --purge-orphans

      # [#1659 Phase C.4] The /admin/rebuild static push is RETIRED. Content
      # rebuilds are now HANA-only: pages render against the deployed asset hashes
      # (island manifest seeded above, all referenced CSS+island assets verified by
      # the guard before publish) and are written to HANA by the publish step above.
      # The approuter serves all static (CSS / island JS / vendor / SPAs) from the
      # droplet the MTA deploy ships — a content rebuild never mutates it, so the
      # old "Build display app / Build admin SPAs / Assemble / tarball / Push to
      # AppRouter" steps (which existed only to repopulate the atomically-replaced
      # droplet static) are gone.

      - name: Summary
        run: |
          echo "### Content Rebuild Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Environment:** ${{ steps.env.outputs.target }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Trigger:** ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Effective mode:** \`${{ steps.mode.outputs.effective_mode }}\` — ${{ steps.mode.outputs.effective_reason }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ inputs.slug }}" ] || [ -n "${{ inputs.slugs }}" ]; then
            FILTER="${{ inputs.slug }}"
            if [ -n "${{ inputs.slugs }}" ]; then
              if [ -n "$FILTER" ]; then FILTER="$FILTER,${{ inputs.slugs }}"
              else FILTER="${{ inputs.slugs }}"
              fi
            fi
            echo "- **Slug filter:** $FILTER (partial refresh)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "- **Source repo:** ${{ github.event.client_payload.repository }}" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.mode.outputs.effective_mode }}" != "catalog-only" ]; then
            echo "- **AI authoring:** enabled (cap=${{ inputs.ai-author-build-cap }})" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Observability (#observability): if any step above failed, record a FAILED
      # PipelineLog row on the srv so the failure surfaces in the admin
      # PipelineLog dashboard operators watch — not just as a red run in an
      # unwatched CI tab. Best-effort: never fail the job on the report itself.
      # NOTE (#1373): PipelineLog alone is an unwatched surface — the "Notify on
      # rebuild failure" step below is the real alert (auto-filed,
      # assignee-emailed GitHub issue). This PipelineLog write is a secondary
      # in-admin breadcrumb.
      - name: Report failure to PipelineLog
        if: ${{ failure() }}
        continue-on-error: true
        env:
          APPROUTER_URL: ${{ steps.url.outputs.approuter_url }}
          REBUILD_API_KEY: ${{ secrets.REBUILD_API_KEY }}
        run: |
          if [ -z "$APPROUTER_URL" ] || [ -z "$REBUILD_API_KEY" ]; then
            echo "::warning::Cannot report failure to PipelineLog (missing APPROUTER_URL or REBUILD_API_KEY)"
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -m 30 -o /dev/null -w "PipelineLog report HTTP %{http_code}\n" \
            -X POST "$APPROUTER_URL/content/pipeline-log" \
            -H "Authorization: Bearer $REBUILD_API_KEY" \
            -H "Content-Type: application/json" \
            --data "$(jq -nc \
              --arg env "${{ steps.env.outputs.target }}" \
              --arg mode "${{ steps.mode.outputs.effective_mode }}" \
              --arg trigger "${{ github.event_name }}" \
              --arg run "$RUN_URL" \
              '{pipelineType:"HUGO_BUILD", initiator:("ci/rebuild-content@"+$trigger), summary:("rebuild-content failed (env="+$env+", mode="+$mode+")"), errorDetails:("CI run failed before/at content publish. Logs: "+$run), metadata:{env:$env, mode:$mode, trigger:$trigger, runUrl:$run}}')" \
            || echo "::warning::PipelineLog failure-report POST did not complete"

      # #1373 — the real alert. On failure, open (or append to) a deduplicated,
      # per-env GitHub issue assigned to the on-call owner; GitHub emails the
      # assignee natively (no SMTP/Slack secret). repository_dispatch runs have
      # no human owner, so this is the only path that reaches a person.
      - name: Notify on rebuild failure
        if: ${{ failure() }}
        uses: ./.github/actions/report-rebuild-failure
        with:
          outcome: failure
          channel: ${{ steps.env.outputs.target }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          trigger: ${{ github.event_name }}
          details: 'env=${{ steps.env.outputs.target }}, mode=${{ steps.mode.outputs.effective_mode }}'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # #1373 — on success, close any open rebuild-failure issue for this env and
      # reset the consecutive-failure streak.
      - name: Resolve rebuild-failure issue on success
        if: ${{ success() }}
        continue-on-error: true
        uses: ./.github/actions/report-rebuild-failure
        with:
          outcome: success
          channel: ${{ steps.env.outputs.target }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          trigger: ${{ github.event_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
