name: Rebuild Content

on:
  repository_dispatch:
    types: [tutorial-updated]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - qa
          - prod
      slug:
        description: Refresh a single tutorial slug only (leave blank for full rebuild)
        required: false
        type: string

env:
  NODE_VERSION: '20'

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Hugo
        run: curl -fsSL https://github.com/gohugoio/hugo/releases/download/v0.147.7/hugo_extended_0.147.7_linux-amd64.tar.gz | tar -xz -C /tmp hugo

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "target=dev" >> "$GITHUB_OUTPUT"
          else
            echo "target=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set approuter URL
        id: url
        run: |
          case "${{ steps.env.outputs.target }}" in
            dev)  echo "approuter_url=${{ secrets.APPROUTER_URL_DEV }}" >> "$GITHUB_OUTPUT" ;;
            qa)   echo "approuter_url=${{ secrets.APPROUTER_URL_QA }}" >> "$GITHUB_OUTPUT" ;;
            prod) echo "approuter_url=${{ secrets.APPROUTER_URL_PROD }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Set CAP srv URL
        id: srv
        run: |
          case "${{ steps.env.outputs.target }}" in
            dev)  echo "srv_url=${{ secrets.CAP_SRV_URL_DEV }}" >> "$GITHUB_OUTPUT" ;;
            qa)   echo "srv_url=${{ secrets.CAP_SRV_URL_QA }}" >> "$GITHUB_OUTPUT" ;;
            prod) echo "srv_url=${{ secrets.CAP_SRV_URL_PROD }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix hugo-apps install

      - name: Restore tutorial cache
        uses: actions/cache@v4
        with:
          path: .tutorial-cache
          key: tutorial-cache-${{ hashFiles('.github/workflows/rebuild-content.yml') }}-${{ github.run_id }}
          restore-keys: |
            tutorial-cache-${{ hashFiles('.github/workflows/rebuild-content.yml') }}-
            tutorial-cache-

      # GitHub App token (preferred). Activates when repo variable
      # USE_GITHUB_APP=true and the TUTORIALS_APP_* secrets are populated.
      # See docs/developers/operations/github-app-setup.md. While the variable is unset/false the step
      # is skipped and the fetch falls back to the classic PAT below.
      - name: Generate GitHub App token
        id: app-token
        if: ${{ vars.USE_GITHUB_APP == 'true' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.TUTORIALS_APP_ID }}
          private-key: ${{ secrets.TUTORIALS_APP_PRIVATE_KEY }}
          owner: sap-tutorials

      - name: Fetch tutorials
        run: npm run fetch-tutorials
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.TUTORIALS_GITHUB_TOKEN }}
          CAP_BASE_URL: ${{ steps.srv.outputs.srv_url }}
          CONTENT_API_KEY: ${{ secrets.CONTENT_API_KEY }}
          TUTORIAL_SLUG: ${{ inputs.slug }}

      # Author-side smell detector. Runs against raw tutorial markdown in
      # .tutorial-cache/ and warns on patterns that produce malformed DOM
      # downstream (see scripts/lint-tutorial-markdown.ts). Non-blocking by
      # default — uploads a JSON report so we can track trends and chase
      # author-side fixes without breaking the rebuild.
      - name: Lint tutorial markdown
        run: npm run lint:tutorial-markdown
        continue-on-error: true

      - name: Upload tutorial-markdown lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tutorial-markdown-lint-${{ steps.env.outputs.target }}-${{ github.run_number }}
          path: .tutorial-cache/lint-report.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Validate tutorials
        run: npm run validate-tutorials

      - name: Build Vue apps
        run: npm --prefix hugo-apps run build

      - name: Copy Joule vendor bundles
        run: npm run copy-joule-vendor

      - name: Build Hugo site
        run: /tmp/hugo --source hugo --minify

      - name: Publish tutorial content to HANA
        run: |
          npx tsx scripts/publish-content.ts \
            --hugo-dir hugo/public \
            --base-url "${{ steps.srv.outputs.srv_url }}" \
            --trigger "ci/${{ github.event_name }}@${{ github.sha }}" \
            --hugo-version "0.147.7" \
            --verbose
        env:
          CONTENT_API_KEY: ${{ secrets.CONTENT_API_KEY }}

      - name: Build display app
        run: npm run build:display

      - name: Assemble static content
        run: |
          mkdir -p approuter/static
          cp -r hugo/public/* approuter/static/
          rm -rf approuter/static/tutorials
          cp -r app/display-app/dist approuter/static/display-app

      - name: Create content tarball
        run: tar czf content.tar.gz -C approuter/static .

      - name: Upload content artifact
        uses: actions/upload-artifact@v4
        with:
          name: content-${{ steps.env.outputs.target }}-${{ github.run_number }}
          path: content.tar.gz
          retention-days: 7

      - name: Push content to AppRouter
        run: |
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.REBUILD_API_KEY }}" \
            -H "Content-Type: application/gzip" \
            --data-binary @content.tar.gz \
            "${{ steps.url.outputs.approuter_url }}/admin/rebuild")

          echo "HTTP Status: $HTTP_STATUS"
          cat response.json

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Content rebuild failed with HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Summary
        run: |
          echo "### Content Rebuild Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Environment:** ${{ steps.env.outputs.target }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Trigger:** ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ inputs.slug }}" ]; then
            echo "- **Slug filter:** ${{ inputs.slug }} (single-tutorial refresh)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "- **Source repo:** ${{ github.event.client_payload.repository }}" >> "$GITHUB_STEP_SUMMARY"
          fi
