name: no committed secrets check

on:
  pull_request:
  push:
    branches: [main]

# #887 backstop. If a doc revert or a copy-paste from an old branch ever
# reintroduces a known-exposed secret literal, this check fails the build
# instead of silently reopening the vulnerability.
#
# The tripwire list is deliberately narrow — it's for post-rotation values,
# not general secret scanning (use gitleaks/trufflehog for that). See
# scripts/check-no-committed-secrets.js for the current list.

jobs:
  check-no-committed-secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scan for known-exposed secret values
        run: node scripts/check-no-committed-secrets.js
