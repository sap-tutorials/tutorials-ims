# .gitleaks.toml — config for the "secret scan (gitleaks)" workflow.
#
# Extends gitleaks' built-in default ruleset (broad coverage of AWS/GCP/GitHub
# tokens, private keys, generic high-entropy assignments, etc.) and layers on a
# project-specific allowlist so known-safe patterns don't produce false
# positives that would train reviewers to ignore the check.
#
# See .github/workflows/secret-scan.yml. This is the BROAD scanner; the narrow
# known-value tripwire is scripts/check-no-committed-secrets.js.

title = "tutorials-ims gitleaks config"

# Inherit gitleaks' default rules; the [[rules]] / [allowlist] below are additive.
[extend]
useDefault = true

# Add a rule for SAP MCP Personal Access Tokens (pat_<8hex>_<base64url>), so a
# real PAT literal is caught even if it slips past the generic entropy rules.
[[rules]]
id = "sap-mcp-pat"
description = "SAP MCP Personal Access Token"
# pat_ + 8 hex chars + _ + a long base64url secret. Matches the real-token
# shape; the ${MCP_SAP_PAT} env reference does NOT match (no hex block).
regex = '''pat_[0-9a-f]{8}_[A-Za-z0-9_-]{20,}'''
keywords = ["pat_"]

[allowlist]
description = "Project-specific false positives"
# Suppress a specific historical finding by commit: docs/github-app-setup.md
# (line 71, RuleID private-key) in commit 5153670f was an illustrative
# GitHub App private-key EXAMPLE, not a live credential — and the file has
# since been deleted from the tree. gitleaks scans full history (fetch-depth
# 0), so without this the finding fails every PR. Confirmed a placeholder,
# not a real key (2026-07-14).
#
# Suppress srv/lib/github-app-token.js (line 40, RuleID private-key) in commit
# 5a6dedf4: the `normalizePem` JSDoc contains an ILLUSTRATIVE single-line PEM
# ("-----BEGIN RSA PRIVATE KEY----- MIIE... -----END RSA PRIVATE KEY-----")
# documenting the malformed shape the admin Secrets UI produces. The "MIIE..."
# is a literal ellipsis, not a key body — no real secret. gitleaks' private-key
# rule matches the header/footer literal in the comment. Because history is
# scanned (fetch-depth 0), this failed every PR after #1277 merged to main.
# NOTE: the finding is anchored to the commit that introduced line 40; if that
# comment is ever reworded, re-add the new introducing commit here (or drop the
# literal PEM markers from the doc). Confirmed a placeholder (2026-07-23).
# Suppress approuter/lib/github-oidc-keys.js (line 48, RuleID private-key) in
# commit 75778103a: the `ensurePem()` helper contains the literal PEM armor
# ("-----BEGIN PRIVATE KEY-----\n${wrapped}\n-----END PRIVATE KEY-----") it
# uses to WRAP a credstore-sourced key string into PEM form. The literal is a
# template, not a key body — no real secret (the actual signing key lives only
# in the BTP Credential Store, alias GITHUB_OIDC_SIGNING_KEY). gitleaks'
# private-key rule matches the header/footer literal in the code. Because
# history is scanned (fetch-depth 0), this fails every PR after #2618 merged to
# DEV. Same class as the srv/lib/github-app-token.js entry above. NOTE: anchored
# to the introducing commit; if the helper is reworded, re-add the new commit
# (or drop the literal PEM markers). Confirmed a placeholder (2026-10-03).
commits = [
  "5153670f57cb30d9322af3603642fdaf980add74",
  "5a6dedf4345733040e9148dd503b6a62ed5a2b4c",
  "75778103a5b7c54be258feba8f268cc2fa41b687",
]
# Env-var references are the CORRECT, secret-free pattern — never flag them.
regexes = [
  '''\$\{MCP_SAP_PAT[^}]*\}''',
  # The #887 tripwire literal is an already-rotated, documented dead value that
  # scripts/check-no-committed-secrets.js intentionally retains.
  '''tutorials-content-publish-2024''',
]
paths = [
  # The narrow tripwire script + its rotation runbook legitimately contain the
  # dead #887 literal as a description of what NOT to commit.
  '''scripts/check-no-committed-secrets\.js''',
  '''docs/developers/operations/rotate-content-api-key\.md''',
  # Test fixtures use obviously-fake tokens (pat_abcd1234_aaaa..., pat_write0001_...)
  # to exercise auth paths; they are not real credentials.
  '''test/.*\.(test|spec)\.[jt]s''',
  '''srv/.*__tests__/.*''',
  '''test/.*__fixtures__/.*''',
  # hashes.json is a generated slug→SHA-256 content-hash map for delta publish.
  # The 64-hex values trip the generic high-entropy rule but are not secrets.
  '''hashes\.json''',
  # Superpowers plan docs contain illustrative `curl -u user:pass` snippets and
  # example hashes, not live credentials.
  '''docs/superpowers/plans/.*\.md''',
  # API-docs content contains illustrative auth examples, not real secrets.
  '''hugo/content/api-docs/.*''',
  # Feature-flag registry: each entry has a `key:` property whose value is a
  # flag IDENTIFIER (env-var name or DB column), never a secret value. The
  # `key:` keyword + a name like 'MCP_PHASE3_ENABLED' (the digit nudges entropy
  # over the generic-api-key threshold) is a false positive. The file holds
  # only flag metadata by design; the narrow tripwire in
  # scripts/check-no-committed-secrets.js remains the real secret backstop.
  '''srv/lib/feature-flags/registry\.js''',
  # Same registry, moved to @tutorials/core in the package carve (T6). The
  # srv/lib path above is the retained shim; the real file now lives here.
  '''packages/core/feature-flags/registry\.js''',
  # Generated esbuild workspace bundles (srv/lib/_shared, srv-mcp/lib/_shared,
  # srv-qa/lib/_shared) — build output of scripts/bundle-shared.cjs, gitignored
  # going forward. They inline @tutorials/* source incl. feature-flag registry
  # identifiers (same generic-api-key false positive as registry.js above), not
  # secrets. A couple of these blobs also exist in history (commits 75489ca4f /
  # c9eb11cc9) before they were untracked; this path rule covers the scan.
  '''.*/lib/_shared/.*''',
]
