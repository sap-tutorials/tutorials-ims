{{ define "main" }}
<style>
.generic-page { max-width: 760px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
.generic-page__header h1 { font-size: 2rem; margin: 0 0 0.25rem; }
.generic-page__meta { color: var(--sapNeutralTextColor, #666); font-size: 0.875rem; margin: 0 0 1.5rem; }
.generic-page__content h2 { margin-top: 2rem; }
.generic-page__content h3 { margin-top: 1.5rem; }
.generic-page__content table { border-collapse: collapse; width: 100%; margin: 1rem 0; font-size: 0.95rem; }
.generic-page__content th, .generic-page__content td { padding: 0.5rem 0.75rem; border: 1px solid var(--sapList_BorderColor, #e5e5e5); text-align: left; vertical-align: top; }
.generic-page__content th { background: var(--sapList_HeaderBackground, #f7f7f7); }
.generic-page__content blockquote { border-left: 3px solid var(--sapWarning_BorderColor, #e9730c); background: var(--sapWarning_Background, #fef7e6); padding: 0.75rem 1rem; margin: 1rem 0; border-radius: 0 4px 4px 0; }
</style>
<article class="generic-page">
  <header class="generic-page__header">
    <h1>{{ .Title }}</h1>
    {{ with .Params.lastmod }}<p class="generic-page__meta">Last updated: {{ . | dateFormat "2 January 2006" }}</p>{{ end }}
  </header>
  <div class="generic-page__content">
    {{ .Content }}
  </div>
</article>
{{ end }}
