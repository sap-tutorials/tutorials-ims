{{- $index := .Get "index" -}}
{{- $name := .Get "name" -}}
{{- $syncValue := .Get "syncValue" -}}
<div class="tab-panel" id="tabpanel-{{ $index }}" role="tabpanel" aria-labelledby="tab-{{ $index }}" data-tab-panel="{{ $index }}" data-tab-name="{{ $name }}"{{ if $syncValue }} data-sync-value="{{ $syncValue }}"{{ end }}{{ if ne $index "0" }} hidden{{ end }}>
  {{ .Inner }}
</div>
