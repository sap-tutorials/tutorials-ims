{{/*
  tut-since — version tag indicating when a feature was introduced.

  Params:
    label — the version label (e.g. "CAP 9", "UI5 1.120")

  Security note: .Get uses Hugo's default HTML auto-escaping.
  Never apply safeHTML to directive-supplied values.
*/}}
<span class="tut-since-tag">{{ .Get "label" }}</span>
