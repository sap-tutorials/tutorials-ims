{{/*
  tut-cast — asciinema terminal recording embed (lazy-loaded).
  src = resolved URL to .cast file.
  Params: rows, cols, speed, poster, idle-limit.
  Player is loaded lazily by cast.ts when data-tut-cast is present.
*/}}
{{- $src := .Get "src" -}}
<div class="tut-cast" data-tut-cast="{{ $src | safeURL }}"
  {{- with .Get "rows" }} data-rows="{{ . }}"{{ end }}
  {{- with .Get "cols" }} data-cols="{{ . }}"{{ end }}
  {{- with .Get "speed" }} data-speed="{{ . }}"{{ end }}
  {{- with .Get "poster" }} data-poster="{{ . }}"{{ end }}
  {{- with .Get "idle-limit" }} data-idle-limit="{{ . }}"{{ end }}>
  <pre class="tut-cast__placeholder" aria-label="Terminal recording (loading...)">&#9658; Loading terminal recording&#8230;</pre>
</div>
