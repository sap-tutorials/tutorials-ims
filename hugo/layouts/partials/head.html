<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ .Title }} | {{ .Site.Title }}</title>
<link rel="stylesheet" href="https://unpkg.com/@sap-theming/theming-base-content@11/content/Base/baseLib/sap_horizon/css_variables.css">
<link rel="stylesheet" href="https://unpkg.com/fundamental-styles@0.41.4/dist/fonts.css">
<link rel="stylesheet" href="/css/sap-fundamental.css">
<script>
  const t = localStorage.getItem('theme') ||
    (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = t;
  if (t === 'dark') document.documentElement.classList.add('dark');
</script>
