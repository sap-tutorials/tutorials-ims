{{/* License key icon — rendered when a tutorial requires a product license.
     Detection lives at the call site: {{ if in .Params.tags "tutorial>license" }}.
     For mission/group pages where tags propagate up via displayTags, call sites use
     {{ if in .Params.displayTags "License" }} instead. */}}
<span class="license-key" role="img" aria-label="Requires a product license" title="Requires a product license">
  <svg width="14" height="14" viewBox="0 0 16 16" fill="none"
       stroke="currentColor" stroke-width="1.5"
       stroke-linecap="round" stroke-linejoin="round"
       aria-hidden="true" focusable="false">
    <circle cx="5" cy="8" r="2.75"/>
    <path d="M7.75 8H14"/>
    <path d="M11.5 8v2.25"/>
    <path d="M13.5 8v1.5"/>
  </svg>
</span>
