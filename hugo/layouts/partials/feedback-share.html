{{/* Sticky prev/next footer — only renders if at least one neighbour exists */}}
{{ if or .Params.prev .Params.next }}
<div class="tutorial-stepnav" role="navigation" aria-label="Tutorial navigation">
  <div class="tutorial-stepnav__inner">
    <div class="tutorial-stepnav__slot tutorial-stepnav__slot--prev">
      {{ with .Params.prev }}
      <a href="/tutorials/{{ . }}" class="nav-pill">&larr; Previous</a>
      {{ end }}
    </div>
    <div class="tutorial-stepnav__slot tutorial-stepnav__slot--next">
      {{ with .Params.next }}
      <a href="/tutorials/{{ . }}" class="nav-pill nav-pill--primary">Next &rarr;</a>
      {{ end }}
    </div>
  </div>
</div>
{{ end }}

<!-- Tutorial feedback popup (form mount; kept as modal because it hosts a Vue widget) -->
<div id="tutorial-feedback-popup" class="popup-overlay popup-hidden" onclick="if(event.target===this)closePopups()">
  <div class="popup-card">
    <button type="button" class="popup-close" onclick="closePopups()" aria-label="Close">&times;</button>
    <div id="tutorial-feedback-mount"></div>
  </div>
</div>

<script>
window.openTutorialFeedbackPopup = function(slug) {
  closePopups();
  document.getElementById('tutorial-feedback-popup').classList.remove('popup-hidden');
  if (window.mountTutorialFeedback) {
    window.mountTutorialFeedback(slug, 'tutorial-feedback-popup');
    return;
  }
  const s = document.createElement('script');
  s.type = 'module';
  s.src = '/js/tutorial-feedback.js';
  s.onload = () => window.mountTutorialFeedback(slug, 'tutorial-feedback-popup');
  document.head.appendChild(s);
};
function closePopups() {
  const el = document.getElementById('tutorial-feedback-popup');
  if (el) el.classList.add('popup-hidden');
}
</script>
