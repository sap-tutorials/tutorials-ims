<!-- Feedback popup -->

      <div class="feedback-option">

      </div>
      <div class="feedback-option">
        <svg class="feedback-icon" width="48" height="48" viewBox="0 0 48 48" fill="none"><path d="M24 8c-1.1 0-2 .45-2.7 1.35l-1.3 2c-.3.45-.6.7-1 .8l-2.3.5c-1.1.25-1.85.85-2.25 1.8-.4.95-.3 1.9.3 2.8l1.5 1.9c.3.35.4.75.35 1.15l-.25 2.4c-.1 1.1.2 2 .95 2.65.75.65 1.6.85 2.6.55l2.3-.7c.4-.15.8-.15 1.2 0l2.3.7c1 .3 1.85.1 2.6-.55.75-.65 1.05-1.55.95-2.65l-.25-2.4c-.05-.4.05-.8.35-1.15l1.5-1.9c.6-.9.7-1.85.3-2.8-.4-.95-1.15-1.55-2.25-1.8l-2.3-.5c-.4-.1-.7-.35-1-.8l-1.3-2C26 8.45 25.1 8 24 8z" stroke="currentColor" stroke-width="2" fill="none"/></svg>

      </div>
      <div class="feedback-option">
        <svg class="feedback-icon" width="48" height="48" viewBox="0 0 48 48" fill="none"><rect x="10" y="12" width="28" height="20" rx="2" stroke="currentColor" stroke-width="2" fill="none"/><path d="M10 16l14 10 14-10" stroke="currentColor" stroke-width="2" fill="none"/></svg>

        <a href="https://sapinsights.eu.qualtrics.com/jfe/form/SV_0im30RgTkbEEHMV?TutorialID={{ .Params.slug }}&graphics=true" target="_blank" rel="noopener" class="feedback-btn">Take our survey</a>
      </div>
    </div>
  </div>
</div>

<!-- Share popup -->
<div id="share-popup" class="popup-overlay popup-hidden" onclick="if(event.target===this)closePopups()">
  <div class="popup-card popup-card--share">
    <button type="button" class="popup-close" onclick="closePopups()" aria-label="Close">&times;</button>
    <h3 class="popup-title">Share this tutorial</h3>
    <div class="share-icons">
      <a href="https://www.facebook.com/sharer/sharer.php?u={{ .Permalink }}" target="_blank" rel="noopener" class="share-icon" title="Share on Facebook">
        <svg width="32" height="32" viewBox="0 0 32 32"><path d="M18.4 32V17.4h4.9l.7-5.7h-5.6V8.1c0-1.6.5-2.8 2.8-2.8h3V.2C23.5.1 21.8 0 19.8 0c-4.1 0-6.9 2.5-6.9 7.1v4.2H8v5.7h4.9V32h5.5z" fill="#1877F2"/></svg>
      </a>
      <a href="https://www.linkedin.com/sharing/share-offsite/?url={{ .Permalink }}" target="_blank" rel="noopener" class="share-icon" title="Share on LinkedIn">
        <svg width="32" height="32" viewBox="0 0 32 32"><path d="M29.6 0H2.4C1.1 0 0 1 0 2.3v27.4C0 31 1.1 32 2.4 32h27.2c1.3 0 2.4-1 2.4-2.3V2.3C32 1 30.9 0 29.6 0zM9.5 27.3H4.7V12h4.8v15.3zM7.1 9.9c-1.5 0-2.8-1.2-2.8-2.8 0-1.5 1.2-2.8 2.8-2.8 1.5 0 2.8 1.2 2.8 2.8 0 1.6-1.3 2.8-2.8 2.8zm20.2 17.4h-4.8v-7.4c0-1.8 0-4-2.5-4s-2.8 1.9-2.8 3.9v7.6h-4.8V12h4.6v2.1h.1c.6-1.2 2.2-2.5 4.5-2.5 4.8 0 5.7 3.2 5.7 7.3v8.4z" fill="#0A66C2"/></svg>
      </a>
      <a href="mailto:?subject={{ .Title }}&body=Check out this SAP tutorial: {{ .Permalink }}" class="share-icon" title="Share via Email">
        <svg width="32" height="32" viewBox="0 0 32 32"><rect x="2" y="6" width="28" height="20" rx="2" fill="#E8A400"/><path d="M2 8l14 10L30 8" stroke="#fff" stroke-width="2" fill="none"/></svg>
      </a>
    </div>
  </div>
</div>

<script>
function openFeedbackPopup() {
  closePopups();
  document.getElementById('feedback-popup').classList.remove('popup-hidden');
}
function openSharePopup() {
  closePopups();
  document.getElementById('share-popup').classList.remove('popup-hidden');
}
function closePopups() {
  document.getElementById('feedback-popup').classList.add('popup-hidden');
  document.getElementById('share-popup').classList.add('popup-hidden');
}
</script>
