<div class="fd-shellbar">
  <div class="fd-shellbar__group fd-shellbar__group--product">
    <a href="/" class="fd-shellbar__logo">
      <img src="/img/sap-logo.svg" alt="SAP">
    </a>
    <span class="fd-shellbar__title">Tutorial Platform</span>
  </div>
  <div class="fd-shellbar__group fd-shellbar__group--actions">
    <div class="shellbar-nav-dropdown" id="nav-dropdown">
      <button type="button" class="fd-shellbar__button" aria-label="Navigation menu" aria-expanded="false" aria-controls="nav-popover" onclick="toggleNavMenu()">
        <span class="shellbar-nav-dropdown__label">Navigate</span>
        <i class="sap-icon--slim-arrow-down shellbar-nav-dropdown__arrow"></i>
      </button>
      <div id="nav-popover" class="shellbar-popover" style="display:none">
        <ul class="fd-menu__list" role="menu">
          <li class="fd-menu__item" role="menuitem"><a href="/" class="fd-menu__link"><i class="sap-icon--course-book fd-menu__addon-before"></i><span class="fd-menu__title">Tutorials</span></a></li>
          <li class="fd-menu__item" role="menuitem"><a href="/app-space" class="fd-menu__link"><i class="sap-icon--flight fd-menu__addon-before"></i><span class="fd-menu__title">App Space</span></a></li>
          <li class="fd-menu__item" role="menuitem"><a href="/event-display" class="fd-menu__link"><i class="sap-icon--sys-monitor fd-menu__addon-before"></i><span class="fd-menu__title">Event Display</span></a></li>
          <li class="fd-menu__item nav-auth-only" role="menuitem"><a href="/me" class="fd-menu__link"><i class="sap-icon--accomplished fd-menu__addon-before"></i><span class="fd-menu__title">My Completions</span></a></li>
        </ul>
      </div>
    </div>
    <span class="shellbar-separator"></span>
    <div class="shellbar-nav-dropdown" id="share-dropdown">
      <button type="button" class="fd-shellbar__button" aria-label="Share link to this page" title="Share link" aria-expanded="false" aria-controls="share-popover" onclick="toggleShareMenu()">
        <i class="sap-icon--share-2"></i>
      </button>
      <div id="share-popover" class="shellbar-popover shellbar-popover--share" style="display:none">
        <div class="share-popover__body">
          <label class="share-popover__label" for="share-url-input">Link to this page</label>
          <div class="share-popover__row">
            <input type="text" id="share-url-input" class="fd-input share-popover__input" readonly aria-label="Page URL">
            <button type="button" class="fd-button fd-button--emphasized share-popover__copy" onclick="copyShareUrl(this)">Copy</button>
          </div>
          <div class="share-popover__status" id="share-status" aria-live="polite"></div>
        </div>
      </div>
    </div>
    <span class="shellbar-separator"></span>
    <button type="button" class="fd-shellbar__button" aria-label="Joule" title="Joule" id="joule-trigger" hidden>
      <i class="sap-icon--da"></i>
    </button>
    <button type="button" class="fd-shellbar__button" aria-label="Help" title="Help" onclick="window.open('https://community.sap.com','_blank')">
      <i class="sap-icon--question-mark"></i>
    </button>
    <button type="button" class="fd-shellbar__button shellbar-notifications" aria-label="Notifications" title="Notifications" id="notifications-btn">
      <i class="sap-icon--bell"></i>
      <span class="fd-counter fd-counter--notification" aria-label="unread notifications" id="notification-badge"></span>
    </button>
    <span class="shellbar-separator"></span>
    <button type="button" class="theme-toggle" data-action="toggle-theme" aria-label="Toggle dark mode" title="Toggle dark/light mode">
      <span class="theme-toggle-track">
        <span class="theme-toggle-thumb"></span>
        <svg class="theme-toggle-icon theme-toggle-sun" viewBox="0 0 16 16" width="12" height="12"><circle cx="8" cy="8" r="3.5" fill="currentColor"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.41 1.41M11.54 11.54l1.41 1.41M3.05 12.95l1.41-1.41M11.54 4.46l1.41-1.41" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <svg class="theme-toggle-icon theme-toggle-moon" viewBox="0 0 16 16" width="12" height="12"><path d="M13.36 10.2a5.5 5.5 0 0 1-7.56-7.56A6 6 0 1 0 13.36 10.2z" fill="currentColor"/></svg>
      </span>
    </button>
    <span class="shellbar-separator"></span>
    <div class="shellbar-nav-dropdown" id="trust-dropdown">
      <button type="button" class="fd-shellbar__button" aria-label="Legal &amp; Trust" title="Legal &amp; Trust" aria-expanded="false" aria-controls="trust-popover" onclick="toggleTrustMenu()">
        <i class="sap-icon--building"></i>
      </button>
      <div id="trust-popover" class="shellbar-popover" style="display:none">
        <ul class="fd-menu__list" role="menu">
          <li class="fd-menu__item" role="menuitem"><a href="#" data-trust-todo="disclaimer" class="fd-menu__link"><span class="fd-menu__title">Disclaimer</span></a></li>
          <li class="fd-menu__item" role="menuitem"><a href="https://www.sap.com/about/legal/privacy.html" target="_blank" rel="noopener noreferrer" class="fd-menu__link"><span class="fd-menu__title">Privacy</span></a></li>
          <li class="fd-menu__item" role="menuitem"><a href="https://www.sap.com/about/legal/terms-of-use.html" target="_blank" rel="noopener noreferrer" class="fd-menu__link"><span class="fd-menu__title">Terms of Use</span></a></li>
          <li class="fd-menu__item" role="menuitem"><a href="https://www.sap.com/about/legal/impressum.html" target="_blank" rel="noopener noreferrer" class="fd-menu__link"><span class="fd-menu__title">Legal Disclosure</span></a></li>
          <li class="fd-menu__item" role="menuitem"><a href="https://www.sap.com/about/legal/copyright.html" target="_blank" rel="noopener noreferrer" class="fd-menu__link"><span class="fd-menu__title">Copyright</span></a></li>
          <li class="fd-menu__item" role="menuitem"><a href="https://www.sap.com/about/legal/trademark.html" target="_blank" rel="noopener noreferrer" class="fd-menu__link"><span class="fd-menu__title">Trademark</span></a></li>
          <li class="fd-menu__item" role="menuitem"><a href="https://www.sap.com/about/legal/privacy/cookies.html" target="_blank" rel="noopener noreferrer" class="fd-menu__link"><span class="fd-menu__title">Cookie Statement</span></a></li>
        </ul>
      </div>
    </div>
    <span class="shellbar-separator"></span>
    <div class="fd-shellbar__action" id="user-menu">
      <span id="user-avatar" class="fd-avatar fd-avatar--xs fd-avatar--circle fd-avatar--placeholder" role="button" tabindex="0" aria-label="User profile" onclick="handleProfileClick()"><i class="sap-icon--person-placeholder"></i></span>
      <div id="user-popover" class="fd-popover__body fd-popover__body--right">
        <div class="user-popover__content">
          <div class="user-popover__header">
            <span id="user-avatar-large" class="fd-avatar fd-avatar--xl fd-avatar--circle fd-avatar--placeholder"></span>
            <div id="user-name" class="user-popover__name"></div>
            <div id="user-email" class="user-popover__email"></div>
          </div>
          <hr class="user-popover__separator">
          <a href="https://account.sap.com" class="user-popover__link" target="_blank" rel="noopener">Manage my Account</a>
          <a href="https://www.youtube.com/@sapdevs" class="user-popover__link" target="_blank" rel="noopener">SAP Developers &#x2197;</a>
          <a href="https://learning.sap.com" class="user-popover__link" target="_blank" rel="noopener">Learnings &#x2197;</a>
          <a href="https://community.sap.com" class="user-popover__link" target="_blank" rel="noopener">Community &#x2197;</a>
          <hr class="user-popover__separator">
          <button type="button" class="fd-button fd-button--negative" id="logout-btn" onclick="handleLogout()">Logout</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
(function() {
  const capBase = document.documentElement.dataset.capBase || '';
  const avatar = document.getElementById('user-avatar');
  const avatarLarge = document.getElementById('user-avatar-large');
  const popover = document.getElementById('user-popover');
  const userName = document.getElementById('user-name');
  const userEmail = document.getElementById('user-email');
  const navPopover = document.getElementById('nav-popover');
  const trustPopover = document.getElementById('trust-popover');
  const sharePopover = document.getElementById('share-popover');
  const shareUrlInput = document.getElementById('share-url-input');
  const shareStatus = document.getElementById('share-status');
  let isAuthenticated = false;

  function applyInitials(givenName, familyName, id) {
    var initials = (givenName?.[0] || '') + (familyName?.[0] || '');
    if (!initials && id) initials = id[0];
    if (initials) {
      [avatar, avatarLarge].forEach(function(el) {
        el.classList.remove('fd-avatar--placeholder');
        el.classList.add('fd-avatar--accent-color-6');
        while (el.firstChild) el.removeChild(el.firstChild);
        el.textContent = initials.toUpperCase();
      });
    }
  }

  var USER_KEY = 'joule.user.v1';
  var USER_TTL_MS = 60000;

  function readCachedUser() {
    try {
      var raw = sessionStorage.getItem(USER_KEY);
      if (!raw) return null;
      var parsed = JSON.parse(raw);
      if (!parsed || !parsed.value) return null;
      if (Date.now() - parsed.ts > USER_TTL_MS) return null;
      return parsed.value;
    } catch (e) { return null; }
  }

  function applyAuthenticatedUser(u) {
    if (!u) return;
    var given = u.givenName || u.firstName || '';
    var family = u.familyName || '';
    var id = u.id || '';
    isAuthenticated = true;
    userName.textContent = (given + ' ' + family).trim() || id;
    userEmail.textContent = u.email || '';
    document.documentElement.dataset.authenticated = 'true';
    avatar.classList.add('fd-avatar--authenticated');
    applyInitials(given, family, id);
    avatar.setAttribute('aria-label', userName.textContent);
    document.documentElement.dataset.user = JSON.stringify({ firstName: given });
  }

  async function checkAuth() {
    try {
      const res = await fetch(capBase + '/auth/user', { credentials: 'include', redirect: 'follow' });
      if (res.redirected) {
        const cached = readCachedUser();
        if (cached) applyAuthenticatedUser(cached);
        return;
      }
      if (!res.ok) {
        const cached = readCachedUser();
        if (cached) applyAuthenticatedUser(cached);
        return;
      }
      const ct = res.headers.get('content-type') || '';
      if (!ct.includes('application/json')) {
        const cached = readCachedUser();
        if (cached) applyAuthenticatedUser(cached);
        return;
      }
      const user = await res.json();
      if (!user || !user.authenticated) {
        const cached = readCachedUser();
        if (cached) applyAuthenticatedUser(cached);
        return;
      }

      const toCache = { firstName: user.givenName, givenName: user.givenName, familyName: user.familyName, email: user.email, id: user.id };
      try { sessionStorage.setItem(USER_KEY, JSON.stringify({ ts: Date.now(), value: toCache })); } catch (e) {}
      applyAuthenticatedUser(user);
    } catch (e) {
      console.debug('[header/checkAuth] fetch failed, attempting cache fallback', e);
      const cached = readCachedUser();
      if (cached) applyAuthenticatedUser(cached);
    }
  }

  window.handleLogout = function() {
    try {
      for (var i = sessionStorage.length - 1; i >= 0; i--) {
        var k = sessionStorage.key(i);
        if (k && k.indexOf('joule.') === 0) sessionStorage.removeItem(k);
      }
    } catch {}
    window.location.href = '/logout';
  };

  window.handleProfileClick = function() {
    if (!isAuthenticated) {
      window.location.href = '/login?returnTo=' + encodeURIComponent(window.location.pathname + window.location.search);
      return;
    }
    navPopover.style.display = 'none';
    trustPopover.style.display = 'none';
    sharePopover.style.display = 'none';
    document.querySelector('#trust-dropdown .fd-shellbar__button').setAttribute('aria-expanded', 'false');
    document.querySelector('#share-dropdown .fd-shellbar__button').setAttribute('aria-expanded', 'false');
    popover.style.display = popover.style.display === 'none' ? 'block' : 'none';
  };

  window.toggleNavMenu = function() {
    popover.style.display = 'none';
    trustPopover.style.display = 'none';
    sharePopover.style.display = 'none';
    document.querySelector('#trust-dropdown .fd-shellbar__button').setAttribute('aria-expanded', 'false');
    document.querySelector('#share-dropdown .fd-shellbar__button').setAttribute('aria-expanded', 'false');
    var btn = document.querySelector('#nav-dropdown .fd-shellbar__button');
    var open = navPopover.style.display === 'block';
    navPopover.style.display = open ? 'none' : 'block';
    btn.setAttribute('aria-expanded', !open);
  };

  window.toggleTrustMenu = function() {
    popover.style.display = 'none';
    navPopover.style.display = 'none';
    sharePopover.style.display = 'none';
    document.querySelector('#nav-dropdown .fd-shellbar__button').setAttribute('aria-expanded', 'false');
    document.querySelector('#share-dropdown .fd-shellbar__button').setAttribute('aria-expanded', 'false');
    var btn = document.querySelector('#trust-dropdown .fd-shellbar__button');
    var open = trustPopover.style.display === 'block';
    trustPopover.style.display = open ? 'none' : 'block';
    btn.setAttribute('aria-expanded', !open);
  };

  window.toggleShareMenu = function() {
    popover.style.display = 'none';
    navPopover.style.display = 'none';
    trustPopover.style.display = 'none';
    document.querySelector('#nav-dropdown .fd-shellbar__button').setAttribute('aria-expanded', 'false');
    document.querySelector('#trust-dropdown .fd-shellbar__button').setAttribute('aria-expanded', 'false');
    var btn = document.querySelector('#share-dropdown .fd-shellbar__button');
    var open = sharePopover.style.display === 'block';
    if (!open) {
      shareUrlInput.value = window.location.href;
      shareStatus.textContent = '';
    }
    sharePopover.style.display = open ? 'none' : 'block';
    btn.setAttribute('aria-expanded', !open);
    if (!open) {
      setTimeout(function() { shareUrlInput.select(); }, 0);
    }
  };

  window.copyShareUrl = function(button) {
    var url = shareUrlInput.value || window.location.href;
    var done = function(ok) {
      shareStatus.textContent = ok ? 'Copied to clipboard' : 'Press Ctrl+C to copy';
      if (ok && button) {
        var orig = button.textContent;
        button.textContent = 'Copied';
        setTimeout(function() { button.textContent = orig; }, 1500);
      }
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(url).then(function() { done(true); }, function() { fallbackCopy(url, done); });
    } else {
      fallbackCopy(url, done);
    }
  };

  function fallbackCopy(text, cb) {
    try {
      shareUrlInput.value = text;
      shareUrlInput.select();
      shareUrlInput.setSelectionRange(0, text.length);
      var ok = document.execCommand('copy');
      cb(ok);
    } catch (e) {
      cb(false);
    }
  }

  document.addEventListener('click', function(e) {
    if (!document.getElementById('user-menu').contains(e.target)) {
      popover.style.display = 'none';
    }
    if (!document.getElementById('nav-dropdown').contains(e.target)) {
      navPopover.style.display = 'none';
      document.querySelector('#nav-dropdown .fd-shellbar__button').setAttribute('aria-expanded', 'false');
    }
    if (!document.getElementById('trust-dropdown').contains(e.target)) {
      trustPopover.style.display = 'none';
      document.querySelector('#trust-dropdown .fd-shellbar__button').setAttribute('aria-expanded', 'false');
    }
    if (!document.getElementById('share-dropdown').contains(e.target)) {
      sharePopover.style.display = 'none';
      document.querySelector('#share-dropdown .fd-shellbar__button').setAttribute('aria-expanded', 'false');
    }
  });

  checkAuth();
})();
</script>
