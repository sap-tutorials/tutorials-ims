<div class="fd-shellbar">
  <div class="fd-shellbar__group fd-shellbar__group--product">
    <a href="/" class="fd-shellbar__logo">
      <img src="/img/sap-logo.svg" alt="SAP">
    </a>
    <span class="fd-shellbar__title">Tutorial Platform</span>
  </div>
  <div class="fd-shellbar__group fd-shellbar__group--actions">
    <div class="shellbar-nav-dropdown" id="nav-dropdown">
      <button type="button" class="fd-shellbar__button" aria-label="Navigation menu" aria-expanded="false" aria-controls="nav-popover" onclick="toggleNavMenu()">
        <i class="sap-icon--megamenu"></i>
        <span class="shellbar-nav-dropdown__label">Navigate</span>
        <i class="sap-icon--slim-arrow-down shellbar-nav-dropdown__arrow"></i>
      </button>
      <div id="nav-popover" class="shellbar-popover">
        <ul class="fd-menu__list" role="menu">
          <li class="fd-menu__item" role="menuitem"><a href="/" class="fd-menu__link"><i class="sap-icon--course-book fd-menu__addon-before"></i><span class="fd-menu__title">Tutorials</span></a></li>
          <li class="fd-menu__item" role="menuitem"><a href="/app-space" class="fd-menu__link"><i class="sap-icon--flight fd-menu__addon-before"></i><span class="fd-menu__title">App Space</span></a></li>
          <li class="fd-menu__item" role="menuitem"><a href="/event-display" class="fd-menu__link"><i class="sap-icon--screen fd-menu__addon-before"></i><span class="fd-menu__title">Event Display</span></a></li>
        </ul>
      </div>
    </div>
    <span class="shellbar-separator"></span>
    <button type="button" class="fd-shellbar__button" aria-label="Joule" title="Joule" onclick="window.open('https://sap-samples.github.io/sap-devs-cli/','_blank')">
      <i class="sap-icon--da"></i>
    </button>
    <button type="button" class="fd-shellbar__button" aria-label="Help" title="Help" onclick="window.open('https://community.sap.com','_blank')">
      <i class="sap-icon--question-mark"></i>
    </button>
    <button type="button" class="fd-shellbar__button shellbar-notifications" aria-label="Notifications" title="Notifications" id="notifications-btn">
      <i class="sap-icon--bell"></i>
      <span class="fd-counter fd-counter--notification" aria-label="unread notifications" id="notification-badge"></span>
    </button>
    <span class="shellbar-separator"></span>
    <button type="button" class="theme-toggle" data-action="toggle-theme" aria-label="Toggle dark mode" title="Toggle dark/light mode">
      <span class="theme-toggle-track">
        <span class="theme-toggle-thumb"></span>
        <svg class="theme-toggle-icon theme-toggle-sun" viewBox="0 0 16 16" width="12" height="12"><circle cx="8" cy="8" r="3.5" fill="currentColor"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.41 1.41M11.54 11.54l1.41 1.41M3.05 12.95l1.41-1.41M11.54 4.46l1.41-1.41" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <svg class="theme-toggle-icon theme-toggle-moon" viewBox="0 0 16 16" width="12" height="12"><path d="M13.36 10.2a5.5 5.5 0 0 1-7.56-7.56A6 6 0 1 0 13.36 10.2z" fill="currentColor"/></svg>
      </span>
    </button>
    <span class="shellbar-separator"></span>
    <div class="fd-shellbar__action" id="user-menu">
      <span id="user-avatar" class="fd-avatar fd-avatar--xs fd-avatar--circle fd-avatar--placeholder" role="button" tabindex="0" aria-label="User profile" onclick="handleProfileClick()"><i class="sap-icon--person-placeholder"></i></span>
      <div id="user-popover" class="fd-popover__body fd-popover__body--right">
        <div class="user-popover__content">
          <div class="user-popover__header">
            <span id="user-avatar-large" class="fd-avatar fd-avatar--xl fd-avatar--circle fd-avatar--placeholder"></span>
            <div id="user-name" class="user-popover__name"></div>
            <div id="user-email" class="user-popover__email"></div>
          </div>
          <hr class="user-popover__separator">
          <a href="https://account.sap.com" class="user-popover__link" target="_blank" rel="noopener">Manage my Account</a>
          <a href="https://www.youtube.com/@sapdevs" class="user-popover__link" target="_blank" rel="noopener">SAP Developers &#x2197;</a>
          <a href="https://learning.sap.com" class="user-popover__link" target="_blank" rel="noopener">Learnings &#x2197;</a>
          <a href="https://community.sap.com" class="user-popover__link" target="_blank" rel="noopener">Community &#x2197;</a>
          <hr class="user-popover__separator">
          <button type="button" class="fd-button fd-button--negative" id="logout-btn" onclick="window.location.href='/logout'">Logout</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
(function() {
  const capBase = document.documentElement.dataset.capBase || '';
  const avatar = document.getElementById('user-avatar');
  const avatarLarge = document.getElementById('user-avatar-large');
  const popover = document.getElementById('user-popover');
  const userName = document.getElementById('user-name');
  const userEmail = document.getElementById('user-email');
  const navPopover = document.getElementById('nav-popover');
  let isAuthenticated = false;

  function applyInitials(givenName, familyName, id) {
    var initials = (givenName?.[0] || '') + (familyName?.[0] || '');
    if (!initials && id) initials = id[0];
    if (initials) {
      [avatar, avatarLarge].forEach(function(el) {
        el.classList.remove('fd-avatar--placeholder');
        el.classList.add('fd-avatar--accent-color-6');
        while (el.firstChild) el.removeChild(el.firstChild);
        el.textContent = initials.toUpperCase();
      });
    }
  }

  async function checkAuth() {
    try {
      const res = await fetch(capBase + '/auth/user', { credentials: 'include' });
      if (!res.ok) return;
      const user = await res.json();
      if (!user.authenticated) return;

      isAuthenticated = true;
      userName.textContent = (user.givenName + ' ' + user.familyName).trim() || user.id;
      userEmail.textContent = user.email || '';
      document.documentElement.dataset.authenticated = 'true';
      avatar.classList.add('fd-avatar--authenticated');
      applyInitials(user.givenName, user.familyName, user.id);
      avatar.setAttribute('aria-label', userName.textContent);
    } catch {}
  }

  window.handleProfileClick = function() {
    if (!isAuthenticated) {
      window.location.href = '/login?returnTo=' + encodeURIComponent(window.location.pathname + window.location.search);
      return;
    }
    navPopover.style.display = 'none';
    popover.style.display = popover.style.display === 'none' ? 'block' : 'none';
  };

  window.toggleNavMenu = function() {
    popover.style.display = 'none';
    var btn = document.querySelector('#nav-dropdown .fd-shellbar__button');
    var open = navPopover.style.display === 'block';
    navPopover.style.display = open ? 'none' : 'block';
    btn.setAttribute('aria-expanded', !open);
  };

  document.addEventListener('click', function(e) {
    if (!document.getElementById('user-menu').contains(e.target)) {
      popover.style.display = 'none';
    }
    if (!document.getElementById('nav-dropdown').contains(e.target)) {
      navPopover.style.display = 'none';
      document.querySelector('#nav-dropdown .fd-shellbar__button').setAttribute('aria-expanded', 'false');
    }
  });

  checkAuth();
})();
</script>
