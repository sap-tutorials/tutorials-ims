<aside class="tutorial-sidebar">
  <nav class="step-toc" aria-label="Steps">
    <h4>Steps</h4>
    <ol class="step-toc-list">
      {{ range .Params.steps }}
      <li class="step-toc-item" data-toc-step="{{ .number }}">
        <a href="#step-{{ .number }}">{{ .title }}</a>
      </li>
      {{ end }}
    </ol>
  </nav>
</aside>
