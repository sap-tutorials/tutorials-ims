{{ with .Params.contributors }}
{{ if gt (len .) 1 }}
<div class="tutorial-contributors-row">
  <span class="contributors-label">Contributors</span>
  <div class="contributors-list">
    {{ range first 3 . }}
    <a href="https://github.com/{{ .login }}" class="contributor-chip" target="_blank" rel="noopener" title="{{ .name }}">
      <img src="https://github.com/{{ .login }}.png?size=28"
           alt="{{ .name }}" class="contributor-avatar"
           onerror="this.classList.add('tutorial-hidden');this.nextElementSibling.classList.remove('tutorial-hidden')"
      />
      <span class="contributor-avatar contributor-avatar-placeholder tutorial-hidden">{{ substr .name 0 1 }}</span>
      <span class="contributor-name">{{ .name }}</span>
    </a>
    {{ end }}
    {{ if gt (len .) 3 }}
    <div class="contributors-overflow-wrapper">
      <button type="button" class="contributors-overflow-btn" aria-expanded="false" aria-haspopup="menu"
              onclick="this.parentElement.classList.toggle('is-open');this.setAttribute('aria-expanded',this.parentElement.classList.contains('is-open'))">
        +{{ sub (len .) 3 }}
      </button>
      <div class="contributors-popover" role="menu" aria-label="More contributors">
        {{ range after 3 . }}
        <a href="https://github.com/{{ .login }}" class="contributor-popover-item" role="menuitem" target="_blank" rel="noopener">
          <img src="https://github.com/{{ .login }}.png?size=24"
               alt="{{ .name }}" class="contributor-popover-avatar"
               onerror="this.classList.add('tutorial-hidden');this.nextElementSibling.classList.remove('tutorial-hidden')"
          />
          <span class="contributor-popover-avatar contributor-popover-avatar-placeholder tutorial-hidden">{{ substr .name 0 1 }}</span>
          <span class="contributor-popover-name">{{ .name }}</span>
        </a>
        {{ end }}
      </div>
    </div>
    {{ end }}
  </div>
</div>
<script>document.addEventListener('click',function(e){document.querySelectorAll('.contributors-overflow-wrapper.is-open').forEach(function(w){if(!w.contains(e.target)){w.classList.remove('is-open');w.querySelector('button').setAttribute('aria-expanded','false')}})})</script>
{{ end }}
{{ end }}
