baseURL = 'https://developers.sap.com/'
languageCode = 'en-us'
title = 'SAP Developer Center'
enableRobotsTXT = false  # we ship our own via the robots output format

[params]
  apiBase = '/api'
  capBase = ''
  brand = 'SAP Developer Center'
  # ui5Split: when true, loads the split UI5 entries (ui5-core, ui5-tutorial, etc.)
  # instead of the monolithic ui5-bootstrap.ts bundle. Flag OFF by default; flip to
  # true once the split entries are validated. (#1777 Task 7)
  ui5Split = false
  defaultDescription = 'Hands-on tutorials for SAP technologies — SAP BTP, ABAP Cloud, CAP, Fiori, HANA Cloud, and integration. Build, learn, and ship on SAP.'
  heroDescription = 'Step-by-step tutorials, multi-tutorial missions, and reference content for every SAP developer technology. Tested, maintained, and free to use.'
  twitterHandle = '@sapdevs'
  defaultOgImage = '/img/og-default.png'
  # Consent Management Platform selector — see docs/superpowers/specs/2026-07-23-trustarc-cmp-integration-design.md
  # 'trustarc' = corporate TrustArc CMP (default, parity with legacy AEM)
  # 'inhouse'  = break-glass fallback to the self-contained banner (hugo/static/js/consent.js)
  # 'off'      = emit no consent UI (QA/preview builds)
  cmp = 'trustarc'
  trustArcDomain = 'sapshared.com'
  trustArcPrivacyLink = 'https://www.sap.com/about/legal/privacy.html'
  trustArcNoticeAssetVersion = 'v1.7-484'

[frontmatter]
  date = ['date', 'createdAt', 'publishDate', ':git', ':fileModTime']
  lastmod = ['lastmod', 'lastUpdated', ':git', ':fileModTime']
  publishDate = ['publishDate', 'createdAt', 'date']

# U1 Object Page floorplan as the default tutorial layout. Mission/group pages have their
# own type folders (layouts/missions, layouts/groups) without a u1-object-page.html, so
# Hugo's lookup chain falls back to their existing single.html for them.
[[cascade]]
  layout = 'u1-object-page'
  [cascade._target]
    path = '/tutorials/**'
    kind = 'page'

[outputs]
  home = ['HTML', 'RSS', 'sitemap', 'robots', 'llms', 'llmsfull']
  section = ['HTML', 'RSS']
  page = ['HTML']

[outputFormats.llms]
  mediaType = 'text/markdown'
  baseName = 'llms'
  isPlainText = true
  notAlternative = true

[outputFormats.llmsfull]
  mediaType = 'text/markdown'
  baseName = 'llms-full'
  isPlainText = true
  notAlternative = true

[outputFormats.robots]
  mediaType = 'text/plain'
  baseName = 'robots'
  isPlainText = true
  notAlternative = true
  protocol = ''

[mediaTypes."text/markdown"]
  suffixes = ['txt', 'md']

[build]
  writeStats = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
        title = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['$$', '$$']]
          inline = [['$', '$']]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = false
    lineNos = false
    tabWidth = 2
