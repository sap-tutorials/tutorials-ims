baseURL = 'https://developers.sap.com/'
languageCode = 'en-us'
title = 'SAP Developers Tutorials'
enableRobotsTXT = false  # we ship our own via the robots output format

[params]
  apiBase = '/api'
  capBase = ''
  brand = 'SAP Developers Tutorials'
  defaultDescription = 'Hands-on tutorials for SAP technologies — SAP BTP, ABAP Cloud, CAP, Fiori, HANA Cloud, and integration. Build, learn, and ship on SAP.'
  heroDescription = 'Step-by-step tutorials, multi-tutorial missions, and reference content for every SAP developer technology. Tested, maintained, and free to use.'
  twitterHandle = '@sapdevs'
  defaultOgImage = '/img/og-default.png'

[frontmatter]
  date = ['date', 'createdAt', 'publishDate', ':git', ':fileModTime']
  lastmod = ['lastmod', 'lastUpdated', ':git', ':fileModTime']
  publishDate = ['publishDate', 'createdAt', 'date']

# U1 Object Page floorplan as the default tutorial layout. Mission/group pages have their
# own type folders (layouts/missions, layouts/groups) without a u1-object-page.html, so
# Hugo's lookup chain falls back to their existing single.html for them.
[[cascade]]
  layout = 'u1-object-page'
  [cascade._target]
    path = '/tutorials/**'
    kind = 'page'

[outputs]
  home = ['HTML', 'RSS', 'sitemap', 'robots', 'llms', 'llmsfull']
  section = ['HTML', 'RSS']
  page = ['HTML']

[outputFormats.llms]
  mediaType = 'text/markdown'
  baseName = 'llms'
  isPlainText = true
  notAlternative = true

[outputFormats.llmsfull]
  mediaType = 'text/markdown'
  baseName = 'llms-full'
  isPlainText = true
  notAlternative = true

[outputFormats.robots]
  mediaType = 'text/plain'
  baseName = 'robots'
  isPlainText = true
  notAlternative = true
  protocol = ''

[mediaTypes."text/markdown"]
  suffixes = ['txt', 'md']

[build]
  writeStats = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
        title = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['$$', '$$']]
          inline = [['$', '$']]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = false
    lineNos = false
    tabWidth = 2
