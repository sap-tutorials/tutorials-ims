# Single source of truth for the top-nav popover (hugo/layouts/partials/header.html)
# AND the ⌘K command palette EXPLORE group (hugo-apps/src/cmd-palette/actions.ts).
#
# header.html renders these groups as a two-level accordion menu and also emits
# the whole tree as JSON in <script id="nav-data">; the palette island reads that
# script at runtime (navActionsFromData) so the two menus can never drift on
# WHICH destinations exist. This killed the drift where Concepts was in the
# palette but not the nav, and Channels/Topics/Browse were in neither.
#
# Per-item fields:
#   id           — stable palette action id (also the accordion leaf key)
#   label        — nav display text (terse: fits a menu row)
#   href         — internal route (all verified to resolve: Hugo layouts / CAP)
#   icon         — nav icon; MUST already be imported in
#                  hugo-apps/src/ui5/ui5-core.ts (the nav renders it via ui5-li;
#                  unregistered icons render blank).
#   keywords     — intent tokens for palette fuzzy-match; at least one required.
#   paletteLabel — OPTIONAL richer label for ⌘K (falls back to `label`). The
#                  verbs carry the self-describing labels added in #817/#1029.
#   paletteIcon  — OPTIONAL palette icon (falls back to `icon`). The palette
#                  renders its own icon font, so it can use names the nav's
#                  ui5-li registry does not carry (wrench, shield, group, …).
#
# Auth/role-gated items (My Completions, Event Display, Admin UI) are NOT here —
# they stay hardcoded in header.html because their visibility is toggled at
# runtime by the nav-auth-only / nav-admin-only classes. Palette-only actions
# (theme toggle, copy URL, Joule, report issue) stay in PALETTE_ACTIONS.
groups:
  - id: learn
    label: Learn
    items:
      - id: explore-learn
        label: Learn
        href: /learn/
        icon: learning-assistant
        paletteLabel: Learn — getting started with SAP for developers
        keywords: [learn, learning, getting started, beginner, fundamentals, onboard, verb]
      - id: explore-build
        label: Build
        href: /build/
        icon: developer-settings
        paletteLabel: Build — apps and services (CAP, ABAP Cloud, Fiori, UI5)
        paletteIcon: wrench
        keywords: [build, cap, abap, fiori, ui5, app, service, verb]
      - id: explore-integrate
        label: Integrate
        href: /integrate/
        icon: chain-link
        paletteLabel: Integrate — connect SAP to non-SAP, APIs, events
        keywords: [integrate, integration, api, events, connectivity, destination, verb]
      - id: explore-model
