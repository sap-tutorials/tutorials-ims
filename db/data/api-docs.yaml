# Phase 4.5 (#746): hand-curated api.sap.com starter corpus.
# 60 entries on day 1; cron extends from here.
# Edit + open PR + merge + redeploy + run seed-api-docs.cjs --commit (or admin UI button).
# Schema: db/data/api-docs.schema.yaml — validated by CI via `npm run validate-api-docs-yaml`.
#
# Coverage matrix (per spec §7.1):
#   - CAP (8) — framework reference + cloud-sdk + cds
#   - S/4HANA Cloud (15) — public OData v2 APIs (Business Partner, Sales Order, etc.)
#   - BTP services (15) — Connectivity, Destination, Identity Authentication, Audit Log, etc.
#   - SAP Build / Workflow / Process Automation (4)
#   - Integration Suite (5) — Cloud Integration, Open Connectors, API Management
#   - Cloud SDK (4) — Java + JavaScript
#   - SAP HANA Cloud (3)
#   - SAP AI Core / Joule (3)
#   - ABAP Cloud / RAP (3)
# Total: 60 entries.

# ============================================================================
# CAP — SAP Cloud Application Programming Model
# ============================================================================

- sourceId: SAP_CAP_NodeJS_API
  title: SAP Cloud Application Programming Model — Node.js Runtime API
  url: https://api.sap.com/package/SAP_CAP_NodeJS_API
  description: |
    Reference documentation for the SAP CAP Node.js runtime API. Covers the
    cds.Service base class, request lifecycle (before/on/after handlers),
    transactional context, and the cds.ql query API.
  category: CAP
  apiType: reference

- sourceId: SAP_CAP_Java_API
  title: SAP Cloud Application Programming Model — Java Runtime API
  url: https://api.sap.com/package/SAP_CAP_Java_API
  description: |
    Reference documentation for the SAP CAP Java runtime API. Covers
    EventHandlers, CqnService, Application Services, persistence services,
    and the @On/@Before/@After annotation model for custom logic.
  category: CAP
  apiType: reference

- sourceId: SAP_CAP_CDS_Reference
  title: SAP CAP — CDS Language Reference
  url: https://api.sap.com/package/SAP_CAP_CDS_Reference
  description: |
    Reference for the CDS (Core Data Services) modeling language used by CAP.
    Covers entity definitions, associations, compositions, annotations,
    aspects, services, and the projection/restriction syntax.
  category: CAP
  apiType: reference

- sourceId: SAP_CAP_CQN_Reference
  title: SAP CAP — Core Query Notation (CQN) Reference
  url: https://api.sap.com/package/SAP_CAP_CQN_Reference
  description: |
    Reference for SAP CAP's Core Query Notation — the canonical query DSL
    used by the CAP runtime. Covers SELECT, INSERT, UPDATE, DELETE, joins,
    projections, and the fluent cds.ql builder API.
  category: CAP
  apiType: reference

- sourceId: SAP_CAP_OData_V4_Reference
  title: SAP CAP — OData v4 Protocol Reference
  url: https://api.sap.com/package/SAP_CAP_OData_V4_Reference
  description: |
    Documentation for OData v4 protocol behavior when exposed via CAP
    services. Covers $expand, $select, $filter, $orderby, deep inserts,
    drafts, and the @cds.draft.enabled / @restrict annotation interactions.
  category: CAP
  apiType: odata-v4

- sourceId: SAP_CAP_REST_Adapter
  title: SAP CAP — REST Protocol Adapter
  url: https://api.sap.com/package/SAP_CAP_REST_Adapter
  description: |
    Reference for the CAP REST adapter — exposes CAP services over plain
    JSON+HTTP without OData conventions. Covers payload shape, custom path
    mapping, and the @rest service annotation.
  category: CAP
  apiType: rest

- sourceId: SAP_CAP_Authentication
  title: SAP CAP — Authentication & Authorization Reference
  url: https://api.sap.com/package/SAP_CAP_Authentication
  description: |
    Reference for the CAP authentication model — @requires, @restrict,
    XSUAA + IAS integration, JWT validation, and the req.user object.
    Covers passport strategies and the mock authentication for local dev.
  category: CAP
  apiType: reference

- sourceId: SAP_CAP_Audit_Logging
  title: SAP CAP — Audit Logging Integration
  url: https://api.sap.com/package/SAP_CAP_Audit_Logging
  description: |
    Reference for the @cap-js/audit-logging plugin. Covers @PersonalData
    annotations, automatic Audit Log Service emission on personal-data
    reads/writes, and the SecurityEvent emission pattern.
  category: CAP
  apiType: reference

