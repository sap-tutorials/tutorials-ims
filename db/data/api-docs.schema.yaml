# Phase 4.5 (#746): JSON-schema sidecar for db/data/api-docs.yaml.
# Validated in CI by scripts/validate-api-docs-yaml.cjs (npm run validate-api-docs-yaml).
$schema: http://json-schema.org/draft-07/schema#
type: array
items:
  type: object
  additionalProperties: false
  required: [sourceId, title, url, description, category, apiType]
  properties:
    sourceId:
      type: string
      pattern: '^[A-Za-z0-9_\-]+$'
      minLength: 1
      maxLength: 120
    title:
      type: string
      minLength: 5
      maxLength: 255
    url:
      type: string
      pattern: '^https://api\.sap\.com/'
      maxLength: 500
    description:
      type: string
      minLength: 20
    category:
      type: string
      minLength: 2
      maxLength: 80
    apiType:
      type: string
      enum: [odata-v2, odata-v4, rest, soap, reference, graphql, other]
