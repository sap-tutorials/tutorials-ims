_schema-version: 3.3.0
ID: tutorials-poc
version: 1.0.0

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm install
        # Single cds build covers all 4 targets (db, srv, db-qa, srv-qa) per
        # .cdsrc.json's build.tasks config. The previous explicit --for db-qa /
        # --for srv-qa lines used deprecated cds-dk flags (--output-dir, plus
        # custom target names not in cds build's --for enum) and broke CI on
        # 2026-06-20 with `Invalid option: --output-dir`. Issue #478.
        - npx cds build --production
        - npm --prefix hugo-apps install
        # NOTE: tutorial fetch (prod + qa) happens BEFORE mbt build via deploy.yml
        # workflow steps (PR #492). mbt's 10-min before-all timeout was burned by
        # rerunning fetch-tutorials here even though caches were warm — Phase 2's
        # metadata prefetch (~4m for 1383 tutorials) is uncached and ran twice.
        # For LOCAL `mbt build` to work standalone, run `npm run fetch-tutorials`
        # first (or use `npm run build:all` which orchestrates fetch + Hugo).
        - npm run validate-tutorials
        - npm --prefix hugo-apps run build
        - npm run copy-joule-vendor
        - curl -fsSL https://github.com/gohugoio/hugo/releases/download/v0.147.7/hugo_extended_0.147.7_linux-amd64.tar.gz -o /tmp/hugo.tar.gz
        - tar -xzf /tmp/hugo.tar.gz -C /tmp hugo
        - /tmp/hugo --source hugo --minify
        # QA fetch also moved to deploy.yml workflow step (see comment above).
        - /tmp/hugo --source hugo --config ../hugo.qa.toml --minify
        - npx tsx scripts/verify-qa-build.ts hugo/public-qa
        - mkdir -p approuter/static/qa
        - cp -r hugo/public-qa/. approuter/static/qa/
        - rm -rf approuter/static/qa/tutorials
        - npx tsx scripts/highlight-cds.ts
        - npm --prefix app/display-app install
        - npm --prefix app/display-app run build
        - mkdir -p approuter/static
        - cp -r hugo/public/. approuter/static/
        - cp hugo/static/tutorials/_nav.json approuter/static/tutorials/_nav.json.bak
        - rm -rf approuter/static/tutorials
        - mkdir -p approuter/static/tutorials && mv approuter/static/tutorials/_nav.json.bak approuter/static/tutorials/_nav.json
        - cp -r app/display-app/dist approuter/static/display-app
        - cp -r app/scanner/webapp approuter/static/scanner-ui

modules:
  - name: tutorials-srv
    type: nodejs
    path: gen/srv
    parameters:
      memory: 1024M
      disk-quota: 1024M
      buildpack: nodejs_buildpack
      # DO NOT raise instances without addressing in-process rate limiters in
      # srv/developer-service.js, srv/lib/ip-rate-limit.js, srv/lib/chat-rate-limit.js.
      # See docs/developers/operations/mta-deployment.md "Scaling Constraints" and TODO §22.
      instances: 1
    properties:
      EXPOSE_CAP_UI: true
      NODE_ENV: production
      # Knowledge graph (PR 7+ of #381): default OFF; flip per-environment via cf set-env.
      # When 'false', `/graph/*` returns 503 (PR 5 gate) and the sidebar island renders nothing.
      KNOWLEDGE_GRAPH_ENABLED: 'false'
      KG_EXTRACT_BUILD_CAP: '200'
      KG_MERGE_SIM_THRESHOLD: '0.92'
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: tutorials-hana
      - name: tutorials-xsuaa
      - name: tutorials-destination
      - name: tutorials-mail
      - name: tutorials-audit-log
      - name: tutorials-cloud-logging

  - name: tutorials-srv-qa
    type: nodejs
    path: gen/srv-qa
    parameters:
      memory: 512M
      disk-quota: 1024M
      buildpack: nodejs_buildpack
      instances: 1
    properties:
      EXPOSE_CAP_UI: false
      NODE_ENV: production
    provides:
      - name: srv-qa-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: tutorials-hana-qa
      - name: tutorials-xsuaa

  - name: tutorials-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: tutorials-hana
      - name: tutorials-cloud-logging   # forwards deployer stdout to Cloud Logging (~30 days), not just cf logs ring buffer (~30 min). Closes the forensic gap from #257.
      - name: tutorials-kg-grantor      # supplies the SPARQL QUERY/UPDATE grants to default_access_role via db/src/_grants.hdbgrants. See docs/developers/operations/kg-grantor-setup.md.

  - name: tutorials-db-qa-deployer
    type: hdb
    path: gen/db-qa
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: tutorials-hana-qa
      - name: tutorials-cloud-logging   # same as tutorials-db-deployer; mirrors the prod binding for QA forensic parity.
      - name: tutorials-kg-grantor-qa   # QA-channel grantor; sibling of tutorials-kg-grantor for the QA HDI container.

  - name: tutorials-approuter
    type: approuter.nodejs
    path: approuter
    build-parameters:
      ignore:
        - default-env.json
        - default-env-admin.json
    parameters:
      disk-quota: 2048M
      memory: 512M
      app-name: tutorials-approuter
    properties:
      XS_APP_LOG_LEVEL: info
    requires:
      - name: tutorials-xsuaa
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
      - name: srv-qa-api
        group: destinations
        properties:
          name: srv-qa-api
          url: ~{srv-url}
          forwardAuthToken: true

resources:
  - name: tutorials-hana
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
      service-name: tutorials-hana

  - name: tutorials-hana-qa
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
      service-name: tutorials-hana-qa

  - name: tutorials-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      service-name: tutorials-xsuaa
      path: ./xs-security.json

  - name: tutorials-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  - name: tutorials-mail
    type: org.cloudfoundry.user-provided-service
    optional: true

  - name: tutorials-audit-log
    type: org.cloudfoundry.managed-service
    optional: true
    parameters:
      service: auditlog
      service-plan: premium

  - name: tutorials-cloud-logging
    type: org.cloudfoundry.managed-service
    optional: true
    parameters:
      service: cloud-logging
      service-plan: standard
      config:
        ingest_otlp:
          enabled: true

  # Knowledge-graph SPARQL grantor (PR #381 / KG PR 2). User-provided service holding
  # credentials for a HANA user that already owns SPARQL QUERY/SPARQL UPDATE WITH ADMIN
  # OPTION. Consumed by tutorials-db-deployer + db/src/_grants.hdbgrants to add those
  # privileges to the HDI container's default_access_role. Per-environment setup is in
  # docs/developers/operations/kg-grantor-setup.md.
  - name: tutorials-kg-grantor
    type: org.cloudfoundry.user-provided-service
    parameters:
      service-name: tutorials-kg-grantor

  # QA-channel sibling of tutorials-kg-grantor. Bound to tutorials-db-qa-deployer.
  - name: tutorials-kg-grantor-qa
    type: org.cloudfoundry.user-provided-service
    parameters:
      service-name: tutorials-kg-grantor-qa
