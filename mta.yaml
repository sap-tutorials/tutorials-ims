_schema-version: 3.3.0
ID: tutorials-poc
version: 1.0.0

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm install
        - npx cds build --production
        - npm --prefix apps install
        - npm run fetch-tutorials -- --target hugo
        - npm run validate-tutorials
        - npm --prefix apps run build
        - curl -fsSL https://github.com/gohugoio/hugo/releases/download/v0.147.7/hugo_extended_0.147.7_linux-amd64.tar.gz | tar -xz -C /tmp hugo
        - /tmp/hugo --source hugo --minify
        - npx tsx scripts/highlight-cds.ts
        - npm --prefix display-app install
        - npm --prefix display-app run build
        - mkdir -p approuter/static
        - cp -r hugo/public/* approuter/static/
        - cp -r display-app/dist approuter/static/display-app

modules:
  - name: tutorials-srv
    type: nodejs
    path: gen/srv
    parameters:
      memory: 1024M
      disk-quota: 1024M
      buildpack: nodejs_buildpack
      instances: 1
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: tutorials-hana
      - name: tutorials-xsuaa
      - name: tutorials-destination
      - name: tutorials-mail

  - name: tutorials-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: tutorials-hana

  - name: tutorials-approuter
    type: approuter.nodejs
    path: approuter
    parameters:
      disk-quota: 2048M
      memory: 512M
      app-name: tutorials-approuter
    properties:
      XS_APP_LOG_LEVEL: info
    requires:
      - name: tutorials-xsuaa
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
      - name: tutorials-html5-repo-rt

  - name: tutorials-admin-ui-deployer
    type: com.sap.html5.application-content
    path: app
    build-parameters:
      builder: custom
      commands:
        - npm --prefix admin/events install && npm --prefix admin/events run build
        - npm --prefix admin/missions install && npm --prefix admin/missions run build
        - npm --prefix admin/groups install && npm --prefix admin/groups run build
        - npm --prefix admin/accomplishments install && npm --prefix admin/accomplishments run build
        - npm --prefix admin/prizes install && npm --prefix admin/prizes run build
        - npm --prefix admin/tutorials install && npm --prefix admin/tutorials run build
        - npm --prefix admin/tags install && npm --prefix admin/tags run build
        - npm --prefix admin/operations install && npm --prefix admin/operations run build
        - npm --prefix admin/accounts install && npm --prefix admin/accounts run build
        - npm --prefix admin-custom install && npm --prefix admin-custom run build
      supported-platforms: []
    requires:
      - name: tutorials-html5-repo-host
        parameters:
          content-target: true

resources:
  - name: tutorials-hana
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: tutorials-hana

  - name: tutorials-xsuaa
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: xsuaa-imsdev

  - name: tutorials-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  - name: tutorials-mail
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: mail-imsdev
    optional: true

  - name: tutorials-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  - name: tutorials-html5-repo-rt
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
