_schema-version: 3.3.0
ID: tutorials-poc
version: 1.0.0

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm install
        # Run cds build, hugo-apps install, and display-app install+build in
        # parallel — they're independent of each other. cds build is the long
        # pole (~15s); the other two complete during its window. Saves ~20-40s
        # vs the previous fully-serial chain. Display-app's bash invocation
        # chains `install && run build` so the build only fires if install
        # succeeded.
        #
        # Single cds build covers all 4 targets (db, srv, db-qa, srv-qa) per
        # .cdsrc.json's build.tasks config. The previous explicit --for db-qa /
        # --for srv-qa lines used deprecated cds-dk flags (--output-dir, plus
        # custom target names not in cds build's --for enum) and broke CI on
        # 2026-06-20 with `Invalid option: --output-dir`. Issue #478.
        - bash -c 'set -e; npx cds build --production & p1=$!; npm --prefix hugo-apps install & p2=$!; (npm --prefix app/display-app install && npm --prefix app/display-app run build) & p3=$!; wait $p1; wait $p2; wait $p3'
        # NOTE: tutorial fetch (prod + qa) happens BEFORE mbt build via deploy.yml
        # workflow steps (PR #492). mbt's 10-min before-all timeout was burned by
        # rerunning fetch-tutorials here even though caches were warm — Phase 2's
        # metadata prefetch (~4m for 1383 tutorials) is uncached and ran twice.
        # For LOCAL `mbt build` to work standalone, run `npm run fetch-tutorials`
        # first (or use `npm run build:all` which orchestrates fetch + Hugo).
        # Run 4 independent pre-Hugo-build tasks in parallel. They have no
        # interdependencies and all complete before the Hugo build at the next
        # step needs their outputs:
        #   - validate-tutorials: reads hugo/content/tutorials/ (populated by
        #     deploy.yml's prefetch step), independent of all others
        #   - hugo-apps build: Vite compile of hugo-apps/src/ → hugo/static/js/
        #   - copy-joule-vendor: cp from @sap/joule-* to hugo/static/
        #   - Hugo binary download: curl + tar to /tmp/hugo (skipped on cache hit)
        # Wall-clock = slowest single task (~10-15s) vs sum (~25-40s). Saves
        # 10-15s on every run.
        # If any task throws, set -e + the explicit `wait` per pid surfaces
        # the failure (vs a single `wait` that loses exit codes).
        # Hugo binary download — skip if already present (deploy.yml caches it
        # in /tmp/hugo across CI runs via actions/cache@v4). Local `mbt build`
        # invocations fall through to the curl path on first run; cached after.
        # Version bumps to this URL automatically invalidate the CI cache too
        # (deploy.yml's cache key is hashFiles('mta.yaml')).
        - 'bash -c ''set -e; npm run validate-tutorials & p1=$!; npm --prefix hugo-apps run build & p2=$!; npm run copy-joule-vendor & p3=$!; { [ -x /tmp/hugo ] || (curl -fsSL https://github.com/gohugoio/hugo/releases/download/v0.147.7/hugo_extended_0.147.7_linux-amd64.tar.gz -o /tmp/hugo.tar.gz && tar -xzf /tmp/hugo.tar.gz -C /tmp hugo); } & p4=$!; wait $p1; wait $p2; wait $p3; wait $p4'''
        # Run prod + QA Hugo builds in parallel. They write to different
        # output dirs (hugo/public/ vs hugo/public-qa/) so they don't collide
        # on output. They DO share hugo/resources/_gen/ for image-resize
        # cache, but Hugo uses BoltDB there with proper inter-process
        # locking. Saves ~30-60s on every run.
        # QA fetch was moved to deploy.yml workflow step (see fetch comment above).
        - bash -c 'set -e; /tmp/hugo --source hugo --minify & p1=$!; /tmp/hugo --source hugo --config ../hugo.qa.toml --minify & p2=$!; wait $p1; wait $p2'
        - npx tsx scripts/verify-qa-build.ts hugo/public-qa
        - mkdir -p approuter/static/qa
        - cp -r hugo/public-qa/. approuter/static/qa/
        - rm -rf approuter/static/qa/tutorials
        - npx tsx scripts/highlight-cds.ts
        # display-app install + build moved to the parallel block at the top
        # of before-all (runs alongside cds build + hugo-apps install).
        - mkdir -p approuter/static
        - cp -r hugo/public/. approuter/static/
        - cp hugo/static/tutorials/_nav.json approuter/static/tutorials/_nav.json.bak
        - rm -rf approuter/static/tutorials
        - mkdir -p approuter/static/tutorials && mv approuter/static/tutorials/_nav.json.bak approuter/static/tutorials/_nav.json
        - cp -r app/display-app/dist approuter/static/display-app
        - cp -r app/scanner/webapp approuter/static/scanner-ui

modules:
  - name: tutorials-srv
    type: nodejs
    path: gen/srv
    parameters:
      memory: 1024M
      disk-quota: 1024M
      buildpack: nodejs_buildpack
      # DO NOT raise instances without addressing in-process rate limiters in
      # srv/developer-service.js, srv/lib/ip-rate-limit.js, srv/lib/chat-rate-limit.js.
      # See docs/developers/operations/mta-deployment.md "Scaling Constraints" and TODO §22.
      instances: 1
    properties:
      EXPOSE_CAP_UI: true
      NODE_ENV: production
      # Knowledge graph (PR 7+ of #381): default OFF; flip per-environment via cf set-env.
      # When 'false', `/graph/*` returns 503 (PR 5 gate) and the sidebar island renders nothing.
      KNOWLEDGE_GRAPH_ENABLED: 'false'
      KG_EXTRACT_BUILD_CAP: '200'
      KG_MERGE_SIM_THRESHOLD: '0.92'
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: tutorials-hana
      - name: tutorials-xsuaa
      - name: tutorials-destination
      - name: tutorials-mail
      - name: tutorials-audit-log
      - name: tutorials-cloud-logging
      - name: tutorials-credstore

  - name: tutorials-srv-qa
    type: nodejs
    path: gen/srv-qa
    parameters:
      memory: 512M
      disk-quota: 1024M
      buildpack: nodejs_buildpack
      instances: 1
    properties:
      EXPOSE_CAP_UI: false
      NODE_ENV: production
    provides:
      - name: srv-qa-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: tutorials-hana-qa
      - name: tutorials-xsuaa
      - name: tutorials-credstore

  - name: tutorials-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: tutorials-hana
      - name: tutorials-cloud-logging   # forwards deployer stdout to Cloud Logging (~30 days), not just cf logs ring buffer (~30 min). Closes the forensic gap from #257.
      - name: tutorials-kg-grantor      # supplies the SPARQL QUERY/UPDATE grants to default_access_role via db/src/_grants.hdbgrants. See docs/developers/operations/kg-grantor-setup.md.

  - name: tutorials-db-qa-deployer
    type: hdb
    path: gen/db-qa
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: tutorials-hana-qa
      - name: tutorials-cloud-logging   # same as tutorials-db-deployer; mirrors the prod binding for QA forensic parity.
      - name: tutorials-kg-grantor-qa   # QA-channel grantor; sibling of tutorials-kg-grantor for the QA HDI container.

  - name: tutorials-approuter
    type: approuter.nodejs
    path: approuter
    build-parameters:
      ignore:
        - default-env.json
        - default-env-admin.json
    parameters:
      disk-quota: 2048M
      memory: 512M
      app-name: tutorials-approuter
    properties:
      XS_APP_LOG_LEVEL: info
    requires:
      - name: tutorials-xsuaa
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
      - name: srv-qa-api
        group: destinations
        properties:
          name: srv-qa-api
          url: ~{srv-url}
          forwardAuthToken: true

resources:
  - name: tutorials-hana
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
      service-name: tutorials-hana

  - name: tutorials-hana-qa
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
      service-name: tutorials-hana-qa

  - name: tutorials-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      service-name: tutorials-xsuaa
      path: ./xs-security.json

  - name: tutorials-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  - name: tutorials-mail
    type: org.cloudfoundry.user-provided-service
    optional: true

  - name: tutorials-audit-log
    type: org.cloudfoundry.managed-service
    optional: true
    parameters:
      service: auditlog
      service-plan: premium

  - name: tutorials-cloud-logging
    type: org.cloudfoundry.managed-service
    optional: true
    parameters:
      service: cloud-logging
      service-plan: standard
      config:
        ingest_otlp:
          enabled: true

  # Knowledge-graph SPARQL grantor (PR #381 / KG PR 2). User-provided service holding
  # credentials for a HANA user that already owns SPARQL QUERY/SPARQL UPDATE WITH ADMIN
  # OPTION. Consumed by tutorials-db-deployer + db/src/_grants.hdbgrants to add those
  # privileges to the HDI container's default_access_role. Per-environment setup is in
  # docs/developers/operations/kg-grantor-setup.md.
  - name: tutorials-kg-grantor
    type: org.cloudfoundry.user-provided-service
    parameters:
      service-name: tutorials-kg-grantor

  # QA-channel sibling of tutorials-kg-grantor. Bound to tutorials-db-qa-deployer.
  - name: tutorials-kg-grantor-qa
    type: org.cloudfoundry.user-provided-service
    parameters:
      service-name: tutorials-kg-grantor-qa

  # BTP Credential Store (Phase 2-C / #465). Holds the encrypted VALUES of the
  # Secrets entity's metadata rows. Default plan + basic auth on the binding;
  # responses are JWE-encrypted on the wire and decrypted in srv/lib/credstore.js
  # using the binding's encryption.client_private_key. Per-environment instance
  # (DEV/QA/PROD each get their own credstore). Provisioning runbook lives in
  # docs/developers/operations/runtime-config.md (Phase 2-C section).
  - name: tutorials-credstore
    type: org.cloudfoundry.managed-service
    parameters:
      service: credstore
      service-plan: default
      service-name: tutorials-credstore
      config:
        authentication: basic
