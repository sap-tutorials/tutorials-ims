_schema-version: 3.3.0
ID: tutorials-poc
version: 1.0.0

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm install
        - npm run fetch-tutorials
        - npm run validate-tutorials
        - npm run build
        - cd display-app && npm install && npm run build && cd ..
        - mkdir -p approuter/static
        - cp -r site/.vitepress/dist/* approuter/static/
        - cp -r display-app/dist approuter/static/display-app

modules:
  - name: tutorials-approuter
    type: approuter.nodejs
    path: approuter
    parameters:
      disk-quota: 256M
      memory: 256M
      app-name: tutorials-approuter
    properties:
      destinations: >
        [
          {
            "name": "tutorials-api",
            "url": "https://imsdev.cfapps.us30.hana.ondemand.com",
            "forwardAuthToken": true
          }
        ]
      XS_APP_LOG_LEVEL: info
    requires:
      - name: tutorials-xsuaa

resources:
  - name: tutorials-xsuaa
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: xsuaa-imsdev
