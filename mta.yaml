_schema-version: 3.3.0
ID: tutorials-poc
version: 1.0.0

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm install
        - npx cds build --production
        - npm --prefix apps install
        - npm run fetch-tutorials -- --target hugo
        - npm run validate-tutorials
        - npm --prefix apps run build
        - curl -fsSL https://github.com/gohugoio/hugo/releases/download/v0.147.7/hugo_extended_0.147.7_linux-amd64.tar.gz -o /tmp/hugo.tar.gz
        - tar -xzf /tmp/hugo.tar.gz -C /tmp hugo
        - /tmp/hugo --source hugo --minify
        - npx tsx scripts/highlight-cds.ts
        - npm --prefix display-app install
        - npm --prefix display-app run build
        - mkdir -p approuter/static
        - cp -r hugo/public/* approuter/static/
        - cp hugo/static/tutorials/_nav.json approuter/static/tutorials/_nav.json.bak
        - rm -rf approuter/static/tutorials
        - mkdir -p approuter/static/tutorials && mv approuter/static/tutorials/_nav.json.bak approuter/static/tutorials/_nav.json
        - cp -r display-app/dist approuter/static/display-app
        - cp -r app/scanner/webapp approuter/static/scanner-ui

modules:
  - name: tutorials-srv
    type: nodejs
    path: gen/srv
    parameters:
      memory: 1024M
      disk-quota: 1024M
      buildpack: nodejs_buildpack
      instances: 1
    properties:
      EXPOSE_CAP_UI: true
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: tutorials-hana
      - name: tutorials-xsuaa
      - name: tutorials-destination
      - name: tutorials-mail
      - name: tutorials-audit-log
      - name: tutorials-cloud-logging

  - name: tutorials-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: tutorials-hana

  - name: tutorials-approuter
    type: approuter.nodejs
    path: approuter
    build-parameters:
      ignore:
        - default-env.json
        - default-env-admin.json
    parameters:
      disk-quota: 2048M
      memory: 512M
      app-name: tutorials-approuter
    properties:
      XS_APP_LOG_LEVEL: info
    requires:
      - name: tutorials-xsuaa
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
      - name: tutorials-html5-repo-rt

  - name: tutorials-admin-ui-deployer
    type: com.sap.html5.application-content
    path: app/admin-shell
    build-parameters:
      builder: custom
      commands:
        - npm install && npm run build
      build-result: dist
    requires:
      - name: tutorials-html5-repo-host
        parameters:
          content-target: true

resources:
  - name: tutorials-hana
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
      service-name: tutorials-hana

  - name: tutorials-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      service-name: tutorials-xsuaa
      path: ./xs-security.json

  - name: tutorials-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  - name: tutorials-mail
    type: org.cloudfoundry.managed-service
    parameters:
      service: mail
      service-plan: standard
      service-name: tutorials-mail
    optional: true

  - name: tutorials-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  - name: tutorials-html5-repo-rt
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime

  - name: tutorials-audit-log
    type: org.cloudfoundry.managed-service
    optional: true
    parameters:
      service: auditlog
      service-plan: premium

  - name: tutorials-cloud-logging
    type: org.cloudfoundry.managed-service
    optional: true
    parameters:
      service: cloud-logging
      service-plan: standard
      config:
        ingest_otlp:
          enabled: true
