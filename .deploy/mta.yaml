_schema-version: 3.3.0
# MTA identity. Renamed from `tutorials-poc` 2026-06-29 (#635). The MTA `ID:`
# is what Cloud Foundry uses to track the deployment registration. Every
# `resources:` entry below declares an explicit `service-name:` so the rename
# does NOT cascade into service-instance recreation — the existing
# tutorials-hana / tutorials-xsuaa / tutorials-credstore / etc. instances are
# adopted by the new MTA registration. Runbook:
# docs/developers/operations/mta-deployment.md §Rename cutover.
ID: tutorials-ims
version: 1.0.0

# Full MTA for deploying: db-deployer + CAP srv + approuter (with admin UI).
#
# Usage:
#   cd .deploy
#   mbt build
#   cf deploy mta_archives/tutorials-ims_1.0.0.mtar -e ../deploy/dev.mtaext
#
# Or deploy a single module:
#   cf deploy mta_archives/tutorials-ims_1.0.0.mtar --module tutorials-srv

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm --prefix .. install
        - bash -c "cd .. && npm run prebuild:parsers-bundle"
        - bash -c "cd .. && npx cds build --production"
        - bash -c "cd .. && node -e 'for (const p of [\"gen/db/src/gen/.hdiconfig\",\"gen/db-qa/src/gen/.hdiconfig\"]) { const fs=require(\"fs\"); const d=JSON.parse(fs.readFileSync(p,\"utf8\")); d.file_suffixes=d.file_suffixes||{}; d.file_suffixes.hdbprocedure={plugin_name:\"com.sap.hana.di.procedure\"}; fs.writeFileSync(p, JSON.stringify(d,null,2)+\"\\n\"); }'"
        - bash -c "rm -f ../gen/db-qa/src/gen/sap.changelog.*.hdbindex"
        # Build app/explore + emit the bundle manifest into hugo/data/.
        # Hugo reads site.Data.explore_bundle at template-render time
        # (see hugo/layouts/explore/single.html) to inject hashed JS/CSS
        # filenames into /explore's HTML. The Hugo build runs upstream
        # of this MTA build in deploy.yml, but emitting into hugo/data/
        # keeps both mta files symmetric and ensures any future inline
        # Hugo step here would see the manifest.
        - bash -c "cd .. && npm --prefix app/explore install --no-audit --no-fund"
        - bash -c "cd .. && npm --prefix app/explore run build"
        - bash -c "cd .. && npx tsx scripts/build-explore-manifest.ts app/explore/dist hugo/data/explore_bundle.json"
        - cp ../xs-security.json .

modules:
  - name: tutorials-db-deployer
    type: hdb
    path: ../gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: tutorials-hana
      - name: tutorials-cloud-logging   # forwards deployer stdout to Cloud Logging (~30 days), not just cf logs ring buffer (~30 min). Closes the forensic gap from #257.
      - name: tutorials-kg-grantor      # supplies SPARQL QUERY/UPDATE grants to default_access_role via db/src/_grants.hdbgrants. See docs/developers/operations/kg-grantor-setup.md.

  - name: tutorials-db-qa-deployer
    type: hdb
    path: ../gen/db-qa
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: tutorials-hana-qa
      - name: tutorials-cloud-logging   # same as tutorials-db-deployer; mirrors the prod binding for QA forensic parity.
      - name: tutorials-kg-grantor-qa   # QA-channel grantor; sibling of tutorials-kg-grantor for the QA HDI container.

  - name: tutorials-srv
    type: nodejs
    path: ../gen/srv
    parameters:
      memory: 1024M
      disk-quota: 1024M
      buildpack: nodejs_buildpack
      # DO NOT raise instances without addressing in-process rate limiters in
      # srv/developer-service.js, srv/lib/ip-rate-limit.js, srv/lib/chat-rate-limit.js.
      # See docs/developers/operations/mta-deployment.md "Scaling Constraints" and TODO §22.
      instances: 1
    properties:
      NODE_ENV: production
      EXPOSE_CAP_UI: false
      # Knowledge graph (PR 7+ of #381): default OFF; flip per-environment via cf set-env.
      # When 'false', `/graph/*` returns 503 (PR 5 gate) and the sidebar island renders nothing.
      KNOWLEDGE_GRAPH_ENABLED: 'false'
      KG_EXTRACT_BUILD_CAP: '200'
      KG_MERGE_SIM_THRESHOLD: '0.92'
      # NOTE: CONTENT_API_KEY, GITHUB_DISPATCH_TOKEN, SMTP_HOST/PORT/USER/FROM
      # and REBUILD_TARGET_ENV used to live here. All resolved from the BTP
      # Credential Store now (via srv/lib/secret-resolver.js) or TenantSettings
      # (via the admin UI). Mirror of the note in the sibling mta.yaml.
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: tutorials-hana
      - name: tutorials-xsuaa
      - name: tutorials-destination
      - name: tutorials-audit-log
      - name: tutorials-cloud-logging
      - name: tutorials-aicore
      - name: tutorials-credstore

  - name: tutorials-srv-qa
    type: nodejs
    path: ../gen/srv-qa
    parameters:
      memory: 768M
      disk-quota: 1024M
      buildpack: nodejs_buildpack
      instances: 1
    build-parameters:
      builder: custom
      commands:
        - mkdir -p hugo
        - cp -r ../../preview-site ./preview-site
        - cp -r ../../hugo/layouts ./hugo/layouts
        - cp -r ../../hugo/static  ./hugo/static
        - cp -r ../../hugo/assets  ./hugo/assets
        - cp -r ../../hugo/data    ./hugo/data
        - cp -r ../../hugo/i18n    ./hugo/i18n
        - bash -c "mkdir -p srv/jobs && mkdir -p srv/handlers && mkdir -p srv/lib/branch && mkdir -p srv/lib/runtime-config && mkdir -p srv/lib/prompts && mkdir -p srv/lib/kg && cp ../../srv/lib/branch/condition.js ../../srv/lib/branch/engine.js ../../srv/lib/branch/ranker.js ../../srv/lib/branch/user-state.js ../../srv/lib/branch/loaders.js ../../srv/lib/branch/mission-detail.js ../../srv/lib/branch/slug-key.js ../../srv/lib/branch/decide.js ../../srv/lib/branch/joule-tool.js ../../srv/lib/branch/branch-telemetry.js ../../srv/lib/branch/group-by-alt.js ../../srv/lib/branch/profile-fields.js ../../srv/lib/branch/profile-override.js srv/lib/branch/ && cp ../../srv/lib/runtime-config/kg-settings.js ../../srv/lib/runtime-config/ui-events-settings.js ../../srv/lib/runtime-config/search-settings.js ../../srv/lib/runtime-config/navigator-settings.js ../../srv/lib/runtime-config/display-settings.js ../../srv/lib/runtime-config/tenant-settings.js srv/lib/runtime-config/ && cp ../../srv/lib/kg/on-demand-enqueue.js ../../srv/lib/kg/on-demand-cosine-rank.js srv/lib/kg/ && cp ../../srv/lib/credstore.js ../../srv/lib/secret-resolver.js ../../srv/lib/content-store.js ../../srv/lib/content-publish-session.js ../../srv/lib/resolve-tutorial-author.js ../../srv/lib/_tutorials-table.js ../../srv/lib/catalog-renderer.js ../../srv/lib/catalog-data.js ../../srv/lib/catalog-mission-hierarchy.js ../../srv/lib/chrome-shell.js ../../srv/lib/pipeline-log.js ../../srv/lib/legacy-id.js ../../srv/lib/embedding-pipeline.js ../../srv/lib/step-text-extractor.js ../../srv/lib/embedding-client.js ../../srv/lib/step-vectors.js ../../srv/lib/user-progress.js ../../srv/lib/co-completion.js ../../srv/lib/tutorial-centroid.js ../../srv/lib/tag-label-map.js ../../srv/lib/code-check-tool.js ../../srv/lib/code-check-prompt.js ../../srv/lib/code-check-handler.js ../../srv/lib/code-check-llm.js ../../srv/lib/code-check-step-loader.js ../../srv/lib/code-check-spec-publish.js ../../srv/lib/validate-answer-spec-publish.js ../../srv/lib/category-classifier.js ../../srv/lib/category-classifier-llm.js ../../srv/lib/category-seed-embeddings.js ../../srv/lib/build-catalog-categories.js ../../srv/lib/chat-settings-resolver.js ../../srv/lib/kg-extract.js ../../srv/lib/kg-queries.js ../../srv/lib/kg-projection.js ../../srv/lib/kg-similarity.js ../../srv/lib/kg-cycles.js ../../srv/lib/kg-graph-rebuild.js ../../srv/lib/kg-sparql-client.js ../../srv/lib/kg-merge-pair.js ../../srv/lib/kg-concept-loader.js ../../srv/lib/kg-neighborhood-cache.js ../../srv/lib/kg-neighborhood-merge.js ../../srv/lib/kg-neighborhood-full-helpers.js ../../srv/lib/kg-other-resources-loader.js ../../srv/lib/kg-stamp-meta-text.js ../../srv/lib/kg-tutorial-teaches-map.js ../../srv/lib/kg-resource-type-config.js ../../srv/lib/kg-meta-formatters.js ../../srv/lib/discovery-mission-categories.js ../../srv/lib/external-content-ttl.js ../../srv/lib/recompute-tutorial-progress-bulk-sql.js ../../srv/lib/youtube-fetcher.js ../../srv/lib/homepage-events-merger.js ../../srv/lib/homepage-rss-fetcher.js ../../srv/lib/rss-parse.js ../../srv/lib/community-blogs-fetcher.js ../../srv/lib/community-blogs-classifier.js ../../srv/lib/safe-fetch.js ../../srv/lib/explainer-generator.js ../../srv/lib/_token-cost.js ../../srv/lib/metrics.js ../../srv/lib/relevance-classifier.js ../../srv/lib/relevance-seed-embeddings.js ../../srv/lib/relevance-keyword-rules.js ../../srv/lib/canonicalize-link.js ../../srv/lib/detect-language-en.js srv/lib/ && cp ../../srv/handlers/categories-after-hooks.js ../../srv/handlers/completion-path-items-altgroup.js srv/handlers/ && mkdir -p srv && cp ../../srv/content-moderation-service.js srv/ && cp ../../srv/jobs/consolidate-concepts-job.js ../../srv/jobs/extract-concepts-job.js ../../srv/jobs/job-lock.js ../../srv/jobs/secret-expiry-check.js ../../srv/jobs/homepage-link-health.js ../../srv/jobs/kg-ondemand-job.js ../../srv/jobs/community-blogs-fetch-job.js ../../srv/jobs/community-blogs-classify-job.js ../../srv/jobs/fetch-news-job.js srv/jobs/ && cp ../../srv/lib/prompts/explainer-verb.md ../../srv/lib/prompts/explainer-shelf.md ../../srv/lib/prompts/explainer-shelf-entry.md ../../srv/lib/prompts/community-blogs-classifier.md srv/lib/prompts/"
        - bash -c "node -e \"const p=require('./package.json'); p.dependencies=Object.assign(p.dependencies||{},{cheerio:'^1.2.0','@sap-ai-sdk/foundation-models':'^2.10.0'}); require('fs').writeFileSync('./package.json', JSON.stringify(p,null,2));\""
    properties:
      EXPOSE_CAP_UI: false
      NODE_ENV: production
    provides:
      - name: srv-qa-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: tutorials-hana-qa
      - name: tutorials-xsuaa
      - name: tutorials-credstore

  - name: tutorials-approuter
    type: approuter.nodejs
    path: ../approuter
    build-parameters:
      builder: custom
      # 30m instead of mbt's 10m default — approuter build cp's ~527MB
      # (hugo/public 323M + hugo/public-qa 204M) into static/, which routinely
      # runs 6-9 min on Windows. Killed at the 10-min mark 2026-07-07 mid-copy
      # of public-qa; bumping gives headroom as content grows.
      timeout: 30m
      commands:
        - npm install
        # cp -r is union, not sync — it ADDS files but never DELETES them. Renames in
        # any source directory would leave ghost files in approuter/static/ that ship
        # with every deploy until manually removed (caught Tom 2026-06-18 PR #405:
        # AdvocatePhotoController.controller.js still served alongside the new .js).
        # Wipe each static dir BEFORE cp'ing fresh content. Hugo public, qa, admin-ui,
        # analytics-ui, scanner-ui all need this; everything not under static/ here
        # (e.g. node_modules, package.json) is preserved.
        - rm -rf static/admin-ui static/analytics-ui static/scanner-ui static/explore-ui static/data-inspector-ui static/qa
        - cp -r ../hugo/public/. static/
        - rm -rf static/tutorials
        - mkdir -p static/qa
        - cp -r ../hugo/public-qa/. static/qa/
        - rm -rf static/qa/tutorials
        - npm --prefix ../app/admin-shell install
        - npm --prefix ../app/admin-shell run build
        - mkdir -p static/admin-ui
        - cp -r ../app/admin-shell/dist/. static/admin-ui/
        - npm --prefix ../app/analytics-explorer install
        - npm --prefix ../app/analytics-explorer run build
        - mkdir -p static/analytics-ui
        - cp -r ../app/analytics-explorer/dist/. static/analytics-ui/
        - mkdir -p static/explore-ui
        - cp -r ../app/explore/dist/. static/explore-ui/
        - cp -r ../app/scanner/webapp static/scanner-ui
        # Data Inspector UI (#999) — bundled inside @cap-js/data-inspector's
        # node_modules. Rewrite the UI5 bootstrap CDN in index.html from
        # sapui5.hana.ondemand.com (plugin default) to ui5.sap.com — the
        # approuter's CSP script-src only allowlists ui5.sap.com.
        - mkdir -p static/data-inspector-ui
        - cp -r ../node_modules/@cap-js/data-inspector/app/data-inspector-ui/webapp/. static/data-inspector-ui/
        - sed -i 's|https://sapui5.hana.ondemand.com/|https://ui5.sap.com/|g' static/data-inspector-ui/index.html
      ignore:
        - default-env.json
        - default-env-admin.json
        - "static/tutorials/"
    parameters:
      disk-quota: 2048M
      memory: 512M
      app-name: tutorials-approuter
      instances: 1                  # Lower bound; Autoscaler manages up to instance_max_count via binding-level config in requires below (#749)
    properties:
      XS_APP_LOG_LEVEL: info
    requires:
      - name: tutorials-xsuaa
      # #867 — approuter reads REBUILD_API_KEY from credstore via
      # approuter/lib/credstore-secret.js. Same binding the srv uses.
      - name: tutorials-credstore
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
      - name: srv-qa-api
        group: destinations
        properties:
          name: srv-qa-api
          url: ~{srv-url}
          forwardAuthToken: true
      # CF Autoscaler binding (#749 phase-1). Policy is inlined here per
      # SAP BTP convention — putting it on the resource block via path: is
      # silently ignored. Range 1..4, CPU 70% / 30% thresholds. Memory metric
      # not included — approuter is CPU-bound. See scaling-playbook.md row #1.
      - name: tutorials-autoscaler
        parameters:
          config:
            instance_min_count: 1
            instance_max_count: 4
            scaling_rules:
              - metric_type: cpu
                threshold: 70
                operator: ">="
                adjustment: "+1"
                breach_duration_secs: 120
                cool_down_secs: 180
              - metric_type: cpu
                threshold: 30
                operator: "<"
                adjustment: "-1"
                breach_duration_secs: 300
                cool_down_secs: 300

resources:
  - name: tutorials-hana
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
      service-name: tutorials-hana

  - name: tutorials-hana-qa
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
      service-name: tutorials-hana-qa

  - name: tutorials-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      service-name: tutorials-xsuaa
      config-path: xs-security.json

  - name: tutorials-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      service-name: tutorials-destination

  - name: tutorials-audit-log
    type: org.cloudfoundry.managed-service
    optional: true
    parameters:
      service: auditlog
      service-plan: standard
      service-name: tutorials-audit-log

  - name: tutorials-cloud-logging
    type: org.cloudfoundry.managed-service
    optional: true
    parameters:
      service: cloud-logging
      service-plan: standard
      service-name: tutorials-cloud-logging
      config:
        ingest_otlp:
          enabled: true

  - name: tutorials-aicore
    type: org.cloudfoundry.managed-service
    optional: true
    parameters:
      service: aicore
      service-plan: extended
      service-name: tutorials-aicore

  # Knowledge-graph SPARQL grantor (PR #381 / KG PR 2). User-provided service holding
  # credentials for a HANA user that already owns SPARQL QUERY/SPARQL UPDATE WITH ADMIN
  # OPTION. Consumed by tutorials-db-deployer + db/src/_grants.hdbgrants to add those
  # privileges to the HDI container's default_access_role. Per-environment setup is in
  # docs/developers/operations/kg-grantor-setup.md.
  - name: tutorials-kg-grantor
    type: org.cloudfoundry.user-provided-service
    parameters:
      service-name: tutorials-kg-grantor

  # QA-channel sibling of tutorials-kg-grantor. Bound to tutorials-db-qa-deployer.
  - name: tutorials-kg-grantor-qa
    type: org.cloudfoundry.user-provided-service
    parameters:
      service-name: tutorials-kg-grantor-qa

  # BTP Credential Store (Phase 2-C / #465). Holds the encrypted VALUES of the
  # Secrets entity's metadata rows. Default plan + basic auth on the binding;
  # responses are JWE-encrypted on the wire and decrypted in srv/lib/credstore.js
  # using the binding's encryption.client_private_key. Per-environment instance
  # (DEV/QA/PROD each get their own credstore). Provisioning runbook lives in
  # docs/developers/operations/runtime-config.md (Phase 2-C section).
  - name: tutorials-credstore
    type: org.cloudfoundry.managed-service
    parameters:
      service: credstore
      service-plan: standard
      service-name: tutorials-credstore

  # CF Application Autoscaler (#749 phase-1). Binds to tutorials-approuter
  # with policy inlined at the requires block above. The resource declares
  # ONLY service + plan; policy lives at the binding level. Pre-deploy guard:
  # `cf marketplace | grep -iE 'autoscaler'` must return ≥1 plan.
  - name: tutorials-autoscaler
    type: org.cloudfoundry.managed-service
    parameters:
      service: autoscaler
      service-plan: standard
      service-name: tutorials-autoscaler
