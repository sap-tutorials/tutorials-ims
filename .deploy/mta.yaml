_schema-version: 3.3.0
ID: tutorials-poc
version: 1.0.0

# Full MTA for deploying: db-deployer + CAP srv + approuter (with admin UI).
#
# Usage:
#   cd .deploy
#   mbt build
#   cf deploy mta_archives/tutorials-poc_1.0.0.mtar -e ../deploy/dev.mtaext
#
# Or deploy a single module:
#   cf deploy mta_archives/tutorials-poc_1.0.0.mtar --module tutorials-srv

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm --prefix .. install
        - bash -c "cd .. && npm run prebuild:parsers-bundle"
        - bash -c "cd .. && npx cds build --production"
        - bash -c "cd ../gen/db/src/gen && jq '.file_suffixes.hdbprocedure={\"plugin_name\":\"com.sap.hana.di.procedure\"}' .hdiconfig > .hdiconfig.tmp && mv .hdiconfig.tmp .hdiconfig"
        - bash -c "cd ../gen/db-qa/src/gen && jq '.file_suffixes.hdbprocedure={\"plugin_name\":\"com.sap.hana.di.procedure\"}' .hdiconfig > .hdiconfig.tmp && mv .hdiconfig.tmp .hdiconfig"
        - bash -c "rm -f ../gen/db-qa/src/gen/sap.changelog.*.hdbindex"
        - cp ../xs-security.json .

modules:
  - name: tutorials-db-deployer
    type: hdb
    path: ../gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: tutorials-hana
      - name: tutorials-cloud-logging   # forwards deployer stdout to Cloud Logging (~30 days), not just cf logs ring buffer (~30 min). Closes the forensic gap from #257.
      - name: tutorials-kg-grantor      # supplies SPARQL QUERY/UPDATE grants to default_access_role via db/src/_grants.hdbgrants. See docs/developers/operations/kg-grantor-setup.md.

  - name: tutorials-db-qa-deployer
    type: hdb
    path: ../gen/db-qa
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: tutorials-hana-qa
      - name: tutorials-cloud-logging   # same as tutorials-db-deployer; mirrors the prod binding for QA forensic parity.
      - name: tutorials-kg-grantor-qa   # QA-channel grantor; sibling of tutorials-kg-grantor for the QA HDI container.

  - name: tutorials-srv
    type: nodejs
    path: ../gen/srv
    parameters:
      memory: 1024M
      disk-quota: 1024M
      buildpack: nodejs_buildpack
      # DO NOT raise instances without addressing in-process rate limiters in
      # srv/developer-service.js, srv/lib/ip-rate-limit.js, srv/lib/chat-rate-limit.js.
      # See docs/developers/operations/mta-deployment.md "Scaling Constraints" and TODO §22.
      instances: 1
    properties:
      NODE_ENV: production
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: tutorials-hana
      - name: tutorials-xsuaa
      - name: tutorials-destination
      - name: tutorials-mail
      - name: tutorials-audit-log
      - name: tutorials-cloud-logging
      - name: tutorials-aicore

  - name: tutorials-srv-qa
    type: nodejs
    path: ../gen/srv-qa
    parameters:
      memory: 768M
      disk-quota: 1024M
      buildpack: nodejs_buildpack
      instances: 1
    build-parameters:
      builder: custom
      commands:
        - mkdir -p hugo
        - cp -r ../../preview-site ./preview-site
        - cp -r ../../hugo/layouts ./hugo/layouts
        - cp -r ../../hugo/static  ./hugo/static
        - cp -r ../../hugo/assets  ./hugo/assets
        - cp -r ../../hugo/data    ./hugo/data
        - cp -r ../../hugo/i18n    ./hugo/i18n
        - bash -c "mkdir -p srv/jobs && mkdir -p srv/handlers && mkdir -p srv/lib/branch && cp ../../srv/lib/branch/condition.js ../../srv/lib/branch/engine.js ../../srv/lib/branch/ranker.js ../../srv/lib/branch/user-state.js ../../srv/lib/branch/loaders.js ../../srv/lib/branch/mission-detail.js ../../srv/lib/branch/slug-key.js ../../srv/lib/branch/decide.js ../../srv/lib/branch/joule-tool.js ../../srv/lib/branch/branch-telemetry.js ../../srv/lib/branch/group-by-alt.js ../../srv/lib/branch/profile-fields.js ../../srv/lib/branch/profile-override.js srv/lib/branch/ && cp ../../srv/lib/content-store.js ../../srv/lib/content-publish-session.js ../../srv/lib/_tutorials-table.js ../../srv/lib/catalog-renderer.js ../../srv/lib/catalog-data.js ../../srv/lib/chrome-shell.js ../../srv/lib/pipeline-log.js ../../srv/lib/legacy-id.js ../../srv/lib/embedding-pipeline.js ../../srv/lib/step-text-extractor.js ../../srv/lib/embedding-client.js ../../srv/lib/step-vectors.js ../../srv/lib/user-progress.js ../../srv/lib/co-completion.js ../../srv/lib/tutorial-centroid.js ../../srv/lib/tag-label-map.js ../../srv/lib/code-check-tool.js ../../srv/lib/code-check-prompt.js ../../srv/lib/code-check-handler.js ../../srv/lib/code-check-llm.js ../../srv/lib/code-check-step-loader.js ../../srv/lib/code-check-spec-publish.js ../../srv/lib/category-classifier.js ../../srv/lib/category-classifier-llm.js ../../srv/lib/category-seed-embeddings.js ../../srv/lib/build-catalog-categories.js ../../srv/lib/chat-settings-resolver.js ../../srv/lib/kg-extract.js ../../srv/lib/kg-queries.js ../../srv/lib/kg-projection.js ../../srv/lib/kg-similarity.js ../../srv/lib/kg-cycles.js ../../srv/lib/kg-graph-rebuild.js ../../srv/lib/kg-sparql-client.js ../../srv/lib/kg-merge-pair.js ../../srv/lib/kg-concept-loader.js ../../srv/lib/recompute-tutorial-progress-bulk-sql.js srv/lib/ && cp ../../srv/handlers/categories-after-hooks.js ../../srv/handlers/completion-path-items-altgroup.js srv/handlers/ && cp ../../srv/jobs/consolidate-concepts-job.js ../../srv/jobs/extract-concepts-job.js ../../srv/jobs/job-lock.js srv/jobs/"
        - bash -c "node -e \"const p=require('./package.json'); p.dependencies=Object.assign(p.dependencies||{},{cheerio:'^1.2.0','@sap-ai-sdk/foundation-models':'^2.10.0'}); require('fs').writeFileSync('./package.json', JSON.stringify(p,null,2));\""
    properties:
      EXPOSE_CAP_UI: false
      NODE_ENV: production
    provides:
      - name: srv-qa-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: tutorials-hana-qa
      - name: tutorials-xsuaa

  - name: tutorials-approuter
    type: approuter.nodejs
    path: ../approuter
    build-parameters:
      builder: custom
      commands:
        - npm install
        # cp -r is union, not sync — it ADDS files but never DELETES them. Renames in
        # any source directory would leave ghost files in approuter/static/ that ship
        # with every deploy until manually removed (caught Tom 2026-06-18 PR #405:
        # AdvocatePhotoController.controller.js still served alongside the new .js).
        # Wipe each static dir BEFORE cp'ing fresh content. Hugo public, qa, admin-ui,
        # analytics-ui, scanner-ui all need this; everything not under static/ here
        # (e.g. node_modules, package.json) is preserved.
        - rm -rf static/admin-ui static/analytics-ui static/scanner-ui static/qa
        - cp -r ../hugo/public/. static/
        - rm -rf static/tutorials
        - mkdir -p static/qa
        - cp -r ../hugo/public-qa/. static/qa/
        - rm -rf static/qa/tutorials
        - npm --prefix ../app/admin-shell install
        - npm --prefix ../app/admin-shell run build
        - mkdir -p static/admin-ui
        - cp -r ../app/admin-shell/dist/. static/admin-ui/
        - npm --prefix ../app/analytics-explorer install
        - npm --prefix ../app/analytics-explorer run build
        - mkdir -p static/analytics-ui
        - cp -r ../app/analytics-explorer/dist/. static/analytics-ui/
        - cp -r ../app/scanner/webapp static/scanner-ui
      ignore:
        - default-env.json
        - default-env-admin.json
        - "static/tutorials/"
    parameters:
      disk-quota: 2048M
      memory: 512M
      app-name: tutorials-approuter
    properties:
      XS_APP_LOG_LEVEL: info
    requires:
      - name: tutorials-xsuaa
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
      - name: srv-qa-api
        group: destinations
        properties:
          name: srv-qa-api
          url: ~{srv-url}
          forwardAuthToken: true

resources:
  - name: tutorials-hana
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
      service-name: tutorials-hana

  - name: tutorials-hana-qa
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
      service-name: tutorials-hana-qa

  - name: tutorials-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      service-name: tutorials-xsuaa
      config-path: xs-security.json

  - name: tutorials-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      service-name: tutorials-destination

  - name: tutorials-mail
    type: org.cloudfoundry.managed-service
    parameters:
      service: mail
      service-plan: standard
      service-name: tutorials-mail
    optional: true

  - name: tutorials-audit-log
    type: org.cloudfoundry.managed-service
    optional: true
    parameters:
      service: auditlog
      service-plan: standard
      service-name: tutorials-audit-log

  - name: tutorials-cloud-logging
    type: org.cloudfoundry.managed-service
    optional: true
    parameters:
      service: cloud-logging
      service-plan: standard
      service-name: tutorials-cloud-logging
      config:
        ingest_otlp:
          enabled: true

  - name: tutorials-aicore
    type: org.cloudfoundry.managed-service
    optional: true
    parameters:
      service: aicore
      service-plan: extended
      service-name: tutorials-aicore

  # Knowledge-graph SPARQL grantor (PR #381 / KG PR 2). User-provided service holding
  # credentials for a HANA user that already owns SPARQL QUERY/SPARQL UPDATE WITH ADMIN
  # OPTION. Consumed by tutorials-db-deployer + db/src/_grants.hdbgrants to add those
  # privileges to the HDI container's default_access_role. Per-environment setup is in
  # docs/developers/operations/kg-grantor-setup.md.
  - name: tutorials-kg-grantor
    type: org.cloudfoundry.user-provided-service
    parameters:
      service-name: tutorials-kg-grantor

  # QA-channel sibling of tutorials-kg-grantor. Bound to tutorials-db-qa-deployer.
  - name: tutorials-kg-grantor-qa
    type: org.cloudfoundry.user-provided-service
    parameters:
      service-name: tutorials-kg-grantor-qa
