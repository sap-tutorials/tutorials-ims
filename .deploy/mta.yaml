_schema-version: 3.3.0
ID: tutorials-poc
version: 1.0.0

# Full MTA for deploying: db-deployer + CAP srv + approuter (with admin UI).
#
# Usage:
#   cd .deploy
#   mbt build
#   cf deploy mta_archives/tutorials-poc_1.0.0.mtar -e ../deploy/dev.mtaext
#
# Or deploy a single module:
#   cf deploy mta_archives/tutorials-poc_1.0.0.mtar --module tutorials-srv

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm --prefix .. install
        - npx --prefix .. cds build --production
        - cp ../xs-security.json .

modules:
  - name: tutorials-db-deployer
    type: hdb
    path: ../gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: tutorials-hana

  - name: tutorials-srv
    type: nodejs
    path: ../gen/srv
    parameters:
      memory: 1024M
      disk-quota: 1024M
      buildpack: nodejs_buildpack
      instances: 1
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: tutorials-hana
      - name: tutorials-xsuaa
      - name: tutorials-destination
      - name: tutorials-mail
      - name: tutorials-audit-log
      - name: tutorials-cloud-logging

  - name: tutorials-approuter
    type: approuter.nodejs
    path: ../approuter
    build-parameters:
      builder: custom
      commands:
        - npm install
        - npm --prefix ../app/admin-shell install
        - npm --prefix ../app/admin-shell run build
        - mkdir -p static/admin-ui
        - cp -r ../app/admin-shell/dist/. static/admin-ui/
        - cp -r ../app/scanner/webapp static/scanner-ui
      ignore:
        - default-env.json
        - default-env-admin.json
        - "static/tutorials/"
    parameters:
      disk-quota: 2048M
      memory: 512M
      app-name: tutorials-approuter
    properties:
      XS_APP_LOG_LEVEL: info
    requires:
      - name: tutorials-xsuaa
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true

resources:
  - name: tutorials-hana
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
      service-name: tutorials-hana

  - name: tutorials-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      service-name: tutorials-xsuaa
      config-path: xs-security.json

  - name: tutorials-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      service-name: tutorials-destination

  - name: tutorials-mail
    type: org.cloudfoundry.managed-service
    parameters:
      service: mail
      service-plan: standard
      service-name: tutorials-mail
    optional: true

  - name: tutorials-audit-log
    type: org.cloudfoundry.managed-service
    optional: true
    parameters:
      service: auditlog
      service-plan: standard
      service-name: tutorials-audit-log

  - name: tutorials-cloud-logging
    type: org.cloudfoundry.managed-service
    optional: true
    parameters:
      service: cloud-logging
      service-plan: standard
      service-name: tutorials-cloud-logging
      config:
        ingest_otlp:
          enabled: true
