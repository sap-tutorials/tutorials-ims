<!DOCTYPE html>
<html><body>
  <h1>How to bind XSUAA</h1>
  <div id="step-1" class="tutorial-step" data-step="1">
    <div class="step-header" data-action="toggle-step">
      <span class="step-check-circle"></span>
      <div class="step-header-text">
        <span class="step-label">Step 1</span>
        <span class="step-title-text">Install the dependency</span>
      </div>
    </div>
    <div class="step-body">
      <hr class="step-divider" />
      <div class="step-content">
        <p>First, install the dependency:</p>
        <pre><code>npm install @sap/xsuaa</code></pre>
      </div>
      <div class="step-validation-mount" data-step="1"></div>
      <div class="step-actions">
        <button class="fd-button fd-button--emphasized" data-action="mark-done" data-step="1">Done</button>
      </div>
    </div>
  </div>
  <div id="step-2" class="tutorial-step" data-step="2">
    <div class="step-header" data-action="toggle-step">
      <span class="step-check-circle"></span>
      <div class="step-header-text">
        <span class="step-label">Step 2</span>
        <span class="step-title-text">Bind the service</span>
      </div>
    </div>
    <div class="step-body" hidden>
      <hr class="step-divider" />
      <div class="step-content">
        <p>Bind the service via mta.yaml.</p>
      </div>
      <div class="step-validation-mount" data-step="2"></div>
      <div class="step-actions">
        <button class="fd-button fd-button--emphasized" data-action="mark-done" data-step="2">Done</button>
      </div>
    </div>
  </div>
</body></html>
